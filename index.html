<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<meta name="theme-color" content="#140a0e"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TBZ夏日游乐场"/>
<link rel="apple-touch-icon" href="./icons/icon-180.png"/>
<link rel="icon" type="image/png" href="./icons/icon-192.png"/>
<title>THRILL-ING 夏日游乐场 · 捡手机（中度恐怖）</title>
<style>
:root{
  --bg:#0a0608;--sky:#140a0e;--card:rgba(80,16,24,.22);--card2:rgba(120,20,30,.28);
  --ink:#f3e6e6;--muted:#a88a8a;--accent:#c0392b;--danger:#ff2a2a;--warn:#e67e22;
  --ok:#6b8f71;--glass:rgba(20,8,10,.78);--radius:16px;
  --phone-w:390px;--phone-h:844px;
  --blood:#8b0000;--crimson:#c41e3a;--clot:#4a0a0f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:
  radial-gradient(ellipse at 50% 0%,rgba(120,0,20,.35),transparent 55%),
  radial-gradient(ellipse at 30% 20%,#2a0a12,#080406 70%);
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{width:min(100vw,var(--phone-w));height:min(100dvh,var(--phone-h));position:relative}
.phone{transition:filter 2.8s ease;width:100%;height:100%;background:
    radial-gradient(ellipse at 50% 110%,rgba(100,0,0,.35),transparent 50%),
    linear-gradient(180deg,#1a0c10,#0a0508 60%,#050203);
  border-radius:28px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.7),inset 0 0 0 2px rgba(180,40,40,.15);
  position:relative}
.phone::before{content:"";pointer-events:none;position:absolute;inset:0;z-index:55;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 100%);
  box-shadow:inset 0 0 60px 10px rgba(40,0,0,.45)}
.blood-drip{position:absolute;top:0;left:12%;width:3px;height:0;background:linear-gradient(#8b0000,#4a0a0f);
  opacity:.55;z-index:56;pointer-events:none;animation:drip 7s ease-in infinite}
.blood-drip:nth-child(2){left:78%;animation-delay:2.4s;width:2px}
.blood-drip:nth-child(3){left:44%;animation-delay:4.1s;width:2.5px}
@keyframes drip{0%{height:0;opacity:0}15%{opacity:.6}70%{height:42px;opacity:.45}100%{height:58px;opacity:0}}
.stain{position:absolute;width:70px;height:40px;border-radius:60% 40% 50% 50%;
  background:radial-gradient(ellipse,rgba(120,0,0,.35),transparent 70%);pointer-events:none;z-index:1;filter:blur(2px)}
.glitch-text{animation:gtxt 3.2s steps(2) infinite;text-shadow:1px 0 #c0392b,-1px 0 #1a1a2e}
@keyframes gtxt{0%,90%,100%{transform:none;opacity:1}92%{transform:translate(2px,-1px);opacity:.85}94%{transform:translate(-2px,1px)}}

.phone.low-bat{filter:brightness(.72)}
.phone.low-bat::after{content:"";pointer-events:none;position:absolute;inset:0;
  box-shadow:inset 0 0 80px 30px rgba(0,0,0,.75);z-index:50}
.phone.calm{background:linear-gradient(180deg,#4a3a50 0%,#33405c 42%,#20283a 100%);
  box-shadow:0 24px 80px rgba(20,20,40,.5),inset 0 0 0 2px rgba(240,199,125,.3);
  --accent:#f0a860;--card:rgba(255,224,170,.10);--card2:rgba(255,224,170,.16);
  filter:saturate(1.06)}
.phone.calm::before{background:radial-gradient(ellipse at 50% 0%,rgba(255,170,90,.26),transparent 46%),
  radial-gradient(ellipse at center,transparent 58%,rgba(20,18,40,.3) 100%);
  box-shadow:inset 0 0 36px 6px rgba(120,80,40,.18)}
.phone.calm .glitch-text{animation:none;text-shadow:none}
.phone.uneasy{background:linear-gradient(180deg,#242b26 0%,#1a1f1e 55%,#121414 100%);
  box-shadow:0 24px 80px rgba(0,0,0,.55),inset 0 0 0 2px rgba(102,123,115,.22);
  filter:saturate(.82)}
.phone.uneasy::before{background:radial-gradient(ellipse at 50% 0%,rgba(102,123,115,.14),transparent 46%),
  radial-gradient(ellipse at center,transparent 46%,rgba(0,0,0,.5) 100%);
  box-shadow:inset 0 0 60px 10px rgba(10,20,14,.5)}
.step-card{background:linear-gradient(160deg,rgba(255,214,160,.16),rgba(20,28,40,.72));
  border:1px solid rgba(255,196,140,.45);border-radius:16px;padding:14px;margin:10px 0}
.phone.uneasy .step-card,.phone.horror .step-card{background:rgba(80,16,24,.4);border-color:rgba(192,57,43,.45)}
.phone.horror{background:linear-gradient(180deg,#20242e 0%,#14171e 58%,#0c0e13 100%);
  box-shadow:0 24px 80px rgba(0,0,0,.75),inset 0 0 0 2px rgba(70,85,105,.3);
  filter:saturate(.6) brightness(.94)}
.phone.horror::before{background:radial-gradient(ellipse at 50% 0%,rgba(70,90,120,.1),transparent 44%),
  radial-gradient(ellipse at center,transparent 40%,rgba(0,0,5,.62) 100%);
  box-shadow:inset 0 0 70px 14px rgba(0,0,10,.6)}
.phone.horror .card{background:rgba(24,30,42,.5);border:1px solid rgba(90,110,140,.14)}
.phone.horror .day-strip{background:rgba(38,43,53,.5);border-bottom-color:rgba(90,110,140,.2);color:#9fb2c9}
.step-card .sk{font-size:10px;letter-spacing:.16em;color:#e7b56a;margin-bottom:4px}
.step-card h3{font-size:18px;margin:0 0 6px}
.step-card p{font-size:13px;line-height:1.6;color:#e6d7c8;margin:0 0 10px}
/* —— 主页进度面板 —— */
.prog-card{background:rgba(18,24,34,.62);border:1px solid rgba(120,160,200,.22);border-radius:12px;padding:11px 12px;margin:10px 0}
.phone.horror .prog-card{background:rgba(28,20,30,.66);border-color:rgba(170,80,90,.28)}
.prog-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;color:#9fb8d2;cursor:pointer}
.prog-h b{color:#e6d7c8;font-weight:600;letter-spacing:0}
.prog-h .pg-f{color:#7f93a8;font-size:10px;letter-spacing:0}
.prog-daybar{height:4px;border-radius:3px;background:rgba(255,255,255,.1);margin:8px 0 7px;overflow:hidden}
.prog-daybar i{display:block;height:100%;background:linear-gradient(90deg,#7fb2d8,#e7b56a)}
.prog-goal{font-size:12px;color:#e6d7c8;margin-bottom:9px;line-height:1.5}
.prog-goal span{color:#8a9fb5}
.prog-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.prog-row{cursor:pointer}
.prog-row .pr-t{display:flex;justify-content:space-between;font-size:11px;color:#b9c6d4;margin-bottom:3px}
.prog-row .pr-t b{color:#e8b84b;font-weight:600}
.prog-row.done .pr-t b{color:#7fc9a0}
.prog-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.prog-bar i{display:block;height:100%;background:#6f9fc4;border-radius:3px;transition:width .3s}
.prog-row.done .prog-bar i{background:#5f9e7d}
.prog-card.fold .prog-grid,.prog-card.fold .prog-goal,.prog-card.fold .prog-daybar{display:none}
/* —— 新周目提示 / 轮次档案 —— */
.ng-card{background:linear-gradient(150deg,rgba(90,60,110,.3),rgba(18,24,34,.7));border:1px solid rgba(180,130,200,.32);border-radius:12px;padding:11px 12px;margin:10px 0;cursor:pointer}
.ng-card.locked{background:rgba(20,26,36,.6);border-color:rgba(255,255,255,.12)}
.ng-h{font-size:13px;font-weight:700;color:#e6d7c8;margin-bottom:5px}
.ng-b{font-size:12px;line-height:1.65;color:#b9c6d4}
.ng-go{font-size:11px;color:#d7a7e6;margin-top:7px;text-align:right}
.ng-card.locked .ng-go{color:#8a9fb5}
.ng-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.ng-pill{font-size:10px;padding:3px 7px;border-radius:20px;background:rgba(255,255,255,.07);color:#94a3b3}
.ng-pill.on{background:rgba(150,90,180,.32);color:#f0d8ff}
/* —— 上一轮 · 它都记得（原来没样式）—— */
.meta-ghost{background:rgba(147,112,219,.08);border:1px dashed rgba(147,112,219,.32);border-radius:10px;padding:10px 12px;margin:10px 0}
.mg-t{font-size:11px;letter-spacing:.12em;color:#c9a6dc;margin-bottom:4px}
.mg-b{font-size:12px;line-height:1.65;color:#c3b9cf}
.mg-s{font-size:11px;color:#8a7f96;margin-top:5px}
/* —— 轮次档案 —— */
.arc-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.arc-row b{color:#e8b84b;font-weight:600}
.arc-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;margin:3px 0 9px}
.arc-bar i{display:block;height:100%;background:#9a6fb8;border-radius:3px}
.arc-item{padding:9px 10px;border-radius:9px;background:rgba(255,255,255,.045);margin-top:7px;font-size:12px;line-height:1.6;color:#c3b9cf}
.arc-item.on{background:rgba(150,90,180,.16);border-left:2px solid #b07fd0}
.arc-item .ai-t{color:#e6d7c8;font-weight:600;display:block;margin-bottom:2px}
.arc-item.lock{opacity:.62}

.status-bar{display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px 8px;font-size:11px;background:var(--glass);backdrop-filter:blur(12px);
  flex-shrink:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.06);gap:6px}
.status-bar .left{display:flex;gap:6px;align-items:center;min-width:0;flex:1}
.status-bar .day-clock{font-weight:700;color:#fff;letter-spacing:.02em;white-space:nowrap}
.status-bar .pname{color:var(--accent);font-weight:600;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-strip{flex-shrink:0;padding:6px 14px;font-size:11px;background:rgba(93,173,226,.12);
  border-bottom:1px solid rgba(93,173,226,.2);color:#a8d4f0;z-index:19}
.day-strip b{color:var(--accent)}
.bat{font-weight:700}
.bat-ok{color:var(--ok)}.bat-mid{color:var(--warn)}.bat-low{color:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.screen{flex:1;overflow-y:auto;padding:12px 14px;position:relative;-webkit-overflow-scrolling:touch}
.dock{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px 16px;
  background:var(--glass);backdrop-filter:blur(12px);flex-shrink:0;border-top:1px solid rgba(255,255,255,.06);z-index:20}
.dock button{border:none;cursor:pointer;font:inherit;color:var(--ink);
  background:var(--card);border-radius:12px;padding:10px 2px;font-size:11px;transition:.15s}
.dock button.active{background:rgba(93,173,226,.25);color:var(--accent)}
.dock button:active{transform:scale(.96)}
.btn,.chip,.choice-btn,.pick-card{border:none;cursor:pointer;font:inherit;color:inherit}
.btn{display:block;width:100%;margin:8px 0;padding:12px 14px;border-radius:12px;
  background:var(--card2);box-shadow:0 2px 12px rgba(0,0,0,.2);text-align:left}
.btn.primary{background:linear-gradient(135deg,#7b1e1e,#c0392b);color:#fff;font-weight:600;text-align:center}
.btn.danger{background:rgba(231,76,60,.2);color:#ff8a80;text-align:center}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted);text-align:center}
.btn:active{transform:scale(.98)}
.chip{display:inline-block;margin:4px;padding:6px 12px;border-radius:999px;
  background:var(--card2);font-size:12px}
h1,h2,h3{font-weight:700}
.muted{color:var(--muted);font-size:12px;line-height:1.6}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin:8px 0;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.06)}

/* Title / setup */
.title-screen{text-align:center;padding:48px 12px 20px}
.logo{font-size:28px;font-weight:800;letter-spacing:.06em;background:linear-gradient(90deg,#7ec8ff,#c9a0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tagline{color:var(--muted);margin:8px 0 20px;font-size:13px}
.blurb{font-size:13px;line-height:1.75;color:#a8b8cc;margin-bottom:24px;text-align:left;
  background:var(--card);padding:14px;border-radius:14px;border-left:3px solid var(--accent)}
.setup h2{font-size:17px;margin:16px 0 8px}
.setup input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.3);color:var(--ink);font-size:15px;outline:none}
.setup input:focus{border-color:var(--accent)}
.identity-grid{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.pick-card{background:var(--card2);border-radius:14px;padding:14px;text-align:left;
  border:2px solid transparent;transition:.15s}
.pick-card.selected{border-color:var(--accent);background:rgba(93,173,226,.15)}
.pick-card .nm{font-weight:700;font-size:15px}
.pick-card .desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}

/* Home */
.home-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.app-icon{background:var(--card2);border-radius:18px;padding:16px 8px;text-align:center;
  border:none;color:var(--ink);cursor:pointer;font:inherit}
.app-icon .ico{font-size:26px;display:block;margin-bottom:6px}
.app-icon .lab{font-size:11px;color:var(--muted)}
.home-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.home-time{font-size:42px;font-weight:200;letter-spacing:2px}
.home-date{font-size:13px;color:var(--muted);margin-top:4px}
.alert-banner{background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.3);
  border-radius:12px;padding:10px 12px;font-size:12px;margin:10px 0;color:#ffab91}

/* Chat list */
.chat-row{display:flex;gap:12px;align-items:center;padding:12px 10px;border-radius:14px;
  background:transparent;width:100%;text-align:left;border:none;color:inherit;cursor:pointer;font:inherit}
.chat-row:active,.chat-row:hover{background:var(--card)}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;flex-shrink:0;position:relative;color:#fff}
.avatar .status-strip{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
  font-size:8px;padding:1px 5px;border-radius:6px;white-space:nowrap;font-weight:600}
.st-ok{background:#27ae60}.st-unstable{background:#f39c12}.st-silent{background:#7f8c8d}.st-abnormal{background:#e74c3c}
.chat-meta{flex:1;min-width:0}
.chat-meta .top{display:flex;justify-content:space-between;align-items:baseline}
.chat-meta .name{font-weight:700;font-size:14px}
.chat-meta .time{font-size:11px;color:var(--muted)}
.chat-meta .prev{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{background:var(--danger);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 5px;margin-left:6px}

/* Chat window */
.chat-header{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;position:sticky;top:0;background:#0d1520;z-index:5;padding-top:2px}
.back-btn{background:var(--card);border:none;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
.bubbles{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;min-height:200px}
.bubble{max-width:82%;padding:10px 12px;border-radius:16px;font-size:13px;line-height:1.55;position:relative}
.bubble.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.bubble.me{align-self:flex-end;background:rgba(93,173,226,.3);border-bottom-right-radius:4px}
.bubble.voice{display:flex;align-items:center;gap:8px;cursor:pointer}
.bubble.voice .wave{letter-spacing:1px;opacity:.7}
.bubble.voice.playing .wave{opacity:1;animation:voiceWave .55s infinite alternate}
.bubble.voice.playing{border-color:rgba(192,57,43,.55)}
@keyframes voiceWave{from{transform:translateX(0);opacity:.55}to{transform:translateX(3px);opacity:1}}
.bubble.img{padding:4px;cursor:pointer}
.bubble .read{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
.bubble .read.glitch{color:var(--danger)}
.bubble.sys{align-self:center;background:transparent;color:var(--muted);font-size:11px;max-width:90%;text-align:center}
.photo-thumb{position:relative}
.memo-ghost{border-left:3px solid rgba(200,200,200,.22);opacity:.94}
.memo-ghost .mi-t{font-style:italic;color:#c9c2bd;letter-spacing:.4px}
.memo-ghost .mi-w{color:#8d8884}
.gallery-row.ghost-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px dashed rgba(200,200,200,.32);opacity:.78}
.gallery-row.ghost-row .gb{opacity:.6}
.gallery-row.ghost-tap{opacity:.45;transition:opacity .3s}
.foot-chip{display:inline-block;font-size:11px;color:var(--muted);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:2px 9px;margin:3px 4px 0 0}
.foot-row{margin-top:10px}
.real-late-card{border-left:3px solid rgba(190,80,80,.55);background:rgba(120,40,40,.07)}
.real-late-card p{color:#cfb9b4}
.erode-ghost{opacity:.62}
.bubble.erode-ghost{font-style:italic;color:#9d9490;background:rgba(255,255,255,.03)}
.ph-new{position:absolute;top:5px;right:5px;background:var(--crimson,#c0392b);color:#fff;font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.5)}
/* 撤回的消息：只有一行灰字，点它也没用 */
.bubble.recalled{align-self:flex-start;background:transparent!important;border:1px dashed rgba(255,255,255,.13);color:#75757f;font-size:11px;font-style:italic;cursor:pointer}
.bubble.recalled::before{content:"↺ ";opacity:.55}
/* 群聊：左侧头像 + 名字 + 气泡，时间贴右边 */
.g-row{display:flex;gap:7px;margin:8px 0;align-items:flex-start;width:100%}
.g-row .g-name{font-size:10px;color:#9a9aa4;margin:0 0 2px 3px;letter-spacing:.03em}
.g-row .g-time{font-size:9px;color:#5b5b64;padding-top:13px;white-space:nowrap;flex:0 0 auto}
.g-row .bubble{max-width:100%;word-break:break-word}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.choice-btn{background:rgba(93,173,226,.12);border:1px solid rgba(93,173,226,.3);border-radius:12px;
  padding:10px 12px;text-align:left;font-size:13px;color:var(--ink);cursor:pointer}
.choice-btn:active{background:rgba(93,173,226,.25)}
.proactive{margin-top:8px}
.proactive summary{font-size:12px;color:var(--accent);cursor:pointer;padding:6px}

/* Album */
.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-thumb{aspect-ratio:1;border-radius:10px;background:var(--card2);border:none;cursor:pointer;
  overflow:hidden;position:relative;padding:0}
.photo-thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--muted);background:linear-gradient(135deg,#1e2a3a,#2a1e30);text-align:center;padding:6px;line-height:1.3}
.lightbox{position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:40;display:flex;flex-direction:column;
  padding:16px;overflow-y:auto}
.lightbox .close{align-self:flex-end;margin-bottom:8px}
.lightbox .big{flex:1;min-height:220px;border-radius:14px;background:linear-gradient(160deg,#1a2535,#2a1a28);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:12px}
.lightbox .big .desc{padding:20px;text-align:center;font-size:13px;line-height:1.7;color:#c5d0dc}
.hotspot{position:absolute;width:36px;height:36px;border-radius:50%;border:2px dashed rgba(255,200,100,.5);
  background:rgba(255,200,100,.15);cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 12px rgba(255,200,100,.4)}}

/* Map */
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.map-zone{background:var(--card2);border-radius:14px;padding:16px 12px;border:none;color:var(--ink);
  cursor:pointer;font:inherit;text-align:left;min-height:80px}
.map-zone.locked{opacity:.4;cursor:not-allowed}
.map-zone .zn{font-weight:700;font-size:14px}

/* Day change — full-screen cinematic */
.day-card-overlay{
  position:absolute;inset:0;z-index:95;
  display:flex;align-items:stretch;justify-content:center;
  background:#000;
  animation:dayFadeIn .45s ease-out;
}
@keyframes dayFadeIn{from{opacity:0}to{opacity:1}}
.day-card-overlay::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 50% 30%,rgba(90,40,60,.35),transparent 55%),
    radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.9),transparent 50%),
    linear-gradient(180deg,#0a0c10 0%,#120a12 40%,#050608 100%);
}
.day-card-overlay::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  box-shadow:inset 0 0 80px 40px rgba(0,0,0,.75);
  opacity:.9;
}
.day-card{
  position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;
  padding:36px 22px 28px;max-width:100%;
  animation:dayCardIn .7s cubic-bezier(.2,.8,.2,1);
}
@keyframes dayCardIn{
  0%{opacity:0;transform:scale(.92) translateY(12px);filter:blur(4px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.day-card .tag{
  display:inline-block;font-size:11px;letter-spacing:.35em;text-transform:uppercase;
  padding:4px 12px;border:1px solid rgba(255,180,180,.25);border-radius:999px;
  color:#e8b4b4;margin-bottom:18px;opacity:.85;
}
.day-card .day-num{
  font-size:64px;font-weight:200;letter-spacing:.12em;line-height:1;
  margin:0 0 6px;
  background:linear-gradient(180deg,#fff5f5 10%,#c9a0ff 55%,#5dade2 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;
  animation:dayNumPulse 2.2s ease-in-out infinite;
}
@keyframes dayNumPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.day-card h2{font-size:15px;font-weight:600;color:#d7dee8;margin:0 0 14px;letter-spacing:.2em}
.day-card .when{font-size:13px;color:#8b9bb0;margin-bottom:20px;letter-spacing:.08em}
.day-card .tone{
  font-size:14px;color:#ffb74d;margin:0 0 16px;line-height:1.65;
  max-width:300px;padding:0 8px;
}
.day-card .goal{
  font-size:13px;line-height:1.75;color:#b0bec5;margin:0 0 12px;
  max-width:300px;padding:12px 14px;border-left:2px solid rgba(93,173,226,.5);
  text-align:left;background:rgba(255,255,255,.03);border-radius:0 10px 10px 0;
}
.day-card .tip{font-size:12px;color:#6b7c90;line-height:1.6;max-width:280px;margin:0 0 28px}
.day-card .continue-btn{
  min-width:160px;padding:14px 28px;border-radius:999px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:#e8eef5;font:inherit;font-size:14px;font-weight:600;
  cursor:pointer;letter-spacing:.15em;opacity:.45;pointer-events:none;transition:.35s;
}
.day-card .continue-btn.ready{
  opacity:1;pointer-events:auto;
  background:linear-gradient(135deg,rgba(90,40,60,.8),rgba(58,123,213,.75));
  border-color:rgba(200,160,255,.4);
  box-shadow:0 0 24px rgba(150,80,120,.35);
}
.day-card .continue-btn.ready:active{transform:scale(.97)}
.day-card .hold-hint{font-size:10px;color:#555;margin-top:10px;letter-spacing:.1em;min-height:14px}

/* Phone flash / shake / status pulse on day change */
.phone.day-flash{animation:phoneDayFlash 1.1s ease-out}
@keyframes phoneDayFlash{
  0%{filter:brightness(0.15)}
  25%{filter:brightness(1.35)}
  50%{filter:brightness(0.4)}
  100%{filter:brightness(1)}
}
.phone.day-shake{animation:phoneDayShake .55s ease-out}
@keyframes phoneDayShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-4px)}
  40%{transform:translateX(4px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(2px)}
}
.status-bar .day-clock.day-pulse{
  animation:dayClockPulse 1.8s ease-out;
  color:#fff !important;
}
@keyframes dayClockPulse{
  0%{text-shadow:0 0 0 transparent;transform:scale(1)}
  30%{text-shadow:0 0 16px rgba(201,160,255,.95),0 0 4px #fff;transform:scale(1.08);color:#e8d5ff}
  100%{text-shadow:none;transform:scale(1)}
}
.day-strip.day-pulse{
  animation:stripFlash 1.6s ease-out;
}
/* —— 做旧拍立得相框（照片位：放入 avatars/成员id.jpg 自动做旧）—— */

/* Scare FX — stronger / longer / red flash */
.jump-face,.scare{position:absolute;inset:0;z-index:120;pointer-events:none;display:none;place-items:center;
  background:rgba(80,0,0,.55)}
.jump-face.show,.scare.show{display:grid;animation:redFlash .18s ease-out 2}
@keyframes redFlash{0%{background:rgba(180,0,0,.85)}100%{background:rgba(60,0,0,.5)}}
.jump-face.sil,.scare-map{background:#000}
.jump-face.tiny,.scare-status{place-items:start end;padding:8px 18px 0 0;background:transparent;animation:none}
.jump-face .face-wrap,.scare .face,.jump-face .face{
  width:210px;height:260px;border-radius:46% 46% 42% 42%;
  opacity:.95;filter:blur(3px) contrast(1.15);
  background:
    radial-gradient(circle at 32% 40%, #f5e6d8 0 7px, transparent 9px),
    radial-gradient(circle at 68% 40%, #f5e6d8 0 7px, transparent 9px),
    radial-gradient(ellipse at 50% 58%, rgba(160,0,0,.55), transparent 32%),
    radial-gradient(ellipse at 50% 38%, #2a1010 0%, #0a0404 72%);
  box-shadow:0 0 40px rgba(180,0,0,.55), inset 0 -20px 30px rgba(80,0,0,.4);
  animation:scarePop .75s ease both;
}
.jump-face .face-wrap::after,.jump-face .face::after{
  content:"";position:absolute;left:38%;right:38%;bottom:28%;height:8px;
  background:rgba(120,0,0,.7);border-radius:0 0 12px 12px;filter:blur(1px);
}
.jump-face.clearer .face-wrap,.scare-ending .face{width:260px;height:320px;filter:blur(2px);opacity:1;animation-duration:.9s}
.jump-face.tiny .face-wrap,.scare-status .face{width:28px;height:34px;filter:blur(0.5px);opacity:.9;animation-duration:.45s;border-radius:46%}
.jump-face.sil .face-wrap,.scare-map .face{
  width:120px;height:200px;border-radius:40% 40% 12% 12%;opacity:1;
  background:radial-gradient(ellipse at 50% 30%,#3a1010,#050000 70%);filter:blur(2px);
  box-shadow:0 0 60px #000,0 0 30px rgba(160,0,0,.5);
}

.jump-face.reducing .face-wrap,.scare.soft .face,.jump-reduced .face-wrap{opacity:.35;animation-duration:.35s!important;filter:blur(6px)}
@keyframes scarePop{0%{opacity:0;transform:scale(1.35)}25%{opacity:1}100%{opacity:1;transform:scale(1)}}

.play-hub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}


/* Big home action tiles + expanded dock */
.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
.home-tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 14px;border-radius:16px;border:1px solid rgba(192,57,43,.45);background:linear-gradient(160deg,rgba(80,16,24,.55),rgba(20,4,8,.85));color:var(--ink);font:inherit;cursor:pointer;text-align:left;min-height:72px}
.home-tile .ht-ico{font-size:22px;line-height:1}
.home-tile .ht-lab{font-size:15px;font-weight:700;letter-spacing:.04em}
.home-tile .ht-sub{font-size:11px;color:var(--muted);line-height:1.35}
.home-tile.primary{border-color:rgba(255,138,128,.65);box-shadow:0 0 18px rgba(192,57,43,.25)}
.home-tile.warn{border-color:rgba(255,193,7,.4)}
.home-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.app-icon{min-height:70px}
.app-icon .ico{font-size:28px}
.app-icon .lab{font-size:12px;font-weight:600}
.dock{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 8px 18px;
  background:linear-gradient(180deg,rgba(30,4,8,.0),rgba(20,2,6,.95));border-top:1px solid rgba(192,57,43,.35)}
.dock button{border:none;cursor:pointer;font:inherit;color:var(--ink);
  background:rgba(60,12,18,.55);border-radius:12px;padding:10px 4px;font-size:11px;font-weight:600;line-height:1.25;border:1px solid rgba(255,255,255,.06)}
.dock button .dico{display:block;font-size:18px;margin-bottom:2px}
.dock button.active{background:rgba(192,57,43,.35);color:#ffcdd2;border-color:rgba(255,138,128,.5)}
.dock button:active{transform:scale(.96)}
.suspect-board{background:rgba(0,0,0,.35);border-radius:14px;padding:12px;margin:10px 0;border:1px solid rgba(192,57,43,.35)}
.suspect-board .mark{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;margin-left:6px}
.mark-good{background:rgba(39,174,96,.25);color:#a5d6a7}
.mark-bad{background:rgba(192,57,43,.35);color:#ff8a80}
.mark-unk{background:rgba(255,255,255,.08);color:var(--muted)}
.fake-role{font-size:12px;color:#ffcc80;margin-top:4px;line-height:1.4}
.true-role{font-size:13px;line-height:1.65;margin-top:8px;padding:10px;background:rgba(0,0,0,.35);border-radius:10px;border-left:3px solid var(--crimson)}
.ev-card{background:rgba(40,8,12,.5);border-radius:12px;padding:10px 12px;margin:8px 0;border:1px solid rgba(255,255,255,.08);cursor:pointer}
.ev-card b{display:block;margin-bottom:4px}
.assist-toggle{font-size:12px;margin:8px 0;color:var(--muted)}


.mute-meter{height:14px;border-radius:8px;background:rgba(0,0,0,.5);overflow:hidden;margin:12px 0 8px;border:1px solid rgba(192,57,43,.35)}
.mute-fill{height:100%;background:linear-gradient(90deg,#c0392b,#ff8a80);transition:width .05s linear}
.mute-slider{width:100%;height:36px;accent-color:#c0392b;margin:8px 0}
.mute-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}
.mute-hold{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 14px}
.mute-hold-fill{height:100%;width:0;background:#a5d6a7;transition:width .1s linear}
.wave-bars{display:flex;gap:10px;align-items:flex-end;justify-content:center;height:120px;margin:16px 0;padding:8px;background:rgba(0,0,0,.35);border-radius:14px;border:1px solid rgba(192,57,43,.3)}
.wave-bar{flex:1;max-width:48px;height:40%;border:none;border-radius:8px 8px 4px 4px;background:rgba(255,255,255,.12);cursor:pointer;transition:height .15s,background .15s,opacity .15s}
.wave-bar.on{background:linear-gradient(180deg,#ff8a80,#c0392b);height:85%;box-shadow:0 0 16px rgba(192,57,43,.55);animation:wavePulse 0.9s ease-in-out infinite alternate}
.wave-bar.on:nth-child(2){height:65%;animation-delay:.15s}
.wave-bar.on:nth-child(3){height:95%;animation-delay:.3s}
.wave-bar.on:nth-child(4){height:55%;animation-delay:.45s}
@keyframes wavePulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}


/* ===== 视觉原型层 · 设计令牌（v-proto）＝字体/间距/图标/色彩/层级统一 ===== */
:root{
  --sp-1:6px;--sp-2:10px;--sp-3:14px;--sp-4:20px;
  --r-sm:10px;--r-md:14px;--r-lg:18px;
  --fs-xs:11px;--fs-sm:12.5px;--fs-md:14px;--fs-lg:17px;--fs-xl:21px;
  --tone-ink:var(--ink);--tone-muted:var(--muted);--tone-accent:var(--accent);--tone-card:var(--card);--tone-line:rgba(255,255,255,.08);
}
/* 三态各自的色调令牌：calm=暖金 · uneasy=胶片绿 · horror=蓝灰 */
.phone.calm{--tone-ink:#f5ead6;--tone-muted:rgba(245,234,214,.62);--tone-accent:#f0a860;--tone-line:rgba(240,199,125,.16)}
.phone.uneasy{--tone-ink:#dfe6df;--tone-muted:rgba(223,230,223,.55);--tone-accent:#8fae9d;--tone-line:rgba(102,123,115,.2)}
.phone.horror{--tone-ink:#c9d2e2;--tone-muted:rgba(201,210,226,.5);--tone-accent:#7f97c9;--tone-line:rgba(120,140,180,.16)}
/* 字体与标题层级 */
.phone h1,.phone h2,.phone h3{font-weight:700;letter-spacing:.02em}
.phone h3{font-size:var(--fs-lg);color:var(--tone-ink);margin:0 0 var(--sp-2)}
/* 卡片与间距 */
.phone .card{padding:var(--sp-3);margin:var(--sp-2) 0;border:1px solid var(--tone-line)}
.phone .muted{font-size:var(--fs-xs);line-height:1.7;color:var(--tone-muted)}
.phone .btn{border-radius:var(--r-md);padding:12px var(--sp-3);line-height:1.55}
.phone .chip{font-size:var(--fs-xs)}
/* 图标规格统一 */
.phone .more-cell span{font-size:17px;line-height:1.1;display:block;margin-bottom:3px}
.phone .more-cell b{font-size:var(--fs-xs);font-weight:600}
.phone .app-icon .ico{font-size:19px;line-height:1.1}
/* 状态条与层级 */
.phone .status-bar .day-clock{font-variant-numeric:tabular-nums}
.phone .day-badge{font-size:var(--fs-xs);letter-spacing:.06em}
.phone .back-btn{color:var(--tone-muted)}
.phone .ambient{font-size:var(--fs-xs);color:var(--tone-muted)}
/* 照片异常热点（复用 .hotspot 体系） */
.phone .photo-stage .hotspot{width:46px;height:46px}
.pm-jerk{animation:pmJerk .56s cubic-bezier(.36,.07,.19,.97) both}
@keyframes pmJerk{0%{transform:translate(0,0) rotate(0)}14%{transform:translate(-4px,1px) rotate(-.3deg)}32%{transform:translate(3px,-2px) rotate(.26deg)}50%{transform:translate(-2px,2px) rotate(-.15deg)}68%{transform:translate(2px,-1px) rotate(.1deg)}100%{transform:translate(0,0) rotate(0)}}
.pm-black{position:absolute;inset:0;background:#050405;z-index:9998;pointer-events:none;animation:pmBlack .48s ease forwards}
@keyframes pmBlack{0%{opacity:0}28%{opacity:1}70%{opacity:1}100%{opacity:0}}
.pm-ghostline{display:flex;align-items:center;gap:5px;margin:0 0 12px;padding:10px 12px;border-left:2px solid rgba(192,57,43,.65);background:linear-gradient(90deg,rgba(192,57,43,.11),rgba(192,57,43,0));font-size:14px;color:#e9e2d6;letter-spacing:.06em;transition:opacity 1.3s}
.pm-ghostline.pm-gfade{opacity:0}
.pm-gcaret{display:inline-block;width:1px;height:15px;background:#c0392b;animation:pmCaret 1s steps(1) infinite}
@keyframes pmCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
/* ② 电话 */
.dial-wrap{max-width:300px;margin:0 auto}
.dial-num{font-size:26px;text-align:center;letter-spacing:.14em;min-height:36px;color:#efe7d9;font-family:Consolas,monospace;margin:6px 0 14px}
.dial-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.dial-key{padding:13px 0;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#efe7d9;font-size:19px;font-weight:600}
.dial-key small{display:block;font-size:9px;opacity:.45;font-weight:400;letter-spacing:.2em}
.dial-call{width:64px;height:64px;border-radius:50%;background:#2e7d46;border:1px solid rgba(120,220,150,.5);color:#fff;font-size:26px;margin:0 auto;display:block}
.dial-sub{font-size:11px;color:rgba(233,226,214,.5);text-align:center;margin-top:10px;line-height:1.7}
.call-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,.025)}
.call-row .cn{font-size:14px;color:#efe7d9}
.call-row .cs{font-size:11px;color:rgba(233,226,214,.45)}
.call-row button{margin-left:auto}
.pm-call{position:absolute;inset:0;z-index:9990;background:linear-gradient(175deg,#0c0a0d 0%,#171016 55%,#0a0709 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:26px;animation:pmCallIn .5s ease}
@keyframes pmCallIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pm-call .pc-badge{font-size:12px;letter-spacing:.35em;color:rgba(233,226,214,.5);animation:pmCaret 1.4s steps(1) infinite}
.pm-call .pc-num{font-size:24px;color:#efe7d9;letter-spacing:.1em}
.pm-call .pc-sub{font-size:12px;color:rgba(233,226,214,.55);line-height:1.8;max-width:280px}
.pm-call .pc-btns{display:flex;gap:34px;margin-top:18px}
.pm-call .pc-btn{width:66px;height:66px;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);color:#fff}
.pm-call .pc-accept{background:#2e7d46;box-shadow:0 0 22px rgba(70,180,110,.35)}
.pm-call .pc-decline{background:#8f2f2f;box-shadow:0 0 22px rgba(200,70,70,.3)}
.pm-call .pc-log{font-size:13px;color:#e9e2d6;line-height:2;min-height:120px;max-width:300px;text-align:left}
.pm-call .pc-log div{opacity:0;animation:pcLine .8s ease forwards}
@keyframes pcLine{to{opacity:1}}
.pm-call .pc-nod{font-size:11px;color:rgba(233,226,214,.4);letter-spacing:.2em}
.pm-typing{position:absolute;left:10px;right:10px;bottom:66px;z-index:900;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(20,14,16,.95);border:1px solid rgba(192,57,43,.45);box-shadow:0 6px 26px rgba(0,0,0,.55);font-size:13px;color:#e9e2d6;transition:opacity 1.2s}
.pm-typing.pm-gfade{opacity:0}
.pm-tkey{font-size:12px;opacity:.5}
.pm-ttext{flex:1;letter-spacing:.05em;min-height:1.2em}
.pm-tcaret{display:inline-block;width:1px;height:14px;background:#c0392b;animation:pmCaret 1s steps(1) infinite}
.music-card{background:rgba(40,8,16,.55);border:1px solid rgba(192,57,43,.35);border-radius:14px;padding:12px;margin:8px 0}
.music-card.on{border-color:rgba(255,138,128,.7);box-shadow:0 0 16px rgba(192,57,43,.25)}
.music-card .mc-title{font-weight:700;font-size:13px}
.ping-banner{font-size:12px;color:#ffcc80;margin:6px 0}


/* Fan IF gate — clean light before horror */
.gate-screen{padding:18px 14px 28px;min-height:100%;background:linear-gradient(180deg,#f7f4ef 0%,#ebe4da 55%,#e2d6c8 100%);color:#2a2420}
.gate-logo{font-size:28px;font-weight:800;letter-spacing:.12em;text-align:center;color:#8b1e1e;margin-top:8px}
.gate-sub{text-align:center;font-size:12px;color:#6a5e54;margin:6px 0 14px}
.gate-card{background:#fffdf9;border:1px solid #d9cfc3;border-radius:16px;padding:14px 14px 16px;box-shadow:0 8px 24px rgba(80,40,20,.08)}
.gate-card h3{margin:0 0 8px;font-size:15px;color:#5c2218}
.gate-rules{margin:0 0 12px;padding-left:18px;font-size:12px;line-height:1.65;color:#3d342e}
.gate-rules li{margin:4px 0}
.gate-cd{font-size:12px;font-weight:700;color:#a0452c;margin:8px 0}
.gate-check{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45;margin:8px 0;color:#2a2420}
.gate-check.disabled{opacity:.45}
.gate-check input{margin-top:2px}
.gate-type{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid #cfc4b8;background:#fff;color:#2a2420;font:inherit;margin:8px 0 10px}
.gate-screen .btn.primary{background:#8b1e1e;border-color:#8b1e1e}
.gate-screen .btn.primary:disabled{opacity:.4}
.intro-screen{padding:20px 16px 32px}
.intro-kicker{font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:6px}
.intro-body{font-size:13.5px;line-height:1.85;margin:12px 0 16px;color:#e9dcd6}
.intro-body p{margin:0 0 11px}
.intro-body p:last-child{margin-bottom:0}
.intro-rule{color:#c9b3a8;font-size:12.5px;line-height:1.9;border-left:2px solid rgba(192,57,43,.5);padding-left:11px;margin:0 0 12px !important}
.intro-rule em{color:#e7b56a;font-style:normal;letter-spacing:.05em}
.intro-body b{color:#ff8a80;font-weight:600}
.intro-tips{font-size:11px;line-height:1.85;color:#7d6660;border-top:1px dashed rgba(255,255,255,.1);padding-top:10px;margin:4px 0 14px}
.lore-screen{padding:18px 14px 30px}
.lore-h{font-size:10px;letter-spacing:.2em;color:#e7b56a;margin:0 0 4px}
.lore-lead{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 12px}
.lore-sec{background:rgba(80,16,24,.28);border:1px solid rgba(192,57,43,.26);border-radius:14px;padding:12px 13px;margin:9px 0}
.lore-sec h4{font-size:13.5px;margin:0 0 6px;color:#f2ddcd;font-weight:700}
.lore-sec h4 .tag{font-size:9.5px;letter-spacing:.08em;color:#e7b56a;border:1px solid rgba(231,181,106,.42);border-radius:999px;padding:1px 7px;margin-left:6px;font-weight:400}
.lore-sec p{font-size:12.5px;line-height:1.85;color:#cdbbb2;margin:0 0 6px}
.lore-sec p:last-child{margin-bottom:0}
.lore-sec b{color:#ffb4a8;font-weight:600}
.lore-list{font-size:12.5px;line-height:1.95;color:#e8d6c9;margin:0;padding-left:16px}
.lore-list b{color:#ff8a80}

/* 备忘录（只记男主） */
.memo-lead{display:flex;gap:10px;align-items:center;background:linear-gradient(120deg,rgba(120,60,30,.35),rgba(40,20,16,.55));
  border:1px solid rgba(199,154,99,.32);border-radius:14px;padding:11px 12px;margin:10px 0 12px}
.memo-item{background:rgba(20,14,18,.55);border-left:3px solid #a0714a;border-radius:10px;padding:10px 12px;margin:8px 0}
.memo-item.k-bad{border-left-color:#b0453a}
.memo-item.k-con{border-left-color:#c9a227}
.mi-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.mi-k{font-size:9.5px;letter-spacing:.1em;color:#e7b56a;border:1px solid rgba(231,181,106,.4);border-radius:999px;padding:1px 7px;flex:0 0 auto}
.memo-item.k-bad .mi-k{color:#ff9b8f;border-color:rgba(255,120,110,.42)}
.memo-item.k-con .mi-k{color:#f0d97a;border-color:rgba(240,217,122,.42)}
.mi-w{font-size:10.5px;color:#7d6660;text-align:right}
.mi-t{font-size:12.5px;line-height:1.75;color:#ded0c6;white-space:pre-wrap}

/* 入园守则 · 木牌 */
.rule-board{background:linear-gradient(180deg,#3a2a20,#221610);border:1px solid #6b4a33;border-radius:14px;
  padding:16px 15px 12px;margin:12px 0;box-shadow:inset 0 0 34px rgba(0,0,0,.55)}
.rule-board .rb-t{font-size:9.5px;letter-spacing:.26em;color:#c79a63;text-align:center;margin-bottom:12px}
.rule-item{display:flex;gap:11px;margin:13px 0;align-items:flex-start}
.rule-num{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid rgba(199,154,99,.5);color:#e6c08b;
  font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.rule-tx{font-size:14px;line-height:1.65;color:#f2e5d6}
.rule-tx small{display:block;font-size:11.5px;color:#a48d78;margin-top:4px;line-height:1.7}
.rule-foot{font-size:10.5px;color:#8d7663;border-top:1px dashed rgba(199,154,99,.25);padding-top:9px;margin-top:10px;line-height:1.6}
.rule-strip{display:block;width:100%;text-align:left;border:1px solid rgba(199,154,99,.34);font:inherit;color:inherit;
  background:linear-gradient(100deg,rgba(120,80,40,.3),rgba(38,20,14,.55));border-radius:12px;padding:9px 11px;margin:8px 0}
.rule-strip .rs-t{font-size:9.5px;letter-spacing:.18em;color:#e0b982}
.rule-strip .rs-l{display:block;font-size:10.5px;color:#bda48d;line-height:1.65;margin-top:3px}
.rule-strip:active{transform:scale(.99)}

/* 相机取景 */
.cam-wrap{position:relative;border-radius:14px;overflow:hidden;margin:8px 0;background:#000}
.cam-view{position:relative;min-height:330px;background-size:cover;background-position:center;
  filter:saturate(.5) contrast(1.12) brightness(.7)}
.cam-view::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
.cam-hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;
  font-size:10px;letter-spacing:.1em;color:#9fd3c8;font-family:ui-monospace,Menlo,monospace;z-index:3}
.cam-frame{position:absolute;inset:28px 18px;border:1px solid rgba(180,255,240,.28);border-radius:6px;z-index:2;pointer-events:none}
.cam-frame::before{content:"";position:absolute;left:-1px;top:-1px;width:24px;height:24px;
  border-left:2px solid rgba(180,255,240,.6);border-top:2px solid rgba(180,255,240,.6)}
.cam-frame::after{content:"";position:absolute;right:-1px;bottom:-1px;width:24px;height:24px;
  border-right:2px solid rgba(180,255,240,.6);border-bottom:2px solid rgba(180,255,240,.6)}
.cam-scan{position:absolute;left:18px;right:18px;height:2px;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(160,255,235,.85),transparent);animation:camScan 2.4s linear infinite}
@keyframes camScan{0%{top:28px}100%{top:calc(100% - 30px)}}
.cam-ghost{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;padding:0;
  border:1px dashed rgba(255,120,120,.85);background:rgba(255,60,60,.1);opacity:0;transition:opacity .7s;z-index:4}
.cam-ghost.on{opacity:1;animation:ghostPulse 1.9s ease-in-out infinite}
.cam-ghost::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
  border-radius:50%;background:#ff6b6b}
@keyframes ghostPulse{50%{box-shadow:0 0 24px rgba(255,80,80,.55);background:rgba(255,60,60,.22)}}
.cam-note{font-size:11px;color:#8fd6c8;text-align:center;letter-spacing:.05em;padding:8px 6px;background:rgba(0,0,0,.6)}
/* —— 同行者 · 立绘 —— */
.comp-dock{display:flex;gap:8px;margin:8px 0;padding:8px 10px 8px 6px;border-radius:14px;position:relative;
  background:linear-gradient(115deg,rgba(78,12,20,.5),rgba(14,6,8,.42));
  border:1px solid rgba(196,30,58,.24);overflow:hidden}
.comp-dock::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90px 70px at 38px 46%,rgba(196,30,58,.18),transparent 72%)}
.comp-dock.fear{border-color:rgba(255,90,90,.34);background:linear-gradient(115deg,rgba(52,10,14,.6),rgba(10,4,6,.5))}
.comp-dock.eerie{border-color:rgba(255,42,42,.42);animation:compEerie 6s ease-in-out infinite}
@keyframes compEerie{0%,90%,100%{filter:none}92%{filter:brightness(1.3) hue-rotate(-7deg);transform:translateX(.5px)}95%{filter:none}}
.comp-art{flex:0 0 74px;width:74px;height:112px;position:relative;cursor:pointer;
  display:flex;align-items:flex-end;justify-content:center}
.comp-art svg{width:100%;height:100%;display:block;overflow:visible;animation:compBreath 5.4s ease-in-out infinite;
  filter:drop-shadow(0 0 10px rgba(196,30,58,.35))}
@keyframes compBreath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.008)}}
.comp-talk{flex:1;min-width:0;position:relative;z-index:1}

/* Summer-fair music box. Daytime is warm; night only drops notes. */
(function () {
  let ctx = null;
  let master = null;
  let nodes = [];
  let started = false;
  let running = false;
  window.__ambienceMuted = false;
  window.__ambienceVol = 42;
  try {
    const v = localStorage.getItem("tbz_thrilling_ambience_vol");
    if (v != null) window.__ambienceVol = Math.max(0, Math.min(100, parseInt(v, 10) || 42));
    window.__ambienceMuted = localStorage.getItem("tbz_thrilling_ambience_mute") === "1";
  } catch (e) {}
  let soft = false;
  let duckGain = 1;
  let tense = 0;
  let raf = 0;
  let bellTimer = 0;
  let step = 0;
  /* C major waltz: bright dusk, not a sub drone */
  const DUSK = [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25, 523.25, 587.33, 698.46, 783.99, 698.46, 587.33];

  function ensureCtx() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    return ctx;
  }

  function buildGraph() {
    if (!ctx || nodes.length) return;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 1400;
    filter.Q.value = 0.5;

    const gPad = ctx.createGain();
    gPad.gain.value = 0.035;
    const oscA = ctx.createOscillator();
    oscA.type = "sine";
    oscA.frequency.value = 261.63;
    const oscB = ctx.createOscillator();
    oscB.type = "sine";
    oscB.frequency.value = 329.63;
    oscA.connect(gPad);
    oscB.connect(gPad);
    gPad.connect(filter);

    const len = Math.floor(ctx.sampleRate * 4);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      data[i] = last * 1.2;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const gAir = ctx.createGain();
    gAir.gain.value = 0.012;
    const airLp = ctx.createBiquadFilter();
    airLp.type = "lowpass";
    airLp.frequency.value = 900;
    src.connect(airLp);
    airLp.connect(gAir);
    gAir.connect(filter);
    filter.connect(master);
    oscA.start();
    oscB.start();
    src.start();
    nodes = [{ gPad, filter, gAir, oscA, oscB }];
  }

  function volFactor() {
    if (window.__ambienceMuted || !running) return 0;
    const slider = Math.max(0, Math.min(100, window.__ambienceVol || 42)) / 100;
    let base = (soft ? 0.22 : 0.38) * slider;
    base *= duckGain;
    return Math.min(0.45, base);
  }

  function playBell(freq, dur, gainV) {
    if (!ctx || !master) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const now = ctx.currentTime;
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(Math.max(0.012, gainV), now + 0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g);
    g.connect(master);
    o.start(now);
    o.stop(now + dur + 0.02);
  }

  function bellTick() {
    if (!running || !ctx) return;
    let f = DUSK[step % DUSK.length];
    const skip = tense > 0.45 && step % 8 === 5;
    if (tense > 0.3 && step % 6 === 4) f *= 15 / 16;
    if (tense > 0.65) f *= 0.5;
    const slider = Math.max(0, Math.min(100, window.__ambienceVol || 42)) / 100;
    const gainV = (soft ? 0.045 : 0.08) * slider * duckGain * (1 - tense * 0.25);
    if (!skip && gainV > 0.008) playBell(f, tense > 0.5 ? 0.7 : 0.42, gainV);
    step++;
    const gap = (tense > 0.5 ? 460 : 300) + (step % 3 === 0 ? 40 : 0);
    bellTimer = setTimeout(bellTick, gap);
  }

  function applyTense() {
    if (!nodes.length || !ctx) return;
    const n = nodes[0];
    const now = ctx.currentTime;
    n.filter.frequency.setTargetAtTime(1400 - tense * 700, now, 1.4);
    n.gPad.gain.setTargetAtTime(0.03 + tense * 0.02, now, 1.2);
    n.oscB.detune.setTargetAtTime(tense * 18, now, 1.2);
  }

  function tickAmbience() {
    if (!running || !ctx) return;
    try {
      let t = 0;
      if (typeof S !== "undefined" && S) {
        if (S.day >= 2) t += 0.18;
        if (S.day >= 3) t += 0.18;
        if (typeof isLateNight === "function" && isLateNight()) t += 0.22;
        if (typeof isLowBat === "function" && isLowBat()) t += 0.12;
        if ((S.flags && S.flags.anomaliesSeen) >= 5) t += 0.12;
      }
      tense = Math.min(0.9, t);
      applyTense();
      if (master) master.gain.setTargetAtTime(volFactor(), ctx.currentTime, 1.1);
    } catch (e) {}
    raf = setTimeout(tickAmbience, 2400);
  }

  function start() {
    const c = ensureCtx();
    if (!c) return;
    if (c.state === "suspended") c.resume().catch(function () {});
    buildGraph();
    started = true;
    running = true;
    master.gain.setTargetAtTime(volFactor(), c.currentTime, 0.8);
    clearTimeout(raf);
    clearTimeout(bellTimer);
    tickAmbience();
    bellTick();
  }

  window.ambienceUnlock = function () {
    const c = ensureCtx();
    if (!c) return;

    if (!running && !window.__ambienceMuted) start();
  };
  window.ambienceToggle = function () {
    window.__ambienceMuted = !window.__ambienceMuted;
    try {
      localStorage.setItem("tbz_thrilling_ambience_mute", window.__ambienceMuted ? "1" : "0");
    } catch (e) {}
    if (window.__ambienceMuted) {
      if (master && ctx) master.gain.setTargetAtTime(0, ctx.currentTime, 0.4);
    } else {
      if (!started) window.ambienceUnlock();
      else if (master && ctx) master.gain.setTargetAtTime(volFactor(), ctx.currentTime, 0.5);
    }
    return !window.__ambienceMuted;
  };
  window.ambienceSetVolume = function (v) {
    window.__ambienceVol = Math.max(0, Math.min(100, Number(v) || 0));
    try {
      localStorage.setItem("tbz_thrilling_ambience_vol", String(window.__ambienceVol));
    } catch (e) {}
    if (window.__ambienceVol <= 0) window.__ambienceMuted = true;
    else if (window.__ambienceMuted) {

  };

    duckGain = 0;
    running = false;

    clearTimeout(bellTimer);
    if (master && ctx) master.gain.setTargetAtTime(0, ctx.currentTime, 0.25);
  };

    duckGain = 1;
    if (!window.__ambienceMuted && started) start();
  };

    const c = ensureCtx();
    if (!c || window.__ambienceMuted) return;
    if (c.state === "suspended") c.resume();
    const slider = Math.max(0.2, (window.__ambienceVol || 48) / 100);
    const g = c.createGain();
    g.gain.value = 0;
    g.connect(c.destination);
    const o = c.createOscillator();
    o.type = "sine";
    o.frequency.value = 62;
    const o2 = c.createOscillator();
    o2.type = "sine";
    o2.frequency.value = 78;
    const f = c.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = 320;
    o.connect(f);
    o2.connect(f);
    f.connect(g);
    const now = c.currentTime;
    const peak = 0.12 * slider;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(peak, now + 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
    o.start(now);
    o2.start(now);
    o.stop(now + 0.9);
    o2.stop(now + 0.9);
  };

  /** Distinct soft UI clicks */
  window.playUiSfx = function (kind) {
    const c = ensureCtx();
    if (!c) return;
    if (c.state === "suspended") c.resume().catch(function () {});
    const now = c.currentTime;
    const g = c.createGain();
    g.connect(c.destination);
    const o = c.createOscillator();
    const f = c.createBiquadFilter();
    f.type = "lowpass";
    o.connect(f);
    f.connect(g);
    let freq = 400,
      type = "sine",
      peak = 0.045,
      dur = 0.05,
      f0 = 1600;
    kind = kind || "default";
    if (kind === "chat") {
      freq = 580;
      peak = 0.04;
      dur = 0.06;
      f0 = 2200;
    } else if (kind === "map") {
      freq = 190;
      type = "triangle";
      peak = 0.055;
      dur = 0.08;
      f0 = 800;
    } else if (kind === "album") {
      freq = 900;
      type = "triangle";
      peak = 0.035;
      dur = 0.04;
      f0 = 2800;
    } else if (kind === "menu" || kind === "settings") {
      freq = 320;
      peak = 0.04;
      dur = 0.07;
      f0 = 1200;
    } else if (kind === "records" || kind === "notes" || kind === "calendar") {
      freq = 480;
      type = "triangle";
      peak = 0.035;
      dur = 0.06;
      f0 = 1500;
    } else if (kind === "deleted" || kind === "recorder") {
      freq = 150;
      peak = 0.055;
      dur = 0.1;
      f0 = 500;
    } else if (kind === "browser" || kind === "alarm") {
      freq = 520;
      peak = 0.04;
      dur = 0.05;
      f0 = 1800;
    } else if (kind === "home" || kind === "dock") {
      freq = 260;
      peak = 0.03;
      dur = 0.045;
      f0 = 1000;
    } else if (kind === "play" || kind === "inv") {
      freq = 440;
      peak = 0.03;
      dur = 0.04;
      f0 = 1000;
    }
    o.type = type;
    o.frequency.value = freq;
    f.frequency.value = f0;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(peak, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.start(now);
    o.stop(now + dur + 0.02);
  };

    window.ambienceUnlock();
    window.removeEventListener("pointerdown", onceUnlock, true);
    window.removeEventListener("keydown", onceUnlock, true);
  }

  window.addEventListener("keydown", onceUnlock, true);
})();

    if (typeof ambienceDuck === "function") {

    const vol = musicVolFactor();
    master.gain.setValueAtTime(0.0001, c.currentTime);
    master.gain.linearRampToValueAtTime(vol, c.currentTime + 0.2);
    playingId = track.id;
    musicStep = 0;
    musicTick(track);
    updateNowPlaying();

// —— 异常值获取：按天加权。第一天减半（零头攒着，凑满 1 才计入），第二天起全额。
// 目的：让"正常的一天"先立住，错位感从第二天才密集起来。
function gainAnomaly(n){
  n = n || 0;
  if(n <= 0) return 0;
  if(!S.flags) S.flags = {};
  if(S.day <= 1){
    S.flags.anomFrac = (S.flags.anomFrac || 0) + n * 0.5;
    if(S.flags.anomFrac < 1) return 0;
    const whole = Math.floor(S.flags.anomFrac);
    S.flags.anomFrac -= whole;
    S.flags.anomaliesSeen = (S.flags.anomaliesSeen || 0) + whole;
    return whole;
  }
  S.flags.anomaliesSeen = (S.flags.anomaliesSeen || 0) + n;
  return n;
}

function deliverDayEssays(day){
  day=Math.min(Math.max(day||1,1),5);
  if(!DAY_ESSAYS[day]) return;
  const key="essay_"+day;
  if(S.flags[key]) return;
  // 只有所选男主会写；而且只在凌晨（00:00–04:59）送到，其他时间不发
  if(S.hour>=5) return;
  S.flags[key]=true;
  const name=S.playerName||"你";
  const lead=S.ownerId;
  const raw=lead?DAY_ESSAYS[day][lead]:null;
  if(!raw) return;
  const c=CHARS.find(x=>x.id===lead);
  if(!S.chatLog[lead]) S.chatLog[lead]=[];
  S.chatLog[lead].push({from:"them",text:raw.replace(/\(名字\)/g,name),type:"text",t:realTime(),essay:true});
  S.unread[lead]=(S.unread[lead]||0)+1;
  toast("凌晨了。"+(c?c.name:"他")+"给你写了一段很长的话。");
}

function advanceTime(mins, opts){
  if(S.flags.ended) return;
  opts = opts || {};
  const raw = Math.max(0, mins|0);
  const add = opts.exact ? raw : Math.round(raw * (opts.mult != null ? opts.mult : timeMult()));
  const prevDay = S.day;
  S.minute += add;
  while(S.minute>=60){S.minute-=60;S.hour++;}
  while(S.hour>=24){
    S.hour-=24;
    S.day++;
  }
  /* 第五天开始，园区只在傍晚之后发生事情。跨天时把钟拨回傍晚，
     否则第四五天从 00:00 起步，玩家要几百个动作才走到夜里，夜戏全看不见。 */
  if(S.day>prevDay && S.hour<12){
    if(S.day===4){ S.hour=18; S.minute=0; }
    else if(S.day>=5){ S.hour=17; S.minute=30; }
  }
  /* 第四五天重新开放突脸槽位：前两天用掉的聊天/地图/相册惊吓，最后两天可以再来一次 */
  if(S.day>prevDay && S.day>=4 && !isShortMode()){
    S.jumpUsed={chat:0,album:0,map:0,status:0,hidden:0};
  }
  if(S.day > prevDay){
    for(let d=prevDay; d<S.day && d<=dayCap(); d++){
      if(typeof deliverDayEssays==="function") deliverDayEssays(d);
    }
  }
  if(S.day > prevDay && S.day<=dayCap()){
    S.pendingDayCard = S.day;
    S.flags.dayBriefed[S.day] = false;
  }
  if(S.day>dayCap()){
    if(!S.flags.ended) tryEnding("timeup");
    S.day = dayCap(); S.hour = Math.min(S.hour, 23);
  }
  // Night of day 2+ anomaly start
  if(S.day>=2 && S.hour>=22) S.flags.nightAnomalyStarted=true;
  if(S.day===3 && S.hour>=19 && typeof injectDayEndMemo==='function') injectDayEndMemo(3);
  if(typeof maybeOwnerPing==="function"){
    if(S.day>=2 && !S.flags.ownerPingDay2){ S.flags.ownerPingDay2=true; maybeOwnerPing({force:true}); }
    if(S.day>=4 && !S.flags.ownerPingDay3){ S.flags.ownerPingDay3=true; maybeOwnerPing({force:true}); }
    else if(Math.random()<0.45) maybeOwnerPing();
  }
  if(S.day>=3) S.flags.nightAnomalyStarted=true;
  updateStatus();
  try{ if(typeof horrorTick==="function") horrorTick(); }catch(e){}
  try{ if(typeof ngTick==="function") ngTick(); }catch(e){}
  autoSave();
  if(S.pendingDayCard && !opts.silentDay){
    // show after current render cycle
    setTimeout(()=>showDayCard(S.pendingDayCard), 60);
  }
}
function drainBattery(n){
  if(S.flags.ended || S.flags.deadBattery) return;
  let amount = n * identityMod().batDrain;
  // dangerous zones drain faster when critical / night
  const z = ZONES.find(x=>x.id===S.currentZone);
  if(z && z.danger && (isLowBat() || isLateNight())) amount *= 1.35;
  S.battery = Math.max(0, +(S.battery - amount).toFixed(1));
  if(S.battery<=0){
    S.battery=0;
    // refused charge before + in danger → hard bad ending
    if(S.flags.refusedCharge && z && z.danger){
      triggerBadEnding();
      return;
    }
    onBatteryDead();
    return;
  }
  if(S.battery<28){ tryStatusJumpFace(); }
  updateStatus();
}
function isNight(){ return S.hour>=19 || S.hour<6; }
function isDeepNight(){ return S.hour>=23 || S.hour<5 || (S.hour===22 && S.minute>=30); }
function isLateNight(){ return S.hour>=22 || S.hour<5; }
function moodName(){
  if(!S || !S.playerName) return "calm";
  if(S.day>=4 || (S.day>=3 && isLateNight()) || S.battery<28 || (S.flags.anomaliesSeen||0)>=6) return "horror";
  if(S.day>=2 || (S.flags.anomaliesSeen||0)>=3) return "uneasy";
  return "calm";
}
function routeSnapshot(){
  const logs=S.chatLog||{};
  const replied=CHARS.filter(c=>(logs[c.id]||[]).some(m=>m.from==="me")).map(c=>c.id);
  const zones=new Set(S.visitedZones||[]);
  const keeps=(S.inv||[]).filter(function(x){return typeof x==="string"&&x.indexOf("keep_")===0;}).length;
  return {
    replied,
    lead:!!(S.ownerId && replied.includes(S.ownerId)),
    hot:(S.hotspotsFound||[]).length,
    sawPlace:zones.has("food")||zones.has("photo"),
    night:zones.has("night"),
    empty:zones.has("empty"),
    del:S.deletedLayer||0,
    spot:((S.gp||{}).spotWins)||0,
    marked:Object.keys(S.suspectMark||{}).length,
    digits:(S.digits||[]).length,
    lotUnlocked:!!(S.puzzle&&S.puzzle.unlockedLot)||!!S.emptyUnlocked,
    keeps
  };
}

function doNextStep(){

  else if(s.go==="more") renderMore();
  else if(s.go==="play"){ S.tab="play"; startMinigame("spot"); }

  else if(s.go==="puzzle") renderPuzzleBoard();

function isLowBat(){ return S.battery<45; }
function isCritBat(){ return S.battery<20; }
function anomalyLevel(){
  let lv=0;
  // Day1: keep mostly calm — only tiny contribution from extreme states
  if(S.day===1){
    if(isCritBat()) lv += 0.25;
    if(S.flags.anomaliesSeen>=3) lv += 0.25;
    lv -= identityMod().anomalyDelay*0.5;
    return Math.max(0, Math.min(1, lv)); // cap day1
  }
  if(S.flags.nightAnomalyStarted) lv++;
  if(S.day>=2 && isLateNight()) lv++;
  if(S.day>=3) lv += 1;
  if(S.day>=4) lv += 0.5;
  if(S.day>=5) lv += 0.5;
  if(isLowBat()) lv++;
  if(isCritBat()) lv++;
  if(S.deletedLayer>=2) lv++;
  if(S.deletedLayer>=3) lv++;
  lv += Math.floor(S.flags.anomaliesSeen/4);
  lv -= identityMod().anomalyDelay*0.5;
  return Math.max(0, lv);
}
function dayLabel(d){
  d = d==null ? S.day : d;
  return "第"+Math.min(Math.max(d,1),dayCap())+"天";
}
function dayBrief(d){
    const dd=Math.min(Math.max(d||S.day,1),dayCap());
  if(isShortMode() && dd===3) return DAY_INFO_SHORT_3;
  return DAY_INFO[dd] || DAY_INFO[1];
}
function charPhase(id){
  // 0 early, 1 mid, 2 late — day-gated
  let st = S.stage[id]||0;
  const att = S.attention[id]||0;
  const lv = anomalyLevel();
  if(S.day===1){
    // Day1: stay early; very high attention can edge to mid only at night
    if(att>=10 && isLateNight()) st=Math.max(st,1);
    return Math.min(1, Math.max(0, st)); // never late on day1
  }
  if(lv>=3 || att>=8 || S.day>=3) st=Math.max(st,2);
  else if(lv>=1.5 || att>=4 || (S.day>=2 && isLateNight())) st=Math.max(st,1);
  return Math.min(2, Math.max(0, st));
}
function charStatus(id){
  if(typeof presenceOf==="function") return presenceOf(id);
  if(!isLowBat()) return null;
  const ph=charPhase(id);
  const att=S.attention[id];
  if(ph>=2 || att>=10) return "异常";
  if(ph>=1) return "不稳定";
  if(S.unread[id]===0 && S.chatLog[id].length>2 && Math.random()<0.3) return "沉默";
  return "正常";
}

// —— Jump faces ——
/* 突脸上限：三日版维持 5 次，五日版放到 7 次——第四五天本来就是惊吓最高的两天 */
function jumpCap(){ return (typeof isShortMode==="function" && isShortMode()) ? 5 : 7; }
function maybeJumpFace(kind, force, scripted){
  /* scripted=true 是剧情演出：不吃 5 次上限、不占槽位，否则第四五天的 CG 会被前面用光 */
  if(!scripted && S.jumpFaceCount>=jumpCap()) return false;
  const slot = kind==="album" ? "album" : kind; // photo→album in our slots
  if(!scripted){
    if(!force){
      if(S.jumpUsed[slot]) return false;
    } else if(S.jumpUsed[slot]) {
      return false;
    }
  }
  if(!scripted){
    S.jumpFaceCount++;
    S.jumpUsed[slot]=1;
  }
  if(typeof ambienceScareSting==="function") try{ambienceScareSting();}catch(e){}
  const el=document.getElementById("jumpFace");
  const phone=document.getElementById("phone");
  if(!el) return true;
  el.className="jump-face show";
  const soft = !!(S.flags.jumpReduce || S.flags.softScare);
  if(soft) el.classList.add("reducing");
  if(phone && soft) phone.classList.add("jump-reduced");
  if(kind==="status") el.classList.add("tiny");
  if(kind==="map") el.classList.add("sil");
  if(kind==="album") el.classList.add("album-scare");
  if(kind==="hidden") el.classList.add("clearer");
  // DUR from ref PhoneGame: chat560 photo460 map600 status380 ending720
  const DUR = (typeof JUMP_DUR!=="undefined") ? JUMP_DUR : {chat:560,album:460,map:600,status:380,hidden:720};
  let dur = DUR[slot] || DUR[kind] || 500;
  if(soft) dur = Math.min(dur, 380);
  clearTimeout(maybeJumpFace._tm);
  maybeJumpFace._tm = setTimeout(()=>{
    el.className="jump-face";
    if(phone) phone.classList.remove("jump-reduced");
  }, dur);
  return true;
}
/* —— 图片版贴脸：第四五天的 CG。尊重「突脸减弱」与 5 次上限 —— */
function imgJumpFace(key, kind, scripted){
  try{
    if(S.flags.jumpReduce || S.flags.softScare) return false;
    if(!scripted && (S.jumpFaceCount||0)>=jumpCap()) return false;
    const src=(typeof PARK_IMG!=="undefined")?PARK_IMG[key]:null;
    if(!src) return false;
    const wrap=document.getElementById("jumpFaceWrap");
    const prev=wrap?wrap.innerHTML:"";
    if(wrap) wrap.innerHTML='<img src="'+src+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px">';
    const ok=maybeJumpFace(kind||"album", true, !!scripted);
    setTimeout(function(){ const w=document.getElementById("jumpFaceWrap"); if(w) w.innerHTML=prev; },1400);
    return ok;
  }catch(e){ return false; }
}
/** Easier encounter rules for deep play */
function tryChatJumpFace(cid){
  if(S.jumpUsed.chat || S.jumpFaceCount>=jumpCap()) return false;
  const ph=charPhase(cid);
  // mid+ with night OR late with low bat OR day3
  const ok = (ph>=1 && isLateNight()) || (ph>=2 && isLowBat()) || (S.day>=3 && isLowBat()) || (S.day>=2 && isCritBat() && ph>=1);
  if(ok) return maybeJumpFace("chat");
  return false;
}
function tryStatusJumpFace(){
  if(S.jumpUsed.status || S.jumpFaceCount>=jumpCap()) return false;
  if(S.battery < 28) return maybeJumpFace("status");
  return false;
}

function fmtTime(){
  if(isCritBat() && Math.random()<0.35){
    // glitch digits
    const gh=(S.hour+Math.floor(Math.random()*5)+1)%24;
    const gm=(S.minute+Math.floor(Math.random()*40))%60;
    return String(gh).padStart(2,"0")+":"+String(gm).padStart(2,"0");
  }
  return String(S.hour).padStart(2,"0")+":"+String(S.minute).padStart(2,"0");
}
function realTime(){ return String(S.hour).padStart(2,"0")+":"+String(S.minute).padStart(2,"0"); }


function clockLabel(){
  const pad=n=>String(n).padStart(2,"0");
  const hh=S.hour, mm=S.minute;
  // ref: low battery glitches
  if(S.battery<=8 && (hh*60+mm)%5===0) return "第二天 "+pad(hh)+":"+pad(mm);
  if(S.battery<=12 && (hh*60+mm)%4===0) return "25:"+pad(mm);
  if(S.timeGlitch || (isCritBat() && Math.random()<0.2)){
    const gh=(hh+Math.floor(Math.random()*5)+1)%24;
    const gm=(mm+Math.floor(Math.random()*40))%60;
    return pad(gh)+":"+pad(gm);
  }
  return pad(hh)+":"+pad(mm);
}

/* =========================================================================
   恐怖增强四件套
   1) 真实时间（可被测试钩子覆盖）
   2) 它记得你：把玩家真实做过的事记在本机，再由"它"说出来
   3) UI 入侵：状态栏名字、备忘录多一条、图鉴多一个人
   4) 静默侵蚀：你不动，界面才敢自己变
   ========================================================================= */

/* —— 1) 真实时间 —— */
function realNow(){
  try{ if(window.__fakeRealNow) return new Date(window.__fakeRealNow); }catch(e){}
  return new Date();
}
function realHour(){ return realNow().getHours(); }
function isRealLate(){ const h=realHour(); return h>=0 && h<5; }
function realClockText(){ const d=realNow(); const p=n=>String(n).padStart(2,"0"); return p(d.getHours())+":"+p(d.getMinutes()); }

/* —— 2) 它记得你 —— */
const MEM_KEY="tbz_thrill_mem";
function loadMem(){
  const blank={loads:0,deletes:0,runs:0,exits:0,leftTab:"",erasedSlot:0,said:{}};
  try{
    const raw=localStorage.getItem(MEM_KEY);
    if(!raw) return blank;
    const m=JSON.parse(raw);
    if(!m || typeof m!=="object") return blank;
    m.said=m.said||{};
    return Object.assign(blank,m);
  }catch(e){ return blank; }
}
function saveMem(m){ try{ localStorage.setItem(MEM_KEY, JSON.stringify(m)); }catch(e){} }
function bumpMem(k,n){
  const m=loadMem();
  m[k]=(m[k]||0)+(n==null?1:n);
  saveMem(m);
  return m;
}
const MEM_TAB_PHRASE={chat:"聊天列表",album:"相册",map:"园区地图",records:"记录",notes:"备忘录",more:"更多",home:"主页",save:"存档页"};
/* 离开时记下停在哪一页；真正关掉页面才算"关了一次屏幕" */
function memOnHide(){
  if(!S||!S.playerName) return;
  try{
    const m=loadMem();
    m.leftTab=S.chatWith?"chat":(S.tab||"home");
    try{ if(typeof __zoneSecMap!=="undefined"&&Object.keys(__zoneSecMap).length) m.stoneLive=__zoneSecMap; }catch(e){}
    saveMem(m);
  }catch(e){}
}
function memOnLeave(){
  if(!S||!S.playerName) return;
  try{
    const m=loadMem();
    m.exits=(m.exits||0)+1;
    m.leftTab=S.chatWith?"chat":(S.tab||"home");
    saveMem(m);
  }catch(e){}
}
function memPick(){
  const m=loadMem();
  if(!m.said.deletes && (m.deletes||0)>0){
    return {key:"deletes", text:"你删掉了第 "+(m.erasedSlot||1)+" 格。删之前，你没问过里面那个人愿不愿意。"};
  }
  if(!m.said.loads && (m.loads||0)>0){
    return {key:"loads", text:"你刚才是从前面翻回来的吧。翻的时候，我在这儿。"};
  }
  if(!m.said.left && m.leftTab){
    const ph=MEM_TAB_PHRASE[m.leftTab]||"那一页";
    return {key:"left", text:"你上次停在「"+ph+"」，然后就走了。屏幕替你留在了那儿。"};
  }
  if(!m.said.runs && (m.runs||0)>=2){
    return {key:"runs", text:"这是第 "+(m.runs+1)+" 次了。门一次比一次松。"};
  }
  if(!m.said.exits && (m.exits||0)>=2){
    return {key:"exits", text:"你把屏幕关掉过 "+(m.exits||0)+" 次。关掉以后，这里没停。"};
  }
  return null;
}
function memMarkSaid(key){
  const m=loadMem();
  m.said[key]=1;
  saveMem(m);
}
function memEndingLine(){
  const m=loadMem();
  const parts=[];
  if((m.deletes||0)>0) parts.push("你删掉过 "+(m.deletes)+" 次存档。被删掉的那一格里，人还在往前走。");
  if((m.exits||0)>=3) parts.push("你把屏幕关掉过 "+(m.exits)+" 次。每一次，这里都继续。");
  if((m.loads||0)>=4) parts.push("你一共往回翻了 "+(m.loads)+" 次。翻回去的那几段，现在还留着。");
  return parts.length?parts[Math.floor(Math.random()*parts.length)]:"";
}
function saveAppMemLine(){
  const m=loadMem();
  if(!(m.deletes||0)) return "";
  return `<div class="card" style="margin-top:12px;border-left:3px solid rgba(190,80,80,.45)">
    <b>关于这几个格子</b>
    <div class="muted" style="font-size:12.5px;margin-top:4px;line-height:1.65">你删过 ${m.deletes} 次存档。被删掉的那一格，进度没有停——只是你看不到了。</div>
  </div>`;
}
/* 男主替"这里"开口：每局每天最多一句，每句一生只说一次 */
function maybeMemoryWhisper(cid){
  if(!S || !S.ownerId || cid!==S.ownerId) return false;
  if(!S.chatLog || !S.chatLog[cid]) return false;
  if((S.day||1)<2) return false;
  if(S.flags.memSaidDay===S.day) return false;
  if((S.flags.memSaid||0)>=3) return false;
  const l=memPick();
  if(!l) return false;
  memMarkSaid(l.key);
  S.flags.memSaidDay=S.day;
  S.flags.memSaid=(S.flags.memSaid||0)+1;
  S.chatLog[cid].push({from:"them",text:l.text,type:"text",t:realTime(),read:false});
  if(S.unread) S.unread[cid]=(S.unread[cid]||0)+1;
  gainAnomaly(1);
  return true;
}

let __nameGlitch={until:0,text:""};

  if(Date.now()-__nameGlitchAt<90000) return false;

  setTimeout(()=>{ __nameGlitch={until:0,text:""}; try{updateStatus();}catch(e){} },1700);
  return true;
}

/* —— 4) 静默侵蚀 —— */
let _erodeT=null, _erodeOn=false, _erodeUndo=[];
let __erodeClockShift=0;
/* 把 "第2天 · 21:14" 里的时间整体挪 n 分钟，其余部分原样 */
function shiftClock(txt,n){
  if(!n) return txt;
  return String(txt).replace(/(\d{1,2}):(\d{2})/,function(m,h,mi){
    let t=parseInt(h,10)*60+parseInt(mi,10)+n;
    t=((t%1440)+1440)%1440;
    return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
  });
}
const ERODE_LABELS=["别进去","再等一会儿","没有这个人。","先别按"];
const ERODE_BUBBLES=["（已撤回）","你在看吗","别翻到后面","删掉我。"];
function erodeClear(){
  _erodeUndo.forEach(f=>{ try{ f(); }catch(e){} });
  _erodeUndo=[];
  _erodeOn=false;
  const sc=document.getElementById("screen");
  if(sc) sc.classList.remove("eroding");
}
function erodeCanRun(){
  if(!S||!S.playerName||!S.flags||!S.flags.disclaimerOk) return false;
  if(S.flags.ended||S.flags.deadBattery) return false;
  if((S.flags.erodeCount||0)>=4) return false;
  if((S.day||1)<2 && (S.flags.anomaliesSeen||0)<3) return false;
  if(S.view==="title"||S.view==="intro") return false;
  if(document.querySelector(".modal,.night-event")) return false;
  return true;
}
function erodeOnRender(){
  erodeClear();
  clearTimeout(_erodeT);
  if(!erodeCanRun()) return;
  _erodeT=setTimeout(erodeFire, window.__erodeFast ? 400 : (34000+Math.random()*40000));
}
function erodeInterrupt(){
  if(!_erodeOn) return;
  erodeClear();
  clearTimeout(_erodeT);
  erodeOnRender();
}
function erodeFire(){
  _erodeT=null;
  if(!erodeCanRun()) return;
  const screen=document.getElementById("screen");
  if(!screen) return;
  const cands=[];
  /* 时钟倒退两分钟 */
  cands.push(()=>{
    const el=document.getElementById("sbDayClock");
    if(!el) return false;
    if(!/\d{1,2}:\d{2}/.test(el.textContent)) return false;
    __erodeClockShift=-2;
    el.textContent=shiftClock(el.textContent,__erodeClockShift);
    _erodeUndo.push(()=>{ __erodeClockShift=0; });
    return true;
  });
  /* 某个按钮的字换了 */
  cands.push(()=>{
    const btns=Array.from(screen.querySelectorAll(".btn,button.chip")).filter(b=>{
      const t=(b.textContent||"").trim();
      return t.length>=2 && t.length<=16;
    });
    if(!btns.length) return false;
    const b=btns[Math.floor(Math.random()*btns.length)];
    const old=b.textContent;
    b.textContent=ERODE_LABELS[Math.floor(Math.random()*ERODE_LABELS.length)];
    b.classList.add("erode-ghost");
    _erodeUndo.push(()=>{ b.textContent=old; b.classList.remove("erode-ghost"); });
    return true;
  });
  /* 聊天列表多一行 */
  cands.push(()=>{
    if(S.tab!=="chat" || S.chatWith) return false;
    const first=screen.querySelector(".chat-row");
    if(!first) return false;
    const row=document.createElement("div");
    row.className="chat-row erode-ghost";
    row.style.opacity=".55";
    row.innerHTML=`<div class="avatar" style="background:#17171b"></div>
      <div class="chat-meta"><div class="top"><span class="name">…</span><span class="time">--:--</span></div>
      <div class="prev">在吗</div></div>`;
    first.parentNode.insertBefore(row, first);
    _erodeUndo.push(()=>{ try{row.remove();}catch(e){} });
    return true;
  });
  /* 相册多一格 */
  cands.push(()=>{
    if(S.tab!=="album") return false;
    const grid=screen.querySelector(".album-grid");
    if(!grid) return false;
    const cell=document.createElement("div");
    cell.className="photo-thumb erode-ghost";
    cell.innerHTML=`<div style="width:100%;height:100%;background:rgba(0,0,0,.55)"></div>`;
    grid.appendChild(cell);
    _erodeUndo.push(()=>{ try{cell.remove();}catch(e){} });
    return true;
  });
  /* 聊天气泡多一条 */
  cands.push(()=>{
    if(!S.chatWith) return false;
    const holder=screen.querySelector(".bubbles") || screen.querySelector(".chat-view");
    if(!holder) return false;
    const b=document.createElement("div");
    b.className="bubble them erode-ghost";
    b.textContent=ERODE_BUBBLES[Math.floor(Math.random()*ERODE_BUBBLES.length)];
    holder.appendChild(b);
    _erodeUndo.push(()=>{ try{b.remove();}catch(e){} });
    return true;
  });
  /* 主页某个图标的名字变成了省略号 */
  cands.push(()=>{
    if(S.tab!=="home") return false;
    const labs=Array.from(screen.querySelectorAll(".app-icon .lab")).filter(l=>(l.textContent||"").trim().length>0);
    if(!labs.length) return false;
    const l=labs[Math.floor(Math.random()*labs.length)];
    const old=l.textContent;
    l.textContent="…";
    _erodeUndo.push(()=>{ l.textContent=old; });
    return true;
  });
  /* 随机打乱后逐个尝试，直到有一个成功 */
  for(let i=cands.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=cands[i]; cands[i]=cands[j]; cands[j]=t; }
  for(const fn of cands){
    let ok=false;
    try{ ok=fn(); }catch(e){ ok=false; }
    if(ok){
      _erodeOn=true;
      screen.classList.add("eroding");
      S.flags.erodeCount=(S.flags.erodeCount||0)+1;
      return;
    }
  }
}
function erodeBindOnce(){
  if(window.__erodeBound) return;
  window.__erodeBound=true;
  ["pointerdown","keydown","touchstart","wheel","input"].forEach(function(ev){
    document.addEventListener(ev,function(){ if(_erodeOn) erodeInterrupt(); },{capture:true,passive:true});
  });
}

/* 聊天记录防膨胀：每个角色最多留 max 条（逻辑只读最近消息，裁旧的无副作用） */
function trimChatLogs(max){
  max = max || 250;
  try{
    const log = S.chatLog || {};
    Object.keys(log).forEach(function(k){
      const a = log[k];
      if(a && a.length > max) log[k] = a.slice(a.length - max);
    });
    if(S.records && S.records.length > 400) S.records = S.records.slice(S.records.length - 400);
  }catch(e){}
}
function autoSaveNow(){
  if(!S || !S.playerName) return false;
  if(S.flags && (S.flags.ended || S.flags.deadBattery)) return false;
  try{
    S.flags.autoSavedAt = Date.now();
    let payload = JSON.stringify(S);
    /* 存档看门狗：超过 2.5MB 先瘦身再写，防止 iOS 配额溢出 */
    if(payload.length > 2621440){ trimChatLogs(120); payload = JSON.stringify(S); }
    try{
      localStorage.setItem(SAVE_KEY, payload);
    }catch(quota){
      /* 配额失败：紧急裁剪后重试一次 */
      trimChatLogs(100);
      try{ S.records = (S.records||[]).slice(-200); }catch(_e){}
      localStorage.setItem(SAVE_KEY, JSON.stringify(S));

    return true;
  }catch(e){ return false; }
}

/* 把一份存档对象套回当前游戏（自动存档 / 手动格子共用同一套修复逻辑） */
function applyLoadedState(loaded){
  try{
    try{ bumpMem("loads"); }catch(e){}
    if(!loaded || !loaded.playerName){ toast("这份存档读不出来"); return false; }
    const base=defaultState();
    S=Object.assign(base, loaded);
    S.flags=Object.assign(base.flags, loaded.flags||{});
    if(!S.flags.dayBriefed) S.flags.dayBriefed={1:false,2:false,3:false};
    if(!S.visitedZones) S.visitedZones=["stage"];
    if(!S.ownerId) S.ownerId="";
    if(!S.ownerAlign) S.ownerAlign="";
    if(S.ownerRevealed==null) S.ownerRevealed=false;
    if(!S.flags.npcMet) S.flags.npcMet=[];
    if(S.flags.alignHints==null) S.flags.alignHints=0;
    if(S.flags.disclaimerOk==null) S.flags.disclaimerOk=!!S.playerName; // 旧档有进度则跳过须知
    if(!S.inv) S.inv=[];
    if(!S.quests) S.quests={active:null,done:[],offered:[]};
    if(!S.digits) S.digits=[];
    if(!S.puzzle) S.puzzle={unlockedLot:false,unlockedL3:false,attempt:0,slots:["","","",""]};
    if(!S.gp) S.gp={matchWins:0,rhythmWins:0,silenceWins:0,swipeWins:0,nightResolved:{},lastNightCheck:0};
    if(!S.suspectMark) S.suspectMark={};
    if(typeof gpInit==="function") gpInit();
    if(!S.hotspotsFound) S.hotspotsFound=[];
    /* v0.5 迁移：第四五天改成傍晚起算。旧档若停在这两天的上午，接上时补一次拨钟，
       否则玩家会卡在“白天永远等不到夜戏”的存档里。 */
    if((S.day||1)>=4 && (S.hour||0)<12 && !S.flags.eveningMigrated){
      S.flags.eveningMigrated=1;
      if(S.day===4){ S.hour=18; S.minute=0; }
      else { S.hour=17; S.minute=30; }
    }
    CHARS.forEach(c=>{
      if(S.attention[c.id]==null) S.attention[c.id]=0;
      if(S.stage[c.id]==null) S.stage[c.id]=0;
      if(!S.chatLog[c.id]) S.chatLog[c.id]=[];
      if(S.reread[c.id]==null) S.reread[c.id]=0;
      if(S.unread[c.id]==null) S.unread[c.id]=0;

    else render();
    return true;
  }catch(e){ toast("读档失败"); return false; }
}

function waitUntilNight(){
  // intentional jump — exact minutes (no TIME_MULT)
  if(S.hour < 22){
    const mins = (22 - S.hour)*60 + (30 - S.minute);
    advanceTime(Math.max(40, mins), {exact:true});
  } else if(S.hour < 23){
    advanceTime(50, {exact:true});
  } else {
    // roll into next calendar evening then to night
    const toMidnight = (24-S.hour)*60 - S.minute;
    advanceTime(toMidnight + 18*60 + 30, {exact:true}); // next day 18:30 then nudge
    if(S.hour < 22) advanceTime((22-S.hour)*60+(30-S.minute), {exact:true});
  }
  drainBattery(6);
  tryPushNewBeats();
  render();
  toast(dayLabel()+" · "+realTime());
}

function loadMeta(){
  try{
    const raw=localStorage.getItem(META_KEY);
    if(!raw) return {unlocked:{}, clearCount:0, bestCollect:0, lastEnding:null};
    const m=JSON.parse(raw);
    m.unlocked=m.unlocked||{};
    return m;
  }catch(e){ return {unlocked:{}, clearCount:0, bestCollect:0, lastEnding:null}; }
}
function saveMeta(m){
  try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){}
}
function unlockEndingMeta(kind){
  const m=loadMeta();
  const key=endingMetaKey(kind);
  if(!m.unlocked[key]) m.unlocked[key]={at:Date.now(), kind, identities:{}};
  m.unlocked[key].identities = m.unlocked[key].identities || {};
  m.unlocked[key].identities[identityKey()] = true;
  m.clearCount=(m.clearCount||0)+1;
  m.lastEnding=key;
  const pct=getCollectionStats().percent;
  if(pct>(m.bestCollect||0)) m.bestCollect=pct;
  saveMeta(m);
  return m;
}
function endingMetaKey(kind){
  if(kind && kind.startsWith("char_")) return "char";
