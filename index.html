<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<meta name="theme-color" content="#140a0e"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TBZ夏日游乐场"/>
<link rel="apple-touch-icon" href="./icons/icon-180.png"/>
<link rel="icon" type="image/png" href="./icons/icon-192.png"/>
<title>THRILL-ING 夏日游乐场 · 捡手机（中度恐怖）</title>
<style>
:root{
  --bg:#0a0608;--sky:#140a0e;--card:rgba(80,16,24,.22);--card2:rgba(120,20,30,.28);
  --ink:#f3e6e6;--muted:#a88a8a;--accent:#c0392b;--danger:#ff2a2a;--warn:#e67e22;
  --ok:#6b8f71;--glass:rgba(20,8,10,.78);--radius:16px;
  --phone-w:390px;--phone-h:844px;
  --blood:#8b0000;--crimson:#c41e3a;--clot:#4a0a0f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:
  radial-gradient(ellipse at 50% 0%,rgba(120,0,20,.35),transparent 55%),
  radial-gradient(ellipse at 30% 20%,#2a0a12,#080406 70%);
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{width:min(100vw,var(--phone-w));height:min(100dvh,var(--phone-h));position:relative}
.phone{width:100%;height:100%;background:
    radial-gradient(ellipse at 50% 110%,rgba(100,0,0,.35),transparent 50%),
    linear-gradient(180deg,#1a0c10,#0a0508 60%,#050203);
  border-radius:28px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.7),inset 0 0 0 2px rgba(180,40,40,.15);
  position:relative}
.phone::before{content:"";pointer-events:none;position:absolute;inset:0;z-index:55;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 100%);
  box-shadow:inset 0 0 60px 10px rgba(40,0,0,.45)}
.blood-drip{position:absolute;top:0;left:12%;width:3px;height:0;background:linear-gradient(#8b0000,#4a0a0f);
  opacity:.55;z-index:56;pointer-events:none;animation:drip 7s ease-in infinite}
.blood-drip:nth-child(2){left:78%;animation-delay:2.4s;width:2px}
.blood-drip:nth-child(3){left:44%;animation-delay:4.1s;width:2.5px}
@keyframes drip{0%{height:0;opacity:0}15%{opacity:.6}70%{height:42px;opacity:.45}100%{height:58px;opacity:0}}
.stain{position:absolute;width:70px;height:40px;border-radius:60% 40% 50% 50%;
  background:radial-gradient(ellipse,rgba(120,0,0,.35),transparent 70%);pointer-events:none;z-index:1;filter:blur(2px)}
.glitch-text{animation:gtxt 3.2s steps(2) infinite;text-shadow:1px 0 #c0392b,-1px 0 #1a1a2e}
@keyframes gtxt{0%,90%,100%{transform:none;opacity:1}92%{transform:translate(2px,-1px);opacity:.85}94%{transform:translate(-2px,1px)}}

.phone.low-bat{filter:brightness(.72)}
.phone.low-bat::after{content:"";pointer-events:none;position:absolute;inset:0;
  box-shadow:inset 0 0 80px 30px rgba(0,0,0,.75);z-index:50}
.phone.calm{background:linear-gradient(180deg,#3a2a22 0%,#243044 52%,#161c24 100%);
  box-shadow:0 24px 80px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,196,140,.28)}
.phone.calm::before{background:radial-gradient(ellipse at 50% 0%,rgba(255,186,96,.28),transparent 46%),
  radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.28) 100%);
  box-shadow:inset 0 0 36px 6px rgba(80,40,10,.12)}
.phone.calm .glitch-text{animation:none;text-shadow:none}
.phone.uneasy{background:linear-gradient(180deg,#2a161c,#141016 62%,#0c0a0c)}
.step-card{background:linear-gradient(160deg,rgba(255,214,160,.16),rgba(20,28,40,.72));
  border:1px solid rgba(255,196,140,.45);border-radius:16px;padding:14px;margin:10px 0}
.phone.uneasy .step-card,.phone.horror .step-card{background:rgba(80,16,24,.4);border-color:rgba(192,57,43,.45)}
.step-card .sk{font-size:10px;letter-spacing:.16em;color:#e7b56a;margin-bottom:4px}
.step-card h3{font-size:18px;margin:0 0 6px}
.step-card p{font-size:13px;line-height:1.6;color:#e6d7c8;margin:0 0 10px}
.status-bar{display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px 8px;font-size:11px;background:var(--glass);backdrop-filter:blur(12px);
  flex-shrink:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.06);gap:6px}
.status-bar .left{display:flex;gap:6px;align-items:center;min-width:0;flex:1}
.status-bar .day-clock{font-weight:700;color:#fff;letter-spacing:.02em;white-space:nowrap}
.status-bar .pname{color:var(--accent);font-weight:600;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-strip{flex-shrink:0;padding:6px 14px;font-size:11px;background:rgba(93,173,226,.12);
  border-bottom:1px solid rgba(93,173,226,.2);color:#a8d4f0;z-index:19}
.day-strip b{color:var(--accent)}
.bat{font-weight:700}
.bat-ok{color:var(--ok)}.bat-mid{color:var(--warn)}.bat-low{color:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.screen{flex:1;overflow-y:auto;padding:12px 14px;position:relative;-webkit-overflow-scrolling:touch}
.dock{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px 16px;
  background:var(--glass);backdrop-filter:blur(12px);flex-shrink:0;border-top:1px solid rgba(255,255,255,.06);z-index:20}
.dock button{border:none;cursor:pointer;font:inherit;color:var(--ink);
  background:var(--card);border-radius:12px;padding:10px 2px;font-size:11px;transition:.15s}
.dock button.active{background:rgba(93,173,226,.25);color:var(--accent)}
.dock button:active{transform:scale(.96)}
.btn,.chip,.choice-btn,.pick-card{border:none;cursor:pointer;font:inherit;color:inherit}
.btn{display:block;width:100%;margin:8px 0;padding:12px 14px;border-radius:12px;
  background:var(--card2);box-shadow:0 2px 12px rgba(0,0,0,.2);text-align:left}
.btn.primary{background:linear-gradient(135deg,#7b1e1e,#c0392b);color:#fff;font-weight:600;text-align:center}
.btn.danger{background:rgba(231,76,60,.2);color:#ff8a80;text-align:center}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted);text-align:center}
.btn:active{transform:scale(.98)}
.chip{display:inline-block;margin:4px;padding:6px 12px;border-radius:999px;
  background:var(--card2);font-size:12px}
h1,h2,h3{font-weight:700}
.muted{color:var(--muted);font-size:12px;line-height:1.6}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin:8px 0;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.06)}

/* Title / setup */
.title-screen{text-align:center;padding:48px 12px 20px}
.logo{font-size:28px;font-weight:800;letter-spacing:.06em;background:linear-gradient(90deg,#7ec8ff,#c9a0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tagline{color:var(--muted);margin:8px 0 20px;font-size:13px}
.blurb{font-size:13px;line-height:1.75;color:#a8b8cc;margin-bottom:24px;text-align:left;
  background:var(--card);padding:14px;border-radius:14px;border-left:3px solid var(--accent)}
.setup h2{font-size:17px;margin:16px 0 8px}
.setup input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.3);color:var(--ink);font-size:15px;outline:none}
.setup input:focus{border-color:var(--accent)}
.identity-grid{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.pick-card{background:var(--card2);border-radius:14px;padding:14px;text-align:left;
  border:2px solid transparent;transition:.15s}
.pick-card.selected{border-color:var(--accent);background:rgba(93,173,226,.15)}
.pick-card .nm{font-weight:700;font-size:15px}
.pick-card .desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}

/* Home */
.home-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.app-icon{background:var(--card2);border-radius:18px;padding:16px 8px;text-align:center;
  border:none;color:var(--ink);cursor:pointer;font:inherit}
.app-icon .ico{font-size:26px;display:block;margin-bottom:6px}
.app-icon .lab{font-size:11px;color:var(--muted)}
.home-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.home-time{font-size:42px;font-weight:200;letter-spacing:2px}
.home-date{font-size:13px;color:var(--muted);margin-top:4px}
.alert-banner{background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.3);
  border-radius:12px;padding:10px 12px;font-size:12px;margin:10px 0;color:#ffab91}

/* Chat list */
.chat-row{display:flex;gap:12px;align-items:center;padding:12px 10px;border-radius:14px;
  background:transparent;width:100%;text-align:left;border:none;color:inherit;cursor:pointer;font:inherit}
.chat-row:active,.chat-row:hover{background:var(--card)}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;flex-shrink:0;position:relative;color:#fff}
.avatar .status-strip{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
  font-size:8px;padding:1px 5px;border-radius:6px;white-space:nowrap;font-weight:600}
.st-ok{background:#27ae60}.st-unstable{background:#f39c12}.st-silent{background:#7f8c8d}.st-abnormal{background:#e74c3c}
.chat-meta{flex:1;min-width:0}
.chat-meta .top{display:flex;justify-content:space-between;align-items:baseline}
.chat-meta .name{font-weight:700;font-size:14px}
.chat-meta .time{font-size:11px;color:var(--muted)}
.chat-meta .prev{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{background:var(--danger);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 5px;margin-left:6px}

/* Chat window */
.chat-header{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;position:sticky;top:0;background:#0d1520;z-index:5;padding-top:2px}
.back-btn{background:var(--card);border:none;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
.bubbles{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;min-height:200px}
.bubble{max-width:82%;padding:10px 12px;border-radius:16px;font-size:13px;line-height:1.55;position:relative}
.bubble.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.bubble.me{align-self:flex-end;background:rgba(93,173,226,.3);border-bottom-right-radius:4px}
.bubble.voice{display:flex;align-items:center;gap:8px;cursor:pointer}
.bubble.voice .wave{letter-spacing:1px;opacity:.7}
.bubble.img{padding:4px;cursor:pointer}
.bubble .read{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
.bubble .read.glitch{color:var(--danger)}
.bubble.sys{align-self:center;background:transparent;color:var(--muted);font-size:11px;max-width:90%;text-align:center}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.choice-btn{background:rgba(93,173,226,.12);border:1px solid rgba(93,173,226,.3);border-radius:12px;
  padding:10px 12px;text-align:left;font-size:13px;color:var(--ink);cursor:pointer}
.choice-btn:active{background:rgba(93,173,226,.25)}
.proactive{margin-top:8px}
.proactive summary{font-size:12px;color:var(--accent);cursor:pointer;padding:6px}

/* Album */
.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-thumb{aspect-ratio:1;border-radius:10px;background:var(--card2);border:none;cursor:pointer;
  overflow:hidden;position:relative;padding:0}
.photo-thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--muted);background:linear-gradient(135deg,#1e2a3a,#2a1e30);text-align:center;padding:6px;line-height:1.3}
.lightbox{position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:40;display:flex;flex-direction:column;
  padding:16px;overflow-y:auto}
.lightbox .close{align-self:flex-end;margin-bottom:8px}
.lightbox .big{flex:1;min-height:220px;border-radius:14px;background:linear-gradient(160deg,#1a2535,#2a1a28);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:12px}
.lightbox .big .desc{padding:20px;text-align:center;font-size:13px;line-height:1.7;color:#c5d0dc}
.hotspot{position:absolute;width:36px;height:36px;border-radius:50%;border:2px dashed rgba(255,200,100,.5);
  background:rgba(255,200,100,.15);cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 12px rgba(255,200,100,.4)}}

/* Map */
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.map-zone{background:var(--card2);border-radius:14px;padding:16px 12px;border:none;color:var(--ink);
  cursor:pointer;font:inherit;text-align:left;min-height:80px}
.map-zone.locked{opacity:.4;cursor:not-allowed}
.map-zone .zn{font-weight:700;font-size:14px}
.map-zone .zh{font-size:11px;color:var(--muted);margin-top:4px}
.map-zone.danger{border:1px solid rgba(231,76,60,.4)}
.map-zone.here{border:1px solid var(--accent)}
.area-view .ambient{font-size:12px;color:var(--muted);font-style:italic;margin:8px 0;line-height:1.6}

/* Records / notes */
.frag{background:var(--card);border-radius:12px;padding:12px;margin:8px 0;border-left:3px solid var(--warn)}
.frag .ft{font-size:11px;color:var(--muted);margin-bottom:4px}
.kw{display:inline-block;margin:3px;padding:4px 10px;border-radius:8px;background:rgba(155,89,182,.2);
  font-size:12px;color:#d7bde2}

/* Jump face overlay */

/* Ending */
.ending{text-align:center;padding:40px 16px}
.ending h1{font-size:22px;margin-bottom:12px}
.ending .body{font-size:14px;line-height:1.8;color:#b0bec5;text-align:left;background:var(--card);
  padding:16px;border-radius:14px;margin:16px 0}
.ending.hidden-end .body{border:1px solid rgba(231,76,60,.4);color:#ffcdd2}
.blackout{position:absolute;inset:0;background:#000;z-index:90;display:flex;align-items:center;
  justify-content:center;flex-direction:column;color:#333;font-size:14px}

/* Menu fab */
.menu-fab{position:absolute;top:48px;right:10px;z-index:25;background:var(--card2);border:none;
  color:var(--muted);border-radius:10px;padding:6px 10px;font-size:11px;cursor:pointer;font:inherit}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;align-items:flex-end;
  justify-content:center}
.modal .sheet{background:#152030;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:70%;overflow-y:auto}

.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);
  color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;z-index:70;white-space:nowrap;
  pointer-events:none;opacity:0;transition:.3s}
.toast.show{opacity:1}

.day-badge{display:inline-block;background:rgba(93,173,226,.2);color:var(--accent);
  font-size:11px;padding:3px 8px;border-radius:6px;margin-bottom:8px}

.deleted-layer{margin:8px 0}
.layer-btn{width:100%;padding:14px;border-radius:12px;border:1px dashed rgba(255,255,255,.2);
  background:rgba(0,0,0,.25);color:var(--ink);cursor:pointer;font:inherit;text-align:left;margin:6px 0}
.layer-btn:disabled{opacity:.4;cursor:not-allowed}
.layer-btn .cost{font-size:11px;color:var(--warn)}

/* Day change — full-screen cinematic */
.day-card-overlay{
  position:absolute;inset:0;z-index:95;
  display:flex;align-items:stretch;justify-content:center;
  background:#000;
  animation:dayFadeIn .45s ease-out;
}
@keyframes dayFadeIn{from{opacity:0}to{opacity:1}}
.day-card-overlay::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 50% 30%,rgba(90,40,60,.35),transparent 55%),
    radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.9),transparent 50%),
    linear-gradient(180deg,#0a0c10 0%,#120a12 40%,#050608 100%);
}
.day-card-overlay::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  box-shadow:inset 0 0 80px 40px rgba(0,0,0,.75);
  opacity:.9;
}
.day-card{
  position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;
  padding:36px 22px 28px;max-width:100%;
  animation:dayCardIn .7s cubic-bezier(.2,.8,.2,1);
}
@keyframes dayCardIn{
  0%{opacity:0;transform:scale(.92) translateY(12px);filter:blur(4px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.day-card .tag{
  display:inline-block;font-size:11px;letter-spacing:.35em;text-transform:uppercase;
  padding:4px 12px;border:1px solid rgba(255,180,180,.25);border-radius:999px;
  color:#e8b4b4;margin-bottom:18px;opacity:.85;
}
.day-card .day-num{
  font-size:64px;font-weight:200;letter-spacing:.12em;line-height:1;
  margin:0 0 6px;
  background:linear-gradient(180deg,#fff5f5 10%,#c9a0ff 55%,#5dade2 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;
  animation:dayNumPulse 2.2s ease-in-out infinite;
}
@keyframes dayNumPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.day-card h2{font-size:15px;font-weight:600;color:#d7dee8;margin:0 0 14px;letter-spacing:.2em}
.day-card .when{font-size:13px;color:#8b9bb0;margin-bottom:20px;letter-spacing:.08em}
.day-card .tone{
  font-size:14px;color:#ffb74d;margin:0 0 16px;line-height:1.65;
  max-width:300px;padding:0 8px;
}
.day-card .goal{
  font-size:13px;line-height:1.75;color:#b0bec5;margin:0 0 12px;
  max-width:300px;padding:12px 14px;border-left:2px solid rgba(93,173,226,.5);
  text-align:left;background:rgba(255,255,255,.03);border-radius:0 10px 10px 0;
}
.day-card .tip{font-size:12px;color:#6b7c90;line-height:1.6;max-width:280px;margin:0 0 28px}
.day-card .continue-btn{
  min-width:160px;padding:14px 28px;border-radius:999px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:#e8eef5;font:inherit;font-size:14px;font-weight:600;
  cursor:pointer;letter-spacing:.15em;opacity:.45;pointer-events:none;transition:.35s;
}
.day-card .continue-btn.ready{
  opacity:1;pointer-events:auto;
  background:linear-gradient(135deg,rgba(90,40,60,.8),rgba(58,123,213,.75));
  border-color:rgba(200,160,255,.4);
  box-shadow:0 0 24px rgba(150,80,120,.35);
}
.day-card .continue-btn.ready:active{transform:scale(.97)}
.day-card .hold-hint{font-size:10px;color:#555;margin-top:10px;letter-spacing:.1em;min-height:14px}

/* Phone flash / shake / status pulse on day change */
.phone.day-flash{animation:phoneDayFlash 1.1s ease-out}
@keyframes phoneDayFlash{
  0%{filter:brightness(0.15)}
  25%{filter:brightness(1.35)}
  50%{filter:brightness(0.4)}
  100%{filter:brightness(1)}
}
.phone.day-shake{animation:phoneDayShake .55s ease-out}
@keyframes phoneDayShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-4px)}
  40%{transform:translateX(4px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(2px)}
}
.status-bar .day-clock.day-pulse{
  animation:dayClockPulse 1.8s ease-out;
  color:#fff !important;
}
@keyframes dayClockPulse{
  0%{text-shadow:0 0 0 transparent;transform:scale(1)}
  30%{text-shadow:0 0 16px rgba(201,160,255,.95),0 0 4px #fff;transform:scale(1.08);color:#e8d5ff}
  100%{text-shadow:none;transform:scale(1)}
}
.day-strip.day-pulse{
  animation:stripFlash 1.6s ease-out;
}
@keyframes stripFlash{
  0%{background:rgba(180,60,90,.45);color:#fff}
  100%{background:rgba(93,173,226,.12);color:#a8d4f0}
}
.today-tip{border-left:3px solid var(--accent);background:rgba(93,173,226,.1);

/* Scare FX — stronger / longer / red flash */
.jump-face,.scare{position:absolute;inset:0;z-index:120;pointer-events:none;display:none;place-items:center;
  background:rgba(80,0,0,.55)}
.jump-face.show,.scare.show{display:grid;animation:redFlash .18s ease-out 2}
@keyframes redFlash{0%{background:rgba(180,0,0,.85)}100%{background:rgba(60,0,0,.5)}}
.jump-face.sil,.scare-map{background:#000}
.jump-face.tiny,.scare-status{place-items:start end;padding:8px 18px 0 0;background:transparent;animation:none}
.jump-face .face-wrap,.scare .face,.jump-face .face{
  width:210px;height:260px;border-radius:46% 46% 42% 42%;
  opacity:.95;filter:blur(3px) contrast(1.15);
  background:
    radial-gradient(circle at 32% 40%, #f5e6d8 0 7px, transparent 9px),
    radial-gradient(circle at 68% 40%, #f5e6d8 0 7px, transparent 9px),
    radial-gradient(ellipse at 50% 58%, rgba(160,0,0,.55), transparent 32%),
    radial-gradient(ellipse at 50% 38%, #2a1010 0%, #0a0404 72%);
  box-shadow:0 0 40px rgba(180,0,0,.55), inset 0 -20px 30px rgba(80,0,0,.4);
  animation:scarePop .75s ease both;
}
.jump-face .face-wrap::after,.jump-face .face::after{
  content:"";position:absolute;left:38%;right:38%;bottom:28%;height:8px;
  background:rgba(120,0,0,.7);border-radius:0 0 12px 12px;filter:blur(1px);
}
.jump-face.clearer .face-wrap,.scare-ending .face{width:260px;height:320px;filter:blur(2px);opacity:1;animation-duration:.9s}
.jump-face.tiny .face-wrap,.scare-status .face{width:28px;height:34px;filter:blur(0.5px);opacity:.9;animation-duration:.45s;border-radius:46%}
.jump-face.sil .face-wrap,.scare-map .face{
  width:120px;height:200px;border-radius:40% 40% 12% 12%;opacity:1;
  background:radial-gradient(ellipse at 50% 30%,#3a1010,#050000 70%);filter:blur(2px);
  box-shadow:0 0 60px #000,0 0 30px rgba(160,0,0,.5);
}
.jump-face.album-scare .face-wrap,.scare-photo .face{width:92%;height:75%;border-radius:8px;animation-duration:.7s;opacity:.98}
.jump-face.reducing .face-wrap,.scare.soft .face,.jump-reduced .face-wrap{opacity:.35;animation-duration:.35s!important;filter:blur(6px)}
@keyframes scarePop{0%{opacity:0;transform:scale(1.35)}25%{opacity:1}100%{opacity:1;transform:scale(1)}}
.jump-face .face-svg{display:none}

.rule-strip{display:block;width:100%;text-align:left;border:1px solid rgba(199,154,99,.34);font:inherit;color:inherit;
  background:linear-gradient(100deg,rgba(120,80,40,.3),rgba(38,20,14,.55));border-radius:12px;padding:9px 11px;margin:8px 0}
.rule-strip .rs-t{font-size:9.5px;letter-spacing:.18em;color:#e0b982}
.rule-strip .rs-l{display:block;font-size:10.5px;color:#bda48d;line-height:1.65;margin-top:3px}
.rule-strip:active{transform:scale(.99)}

/* 相机取景 */
.cam-wrap{position:relative;border-radius:14px;overflow:hidden;margin:8px 0;background:#000}
.cam-view{position:relative;min-height:330px;background-size:cover;background-position:center;
  filter:saturate(.5) contrast(1.12) brightness(.7)}
.cam-view::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
.cam-hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;
  font-size:10px;letter-spacing:.1em;color:#9fd3c8;font-family:ui-monospace,Menlo,monospace;z-index:3}
.cam-frame{position:absolute;inset:28px 18px;border:1px solid rgba(180,255,240,.28);border-radius:6px;z-index:2;pointer-events:none}
.cam-frame::before{content:"";position:absolute;left:-1px;top:-1px;width:24px;height:24px;
  border-left:2px solid rgba(180,255,240,.6);border-top:2px solid rgba(180,255,240,.6)}
.cam-frame::after{content:"";position:absolute;right:-1px;bottom:-1px;width:24px;height:24px;
  border-right:2px solid rgba(180,255,240,.6);border-bottom:2px solid rgba(180,255,240,.6)}
.cam-scan{position:absolute;left:18px;right:18px;height:2px;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(160,255,235,.85),transparent);animation:camScan 2.4s linear infinite}
@keyframes camScan{0%{top:28px}100%{top:calc(100% - 30px)}}
.cam-ghost{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;padding:0;
  border:1px dashed rgba(255,120,120,.85);background:rgba(255,60,60,.1);opacity:0;transition:opacity .7s;z-index:4}
.cam-ghost.on{opacity:1;animation:ghostPulse 1.9s ease-in-out infinite}
.cam-ghost::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
  border-radius:50%;background:#ff6b6b}
@keyframes ghostPulse{50%{box-shadow:0 0 24px rgba(255,80,80,.55);background:rgba(255,60,60,.22)}}
.cam-note{font-size:11px;color:#8fd6c8;text-align:center;letter-spacing:.05em;padding:8px 6px;background:rgba(0,0,0,.6)}
/* —— 同行者 · 立绘 —— */
.comp-dock{display:flex;gap:8px;margin:8px 0;padding:8px 10px 8px 6px;border-radius:14px;position:relative;
  background:linear-gradient(115deg,rgba(78,12,20,.5),rgba(14,6,8,.42));
  border:1px solid rgba(196,30,58,.24);overflow:hidden}
.comp-dock::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90px 70px at 38px 46%,rgba(196,30,58,.18),transparent 72%)}
.comp-dock.fear{border-color:rgba(255,90,90,.34);background:linear-gradient(115deg,rgba(52,10,14,.6),rgba(10,4,6,.5))}
.comp-dock.eerie{border-color:rgba(255,42,42,.42);animation:compEerie 6s ease-in-out infinite}
@keyframes compEerie{0%,90%,100%{filter:none}92%{filter:brightness(1.3) hue-rotate(-7deg);transform:translateX(.5px)}95%{filter:none}}
.comp-art{flex:0 0 74px;width:74px;height:112px;position:relative;cursor:pointer;
  display:flex;align-items:flex-end;justify-content:center}
.comp-art svg{width:100%;height:100%;display:block;overflow:visible;animation:compBreath 5.4s ease-in-out infinite;
  filter:drop-shadow(0 0 10px rgba(196,30,58,.35))}
@keyframes compBreath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.008)}}
.comp-talk{flex:1;min-width:0;position:relative;z-index:1}
.comp-name{font-size:12px;color:#f2dede;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.comp-name b{color:#ff9a90;font-weight:700;letter-spacing:.02em}
.comp-mask{font-size:10px;color:var(--muted)}
.comp-tag{margin-left:auto;font-size:9px;padding:1px 6px;border-radius:999px;
  border:1px solid rgba(199,154,99,.4);color:#dcc0a0;letter-spacing:.06em;white-space:nowrap}
.comp-dock.fear .comp-tag{border-color:rgba(255,90,90,.5);color:#ffb3b3}
.comp-line{font-size:12.5px;line-height:1.6;color:#e6d3d3;margin:4px 0 6px;min-height:36px;transition:opacity .12s ease}
.comp-glitch{color:#ff8a8a;font-style:normal;opacity:.85;font-size:11.5px}
.comp-acts{display:flex;flex-wrap:wrap;gap:4px}
.comp-acts .chip{margin:0;padding:4px 9px;font-size:10.5px}
.comp-empty{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;
  margin:8px 0;padding:10px 12px;border-radius:13px;cursor:pointer;
  background:rgba(40,12,16,.4);border:1px dashed rgba(196,30,58,.35)}
.comp-empty .ce-plus{font-size:16px;color:#c8626a;line-height:1}
.comp-empty .ce-txt{font-size:11.5px;color:#d8bebe;line-height:1.5}
.comp-empty .ce-txt em{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:2px}
.comp-empty:active{transform:scale(.995)}

/* —— 同行者选择 —— */
.pick-ov{position:absolute;inset:0;z-index:120;background:rgba(6,2,3,.94);
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease}
.pick-sheet{width:100%;max-height:100%;overflow-y:auto;padding:14px 12px 20px;
  background:linear-gradient(180deg,rgba(30,10,14,.6),rgba(8,4,6,.98) 22%);
  border-top:1px solid rgba(196,30,58,.35);border-radius:18px 18px 0 0}
.pick-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.pick-kicker{font-size:9px;letter-spacing:.24em;color:#a8626a}
.pick-head h3{margin:2px 0 0;font-size:16px;color:#ffe6e6}
.pick-x{background:none;border:none;color:#c99;font-size:16px;padding:2px 6px;cursor:pointer}
.pick-note{font-size:10.5px;line-height:1.6;color:var(--muted);margin:6px 0 10px}
.pick-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.pick-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;color:inherit;
  padding:6px 8px;border-radius:11px;cursor:pointer;border:1px solid rgba(196,30,58,.16);
  background:rgba(50,14,20,.3)}
.pick-row.sel{border-color:rgba(255,120,120,.55);background:rgba(90,20,28,.42)}
.pick-row:active{transform:scale(.995)}
.pick-art{flex:0 0 42px;width:42px;height:60px;display:flex;align-items:flex-end;justify-content:center}
.pick-art svg{width:100%;height:100%;display:block}
.pick-txt{flex:1;min-width:0}
.pick-name{font-size:12px;color:#f0dcdc}
.pick-name span{font-size:10px;color:var(--muted);margin-left:3px}
.pick-line{font-size:10.5px;color:#c9a9a9;line-height:1.45;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptag{flex:0 0 auto;font-size:9px;padding:2px 6px;border-radius:999px;
  border:1px solid rgba(150,150,150,.3);color:#a99;white-space:nowrap}
.ptag.yes{border-color:rgba(140,200,150,.45);color:#9fd4a8}
.ptag.no{border-color:rgba(255,90,90,.45);color:#ffaaaa}

/* —— 取景框里的小窗 —— */
.cam-comp{position:absolute;right:8px;bottom:10px;width:62px;height:92px;z-index:6;cursor:pointer;
  filter:grayscale(.4) contrast(1.06) brightness(.95)}
.cam-comp svg{width:100%;height:100%;display:block;overflow:visible}
.cam-comp-cap{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:8.5px;
  letter-spacing:.12em;color:#a8ded2;font-family:ui-monospace,Menlo,monospace;opacity:.85}
/* —— NPC 立绘 —— */
.npc-svg{display:block;width:100%;height:100%}
.npc-card{display:flex;gap:10px;align-items:center;margin-top:6px}
.npc-art{flex:0 0 56px;width:56px;height:72px;cursor:pointer;opacity:.96;
  filter:saturate(.86) brightness(.96)}
.npc-art:active{transform:scale(.98)}

/* —— NPC 近看 —— */
.npc-close-ov{position:absolute;inset:0;z-index:130;background:rgba(4,2,3,.96);
  display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease}
.npc-close-card{width:100%;max-width:320px;text-align:center}
.npc-close-art{position:relative;width:198px;height:248px;margin:0 auto 4px;
  filter:saturate(.92) contrast(1.03)}
.npc-close-art svg{width:100%;height:100%;display:block}
.npc-close-mark{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
.npc-close-card.reveal .npc-close-mark{opacity:1;
  background:radial-gradient(64px 64px at 50% 60%,rgba(255,0,0,.26),transparent 72%);
  animation:npcPulse 2.6s ease-in-out infinite}
@keyframes npcPulse{0%,100%{opacity:.45}50%{opacity:1}}
.npc-close-card.reveal .npc-close-art{animation:npcJolt .5s ease}
@keyframes npcJolt{0%{transform:none}25%{transform:translate(-2px,1px) scale(1.012)}55%{transform:translate(2px,-1px)}100%{transform:none}}
.npc-close-name{font-size:13px;color:#f0dada}
.npc-close-name span{font-size:10px;color:var(--muted);margin-left:4px}
.npc-close-txt{font-size:12.5px;line-height:1.75;color:#dcc6c6;margin:10px 2px;min-height:78px}
.npc-close-txt b{color:#ff9b93;font-weight:600}
.npc-note{color:var(--muted);font-size:11px}
.npc-close-acts{display:flex;flex-direction:column;gap:8px}
.nc-btn{padding:11px;border-radius:11px;border:1px solid rgba(196,30,58,.45);
  background:linear-gradient(135deg,#5a1018,#8b1a24);color:#ffeaea;font:inherit;font-size:12.5px;cursor:pointer}
.nc-btn.ghost{background:transparent;color:#c9a6a6;border-color:rgba(150,110,110,.3)}

/* —— 聊天头像（有公式照自动顶上，没有就显示假面） —— */
.face-slot{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#120a0c}
.face-slot .comp-svg{position:absolute;inset:0;width:100%;height:100%;display:block;animation:none;filter:none}
.face-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.face-img.on{opacity:1}

/* Summer-fair music box. Daytime is warm; night only drops notes. */
(function () {
  let ctx = null;
  let master = null;
  let nodes = [];
  let started = false;
  let running = false;
  window.__ambienceMuted = false;
  window.__ambienceVol = 42;
  try {
    const v = localStorage.getItem("tbz_thrilling_ambience_vol");
    if (v != null) window.__ambienceVol = Math.max(0, Math.min(100, parseInt(v, 10) || 42));
    window.__ambienceMuted = localStorage.getItem("tbz_thrilling_ambience_mute") === "1";
  } catch (e) {}
  let soft = false;
  let duckGain = 1;
  let tense = 0;
  let raf = 0;
  let bellTimer = 0;
  let step = 0;
  /* C major waltz: bright dusk, not a sub drone */
  const DUSK = [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25, 523.25, 587.33, 698.46, 783.99, 698.46, 587.33];

  function ensureCtx() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    return ctx;
  }

  function buildGraph() {
    if (!ctx || nodes.length) return;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 1400;
    filter.Q.value = 0.5;

    const gPad = ctx.createGain();
    gPad.gain.value = 0.035;
    const oscA = ctx.createOscillator();
    oscA.type = "sine";
    oscA.frequency.value = 261.63;
    const oscB = ctx.createOscillator();
    oscB.type = "sine";
    oscB.frequency.value = 329.63;
    oscA.connect(gPad);
    oscB.connect(gPad);
    gPad.connect(filter);

    const len = Math.floor(ctx.sampleRate * 4);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      data[i] = last * 1.2;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const gAir = ctx.createGain();
    gAir.gain.value = 0.012;
    const airLp = ctx.createBiquadFilter();
    airLp.type = "lowpass";
    airLp.frequency.value = 900;
    src.connect(airLp);
    airLp.connect(gAir);
    gAir.connect(filter);
    filter.connect(master);
    oscA.start();
    oscB.start();
    src.start();
    nodes = [{ gPad, filter, gAir, oscA, oscB }];
  }

  function volFactor() {
    if (window.__ambienceMuted || !running) return 0;
    const slider = Math.max(0, Math.min(100, window.__ambienceVol || 42)) / 100;
    let base = (soft ? 0.22 : 0.38) * slider;
    base *= duckGain;
    return Math.min(0.45, base);
  }

  function playBell(freq, dur, gainV) {
    if (!ctx || !master) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const now = ctx.currentTime;
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(Math.max(0.012, gainV), now + 0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g);
    g.connect(master);
    o.start(now);
    o.stop(now + dur + 0.02);
  }

  function bellTick() {
    if (!running || !ctx) return;
    let f = DUSK[step % DUSK.length];
    const skip = tense > 0.45 && step % 8 === 5;
    if (tense > 0.3 && step % 6 === 4) f *= 15 / 16;
    if (tense > 0.65) f *= 0.5;
    const slider = Math.max(0, Math.min(100, window.__ambienceVol || 42)) / 100;
    const gainV = (soft ? 0.045 : 0.08) * slider * duckGain * (1 - tense * 0.25);
    if (!skip && gainV > 0.008) playBell(f, tense > 0.5 ? 0.7 : 0.42, gainV);
    step++;
    const gap = (tense > 0.5 ? 460 : 300) + (step % 3 === 0 ? 40 : 0);
    bellTimer = setTimeout(bellTick, gap);
  }

  function applyTense() {
    if (!nodes.length || !ctx) return;
    const n = nodes[0];
    const now = ctx.currentTime;
    n.filter.frequency.setTargetAtTime(1400 - tense * 700, now, 1.4);
    n.gPad.gain.setTargetAtTime(0.03 + tense * 0.02, now, 1.2);
    n.oscB.detune.setTargetAtTime(tense * 18, now, 1.2);
  }

  function tickAmbience() {
    if (!running || !ctx) return;
    try {
      let t = 0;
      if (typeof S !== "undefined" && S) {
        if (S.day >= 2) t += 0.18;
        if (S.day >= 3) t += 0.18;
        if (typeof isLateNight === "function" && isLateNight()) t += 0.22;
        if (typeof isLowBat === "function" && isLowBat()) t += 0.12;
        if ((S.flags && S.flags.anomaliesSeen) >= 5) t += 0.12;
      }
      tense = Math.min(0.9, t);
      applyTense();
      if (master) master.gain.setTargetAtTime(volFactor(), ctx.currentTime, 1.1);
    } catch (e) {}
    raf = setTimeout(tickAmbience, 2400);
  }

  function start() {
    const c = ensureCtx();
    if (!c) return;
    if (c.state === "suspended") c.resume().catch(function () {});
    buildGraph();
    started = true;
    running = true;
    master.gain.setTargetAtTime(volFactor(), c.currentTime, 0.8);
    clearTimeout(raf);
    clearTimeout(bellTimer);
    tickAmbience();
    bellTick();
  }

  window.ambienceUnlock = function () {
    const c = ensureCtx();
    if (!c) return;
    if (c.state === "suspended") c.resume().catch(function () {});
    if (!running && !window.__ambienceMuted) start();
  };
  window.ambienceToggle = function () {
    window.__ambienceMuted = !window.__ambienceMuted;
    try {
      localStorage.setItem("tbz_thrilling_ambience_mute", window.__ambienceMuted ? "1" : "0");
    } catch (e) {}
    if (window.__ambienceMuted) {
      if (master && ctx) master.gain.setTargetAtTime(0, ctx.currentTime, 0.4);
    } else {
      if (!started) window.ambienceUnlock();
      else if (master && ctx) master.gain.setTargetAtTime(volFactor(), ctx.currentTime, 0.5);
    }
    return !window.__ambienceMuted;
  };
  window.ambienceSetVolume = function (v) {
    window.__ambienceVol = Math.max(0, Math.min(100, Number(v) || 0));
    try {
      localStorage.setItem("tbz_thrilling_ambience_vol", String(window.__ambienceVol));
    } catch (e) {}
    if (window.__ambienceVol <= 0) window.__ambienceMuted = true;
    else if (window.__ambienceMuted) {
      window.__ambienceMuted = false;
      try {
        localStorage.setItem("tbz_thrilling_ambience_mute", "0");
      } catch (e) {}
      if (!started) window.ambienceUnlock();
    }
    if (master && ctx && running) master.gain.setTargetAtTime(volFactor(), ctx.currentTime, 0.4);
  };
  window.ambienceSetSoft = function (on) {
    soft = !!on;
    if (master && ctx && running) {
      master.gain.setTargetAtTime(volFactor(), ctx.currentTime, 0.5);
      applyTense();
    }
  };
  window.ambienceDuck = function (level) {
    duckGain = typeof level === "number" ? level : 0.1;
    if (master && ctx) master.gain.setTargetAtTime(volFactor(), ctx.currentTime, 0.4);
  };
  window.ambienceStop = function () {
    duckGain = 0;
    running = false;
    clearTimeout(raf);
    clearTimeout(bellTimer);
    if (master && ctx) master.gain.setTargetAtTime(0, ctx.currentTime, 0.25);
  };
  window.ambienceResumeLow = function () {
    duckGain = 1;
    if (!window.__ambienceMuted && started) start();
  };
  window.ambienceScareSting = function () {
    const c = ensureCtx();
    if (!c || window.__ambienceMuted) return;
    if (c.state === "suspended") c.resume();
    const slider = Math.max(0.2, (window.__ambienceVol || 48) / 100);
    const g = c.createGain();
    g.gain.value = 0;
    g.connect(c.destination);
    const o = c.createOscillator();
    o.type = "sine";
    o.frequency.value = 62;
    const o2 = c.createOscillator();
    o2.type = "sine";
    o2.frequency.value = 78;
    const f = c.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = 320;
    o.connect(f);
    o2.connect(f);
    f.connect(g);
    const now = c.currentTime;
    const peak = 0.12 * slider;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(peak, now + 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
    o.start(now);
    o2.start(now);
    o.stop(now + 0.9);
    o2.stop(now + 0.9);
  };

  /** Distinct soft UI clicks */
  window.playUiSfx = function (kind) {
    const c = ensureCtx();
    if (!c) return;
    if (c.state === "suspended") c.resume().catch(function () {});
    const now = c.currentTime;
    const g = c.createGain();
    g.connect(c.destination);
    const o = c.createOscillator();
    const f = c.createBiquadFilter();
    f.type = "lowpass";
    o.connect(f);
    f.connect(g);
    let freq = 400,
      type = "sine",
      peak = 0.045,
      dur = 0.05,
      f0 = 1600;
    kind = kind || "default";
    if (kind === "chat") {
      freq = 580;
      peak = 0.04;
      dur = 0.06;
      f0 = 2200;
    } else if (kind === "map") {
      freq = 190;
      type = "triangle";
      peak = 0.055;
      dur = 0.08;
      f0 = 800;
    } else if (kind === "album") {
      freq = 900;
      type = "triangle";
      peak = 0.035;
      dur = 0.04;
      f0 = 2800;
    } else if (kind === "menu" || kind === "settings") {
      freq = 320;

      dur = 0.07;
      f0 = 1200;
    } else if (kind === "records" || kind === "notes" || kind === "calendar") {
      freq = 480;
      type = "triangle";
      peak = 0.035;
      dur = 0.06;
      f0 = 1500;
    } else if (kind === "deleted" || kind === "recorder") {
      freq = 150;
      peak = 0.055;
      dur = 0.1;
      f0 = 500;
    } else if (kind === "browser" || kind === "alarm") {
      freq = 520;
      peak = 0.04;
      dur = 0.05;
      f0 = 1800;
    } else if (kind === "home" || kind === "dock") {
      freq = 260;
      peak = 0.03;
      dur = 0.045;
      f0 = 1000;
    } else if (kind === "play" || kind === "inv") {
      freq = 440;
      peak = 0.03;
      dur = 0.04;
      f0 = 1000;
    }
    o.type = type;
    o.frequency.value = freq;
    f.frequency.value = f0;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(peak, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.start(now);
    o.stop(now + dur + 0.02);
  };

  function onceUnlock() {
    window.ambienceUnlock();
    window.removeEventListener("pointerdown", onceUnlock, true);
    window.removeEventListener("keydown", onceUnlock, true);
  }
  window.addEventListener("pointerdown", onceUnlock, true);
  window.addEventListener("keydown", onceUnlock, true);
})();

(function () {
  let ctx = null;
  let master = null;
  let nodes = [];
  let playingId = null;
  let duckPrev = null;
  let musicTimer = 0;
  let musicStep = 0;
  window.__tbzMusicVol = 58;
  try {
    const v = localStorage.getItem("tbz_thrilling_music_vol");
    if (v != null) window.__tbzMusicVol = Math.max(0, Math.min(100, parseInt(v, 10) || 92));
  } catch (e) {}

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlockAudio() {
    const c = ensure();
    if (!c) return null;
    if (c.state === "suspended") {
      c.resume().catch(function () {});
    }
    if (typeof ambienceUnlock === "function") ambienceUnlock();
    // unmute park pad if user muted by accident — remix needs context alive
    return c;
  }

  function stopTrack(fade) {
    clearTimeout(musicTimer);
    musicTimer = 0;
    if (!ctx || !master) {
      playingId = null;
      updateNowPlaying();
      return;
    }
    const now = ctx.currentTime;
    try {
      master.gain.cancelScheduledValues(now);
      master.gain.setTargetAtTime(0.0001, now, fade ? 0.2 : 0.04);
    } catch (e) {}
    const snap = nodes.slice();
    nodes = [];
    playingId = null;
    updateNowPlaying();
    setTimeout(function () {
      snap.forEach(function (n) {
        try {
          if (n.stop) n.stop();
        } catch (e) {}
      });
      if (typeof ambienceResumeLow === "function" && duckPrev != null) {
        ambienceResumeLow();
        duckPrev = null;
      }
    }, fade ? 350 : 60);
  }

  function musicVolFactor() {
    const slider = Math.max(0.2, (window.__tbzMusicVol || 58) / 100);
    return Math.min(0.55, 0.42 * slider);
  }

  const MELODY = {
    dusk:  [0, 4, 7, 12, 7, 4, 0, 4, 7, 11, 7, 4],
    lemon: [0, 2, 4, 7, 9, 7, 4, 2, 0, 4, 7, 12],
    horse: [0, 4, 7, 12, 7, 4, 0, 7],
    half:  [0, 4, 7, 12, 7, null, 0, 4],
    kevin: [0, 4, 7, 11, 12, 11, 7, 4, 0, 2, 4, 7],
    lot:   [0, 1, 6, 7, 1, 0, null, 1],
  };

  function playMusicNote(c, track, semi, when, beat) {
    if (semi == null) return;
    const o = c.createOscillator();
    o.type = track.mode === "lemon" ? "triangle" : track.mode === "lot" ? "triangle" : "sine";
    let f = track.root * Math.pow(2, semi / 12);
    if (track.mode === "horse") f *= 1.012;
    o.frequency.setValueAtTime(f, when);
    const g = c.createGain();
    const peak = track.mode === "lot" ? 0.16 : 0.22;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(peak, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.18, beat * 0.92));
    const lp = c.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = track.mode === "lot" ? 900 : 2400;
    o.connect(lp);
    lp.connect(g);
    g.connect(master);
    o.start(when);
    o.stop(when + beat + 0.05);
    nodes.push(o);
  }

  function musicTick(track) {
    if (!ctx || playingId !== track.id) return;
    const seq = MELODY[track.mode] || MELODY.dusk;
    const semi = seq[musicStep % seq.length];
    const beat = 60 / (track.bpm || 90);
    const when = ctx.currentTime + 0.02;
    playMusicNote(ctx, track, semi, when, beat);
    musicStep++;
    const gap = (semi == null ? beat * 1.35 : beat) * 1000;
    musicTimer = setTimeout(function () { musicTick(track); }, gap);
  }

  function startRemix(track) {
    const c = unlockAudio();
    if (!c) {
      toast("无法启动音频 · 请再点一次播放");
      return;
    }
    stopTrack(false);
    if (typeof ambienceDuck === "function") {
      duckPrev = true;
      ambienceDuck(0.35);
    }
    const vol = musicVolFactor();
    master.gain.setValueAtTime(0.0001, c.currentTime);
    master.gain.linearRampToValueAtTime(vol, c.currentTime + 0.2);
    playingId = track.id;
    musicStep = 0;
    musicTick(track);
    updateNowPlaying();
    toast("♪ " + track.title.split("·")[0].trim());
  }

  function updateNowPlaying() {
    let bar = document.getElementById("nowPlayingBar");
    if (!playingId) {
      if (bar) bar.remove();
      return;
    }
    const t = TBZ_PLAYLIST.find(function (x) {
      return x.id === playingId;
    });
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "nowPlayingBar";
      bar.className = "now-playing";
      const phone = document.getElementById("phone");
      if (phone) phone.appendChild(bar);
    }
    bar.innerHTML =
      '<span class="np-ico">♪</span><span class="np-txt">' +
      (t ? t.title.split("·")[0].trim() : "重混") +
      ' 播放中</span><button type="button" class="np-stop" onclick="tbzMusicStop()">停</button>';
  }

  window.tbzMusicPlaying = function () {
    return playingId;
  };
  window.tbzMusicStop = function () {
    stopTrack(true);
    toast("音乐已停止");
  };
  window.tbzMusicSetVol = function (v) {
    window.__tbzMusicVol = Math.max(0, Math.min(100, Number(v) || 0));
    try {
      localStorage.setItem("tbz_thrilling_music_vol", String(window.__tbzMusicVol));
    } catch (e) {}
    if (master && ctx && playingId) {
      master.gain.setTargetAtTime(musicVolFactor(), ctx.currentTime, 0.15);
    }
  };
  window.tbzMusicPlay = function (id) {
    unlockAudio();
    const t = TBZ_PLAYLIST.find(function (x) {
      return x.id === id;
    });
    if (!t) return;
    if (playingId === id) {
      stopTrack(true);
      toast("已停止 · " + t.title);
      if (typeof openMusicMenu === "function") openMusicMenu();
      return;
    }
    startRemix(t);
    if (typeof openMusicMenu === "function") openMusicMenu();
  };

  window.openMusicMenu = function () {
    unlockAudio();
    const screen = document.getElementById("screen");
    const cur = playingId;
    const rows = TBZ_PLAYLIST.map(function (t) {
      const on = cur === t.id;
      return (
        '<div class="music-card ' +
        (on ? "on" : "") +
        '">' +
        '<div class="mc-title">' +
        esc(t.title) +
        (on ? ' <span class="mark mark-good">播放中 · 应能听见</span>' : "") +
        "</div>" +
        '<div class="muted" style="font-size:11px;margin:4px 0 8px">' +
        esc(t.vibe) +
        "</div>" +
        '<button class="chip" onclick="tbzMusicPlay(\'' +
        t.id +
        "')\">" +
        (on ? "停止" : "播放这首") +
        "</button></div>"
      );
    }).join("");
    screen.innerHTML =
      '<div><button class="back-btn" onclick="S.tab=\'home\';render()">← 主页</button>' +
      '<h3 class="glitch-text">音乐 · 夏夜游乐场</h3>' +
      '<div class="alert-banner" style="font-size:12px;line-height:1.55">原创音盒，不是官方曲，也不是警报。白天明亮，入夜才会少拍、走调。默认先听「闭园前」。</div>' +
      '<div class="vol-row">🎶 音乐音量 <input type="range" min="0" max="100" value="' +
      (window.__tbzMusicVol || 58) +
      "\" oninput=\"tbzMusicSetVol(this.value);document.getElementById('mVolLab').textContent=this.value\"/><span id=\"mVolLab\">" +
      (window.__tbzMusicVol || 58) +
      "</span></div>" +
      rows +
      '<button class="btn" onclick="tbzMusicStop();openMusicMenu()">全部停止</button>' +
      '<button class="btn ghost" onclick="openMenu()">返回菜单</button></div>';
  };

  // resume graph on any user gesture
  function gestureResume() {
    unlockAudio();
    if (playingId && ctx && master) {
      master.gain.setTargetAtTime(musicVolFactor(), ctx.currentTime, 0.1);
    }
  }
  window.addEventListener("pointerdown", gestureResume, true);
  window.addEventListener("touchstart", gestureResume, true);
  window.addEventListener("keydown", gestureResume, true);
})();

function advanceTime(mins, opts){
  if(S.flags.ended) return;
  opts = opts || {};
  const raw = Math.max(0, mins|0);
  const add = opts.exact ? raw : Math.round(raw * (opts.mult != null ? opts.mult : TIME_MULT));
  const prevDay = S.day;
  S.minute += add;
  while(S.minute>=60){S.minute-=60;S.hour++;}
  while(S.hour>=24){
    S.hour-=24;
    S.day++;
  }
  if(S.day > prevDay){
    for(let d=prevDay; d<S.day && d<=3; d++){
      if(typeof deliverDayEssays==="function") deliverDayEssays(d);
    }
  }
  if(S.day > prevDay && S.day<=3){
    S.pendingDayCard = S.day;
    S.flags.dayBriefed[S.day] = false;
  }
  if(S.day>3){
    if(!S.flags.ended) tryEnding("timeup");
    S.day = 3; S.hour = Math.min(S.hour, 23);
  }
  // Night of day 2+ anomaly start
  if(S.day>=2 && S.hour>=22) S.flags.nightAnomalyStarted=true;
  if(S.day===3 && S.hour>=19 && typeof injectDayEndMemo==='function') injectDayEndMemo(3);
  if(typeof maybeOwnerPing==="function"){
    if(S.day>=2 && !S.flags.ownerPingDay2){ S.flags.ownerPingDay2=true; maybeOwnerPing({force:true}); }
    if(S.day>=3 && !S.flags.ownerPingDay3){ S.flags.ownerPingDay3=true; maybeOwnerPing({force:true}); }
    else if(Math.random()<0.45) maybeOwnerPing();
  }
  if(S.day>=3) S.flags.nightAnomalyStarted=true;
  updateStatus();
  if(S.pendingDayCard && !opts.silentDay){
    // show after current render cycle
    setTimeout(()=>showDayCard(S.pendingDayCard), 60);
  }
}
function drainBattery(n){
  if(S.flags.ended || S.flags.deadBattery) return;
  let amount = n * identityMod().batDrain;
  // dangerous zones drain faster when critical / night
  const z = ZONES.find(x=>x.id===S.currentZone);
  if(z && z.danger && (isLowBat() || isLateNight())) amount *= 1.35;
  S.battery = Math.max(0, +(S.battery - amount).toFixed(1));
  if(S.battery<=0){
    S.battery=0;
    // refused charge before + in danger → hard bad ending
    if(S.flags.refusedCharge && z && z.danger){
      triggerBadEnding();
      return;
    }
    onBatteryDead();
    return;
  }
  if(S.battery<28){ tryStatusJumpFace(); }
  updateStatus();
}

function isLowBat(){ return S.battery<45; }
function isCritBat(){ return S.battery<20; }
function anomalyLevel(){
  let lv=0;
  // Day1: keep mostly calm — only tiny contribution from extreme states
  if(S.day===1){
    if(isCritBat()) lv += 0.25;
    if(S.flags.anomaliesSeen>=3) lv += 0.25;
    lv -= identityMod().anomalyDelay*0.5;
    return Math.max(0, Math.min(1, lv)); // cap day1
  }
  if(S.flags.nightAnomalyStarted) lv++;
  if(S.day>=2 && isLateNight()) lv++;
  if(S.day>=3) lv += 1.5;
  if(isLowBat()) lv++;
  if(isCritBat()) lv++;
  if(S.deletedLayer>=2) lv++;
  if(S.deletedLayer>=3) lv++;
  lv += Math.floor(S.flags.anomaliesSeen/4);
  lv -= identityMod().anomalyDelay*0.5;
  return Math.max(0, lv);
}
function dayLabel(d){
  d = d==null ? S.day : d;
  return "第"+Math.min(Math.max(d,1),3)+"天";

function dayBrief(d){
  return DAY_INFO[Math.min(Math.max(d||S.day,1),3)] || DAY_INFO[1];

function charPhase(id){
  // 0 early, 1 mid, 2 late — day-gated
  let st = S.stage[id]||0;
  const att = S.attention[id]||0;
  const lv = anomalyLevel();
  if(S.day===1){
    // Day1: stay early; very high attention can edge to mid only at night
    if(att>=10 && isLateNight()) st=Math.max(st,1);
    return Math.min(1, Math.max(0, st)); // never late on day1
  }
  if(lv>=3 || att>=8 || S.day>=3) st=Math.max(st,2);
  else if(lv>=1.5 || att>=4 || (S.day>=2 && isLateNight())) st=Math.max(st,1);
  return Math.min(2, Math.max(0, st));
}
function charStatus(id){
  if(typeof presenceOf==="function") return presenceOf(id);
  if(!isLowBat()) return null;
  const ph=charPhase(id);
  const att=S.attention[id];
  if(ph>=2 || att>=10) return "异常";
  if(ph>=1) return "不稳定";
  if(S.unread[id]===0 && S.chatLog[id].length>2 && Math.random()<0.3) return "沉默";
  return "正常";
}

function maybeJumpFace(kind, force){
  if(S.jumpFaceCount>=5) return false;
  const slot = kind==="album" ? "album" : kind; // photo→album in our slots
  if(!force){
    if(S.jumpUsed[slot]) return false;
  } else if(S.jumpUsed[slot]) {
    return false;
  }
  S.jumpFaceCount++;
  S.jumpUsed[slot]=1;
  if(typeof ambienceScareSting==="function") try{ambienceScareSting();}catch(e){}
  const el=document.getElementById("jumpFace");
  const phone=document.getElementById("phone");
  if(!el) return true;
  el.className="jump-face show";
  const soft = !!(S.flags.jumpReduce || S.flags.softScare);
  if(soft) el.classList.add("reducing");
  if(phone && soft) phone.classList.add("jump-reduced");
  if(kind==="status") el.classList.add("tiny");
  if(kind==="map") el.classList.add("sil");
  if(kind==="album") el.classList.add("album-scare");
  if(kind==="hidden") el.classList.add("clearer");
  // DUR from ref PhoneGame: chat560 photo460 map600 status380 ending720
  const DUR = (typeof JUMP_DUR!=="undefined") ? JUMP_DUR : {chat:560,album:460,map:600,status:380,hidden:720};
  let dur = DUR[slot] || DUR[kind] || 500;
  if(soft) dur = Math.min(dur, 380);
  clearTimeout(maybeJumpFace._tm);
  maybeJumpFace._tm = setTimeout(()=>{
    el.className="jump-face";
    if(phone) phone.classList.remove("jump-reduced");
  }, dur);
  return true;
}

function tryChatJumpFace(cid){
  if(S.jumpUsed.chat || S.jumpFaceCount>=5) return false;
  const ph=charPhase(cid);
  // mid+ with night OR late with low bat OR day3
  const ok = (ph>=1 && isLateNight()) || (ph>=2 && isLowBat()) || (S.day>=3 && isLowBat()) || (S.day>=2 && isCritBat() && ph>=1);
  if(ok) return maybeJumpFace("chat");
  return false;
}
function tryStatusJumpFace(){
  if(S.jumpUsed.status || S.jumpFaceCount>=5) return false;
  if(S.battery < 28) return maybeJumpFace("status");
  return false;
}


// —— Keywords / records ——
function addKeyword(kw){
  if(!kw||S.keywords.includes(kw)) return;
  S.keywords.push(kw);
  toast("笔记+" + kw);
}
function addRecord(title,text){
  if(S.records.some(r=>r.title===title)) return;
  S.records.push({title,text,day:S.day,time:fmtTime()});
  toast("已保存记录");
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._tm); toast._tm=setTimeout(()=>t.classList.remove("show"),1800);
}

function fmtTime(){
  if(isCritBat() && Math.random()<0.35){
    // glitch digits
    const gh=(S.hour+Math.floor(Math.random()*5)+1)%24;
    const gm=(S.minute+Math.floor(Math.random()*40))%60;
    return String(gh).padStart(2,"0")+":"+String(gm).padStart(2,"0");
  }
  return String(S.hour).padStart(2,"0")+":"+String(S.minute).padStart(2,"0");
}
function realTime(){ return String(S.hour).padStart(2,"0")+":"+String(S.minute).padStart(2,"0"); }


function clockLabel(){
  const pad=n=>String(n).padStart(2,"0");
  const hh=S.hour, mm=S.minute;
  // ref: low battery glitches
  if(S.battery<=8 && (hh*60+mm)%5===0) return "第二天 "+pad(hh)+":"+pad(mm);
  if(S.battery<=12 && (hh*60+mm)%4===0) return "25:"+pad(mm);
  if(S.timeGlitch || (isCritBat() && Math.random()<0.2)){
    const gh=(hh+Math.floor(Math.random()*5)+1)%24;
    const gm=(mm+Math.floor(Math.random()*40))%60;
    return pad(gh)+":"+pad(gm);
  }
  return pad(hh)+":"+pad(mm);
}

  const sbClock=document.getElementById("sbDayClock");

  const sbN=document.getElementById("sbName");

    S=Object.assign(base, loaded);

    if(S.flags.disclaimerOk==null) S.flags.disclaimerOk=!!S.playerName; // 旧档有进度则跳过须知
    if(!S.inv) S.inv=[];

    if(!S.digits) S.digits=[];
    if(!S.puzzle) S.puzzle={unlockedLot:false,unlockedL3:false,attempt:0,slots:["","","",""]};

    if(!S.suspectMark) S.suspectMark={};
    if(typeof gpInit==="function") gpInit();

    CHARS.forEach(c=>{
      if(S.attention[c.id]==null) S.attention[c.id]=0;
      if(S.stage[c.id]==null) S.stage[c.id]=0;
      if(!S.chatLog[c.id]) S.chatLog[c.id]=[];
      if(S.reread[c.id]==null) S.reread[c.id]=0;

function waitUntilNight(){
  // intentional jump — exact minutes (no TIME_MULT)
  if(S.hour < 22){
    const mins = (22 - S.hour)*60 + (30 - S.minute);
    advanceTime(Math.max(40, mins), {exact:true});
  } else if(S.hour < 23){
    advanceTime(50, {exact:true});
  } else {
    // roll into next calendar evening then to night
    const toMidnight = (24-S.hour)*60 - S.minute;
    advanceTime(toMidnight + 18*60 + 30, {exact:true}); // next day 18:30 then nudge
    if(S.hour < 22) advanceTime((22-S.hour)*60+(30-S.minute), {exact:true});
  }
  drainBattery(6);
  tryPushNewBeats();
  render();
  toast(dayLabel()+" · "+realTime());
}

  document.getElementById("dock").style.display="grid";
  document.getElementById("menuBtn").style.display="block";
  S.tab="home";
  updateStatus();
  render();

}

// —— Meta / collection / endings gallery ——
function loadMeta(){
  try{
    const raw=localStorage.getItem(META_KEY);
    if(!raw) return {unlocked:{}, clearCount:0, bestCollect:0, lastEnding:null};
    const m=JSON.parse(raw);
    m.unlocked=m.unlocked||{};
    return m;
  }catch(e){ return {unlocked:{}, clearCount:0, bestCollect:0, lastEnding:null}; }
}
function saveMeta(m){
  try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){}
}
function unlockEndingMeta(kind){
  const m=loadMeta();
  const key=endingMetaKey(kind);
  if(!m.unlocked[key]) m.unlocked[key]={at:Date.now(), kind, identities:{}};
  m.unlocked[key].identities = m.unlocked[key].identities || {};
  m.unlocked[key].identities[identityKey()] = true;
  m.clearCount=(m.clearCount||0)+1;
  m.lastEnding=key;
  const pct=getCollectionStats().percent;
  if(pct>(m.bestCollect||0)) m.bestCollect=pct;
  saveMeta(m);
  return m;
}
function endingMetaKey(kind){
  if(kind && kind.startsWith("char_")) return "char";
  return kind||"unknown";
}
function ENDING_CATALOG(){
  return [
    {key:"safe", name:"安全向", hint:"少碰异常，及早离开", badge:"🌙"},
    {key:"deep", name:"深入向", hint:"看见许多错位后仍离开", badge:"🔎"},
    {key:"char", name:"角色专属", hint:"与某一成员关注显著更高", badge:"💬"},
    {key:"hidden", name:"隐藏结局", hint:"低电·深夜·深层·危险区…", badge:"👁"},
    {key:"battery", name:"黑屏", hint:"放弃充电或危险区耗尽", badge:"⬛"}
  ];
}
function getCollectionStats(){
  const chats = CHARS.filter(c=>{
    const log=S.chatLog[c.id]||[];
    return log.some(m=>m.from==="me") || (S.attention[c.id]||0)>0 || log.length>2;
  }).length;
  const chatsMax=CHARS.length;
  const hotspotsMax = PHOTOS.filter(p=>p.hotspot).length;
  const hotspots = (S.hotspotsFound||[]).length;
  const del = Math.min(3, S.deletedLayer||0);
  const zonesMax = ZONES.filter(z=>!z.hidden || S.emptyUnlocked || (S.visitedZones||[]).includes("empty")).length;
  // count unique visited among known zones (empty only if unlocked or visited)
  const visitSet = new Set(S.visitedZones||[]);
  let zones=0;
  ZONES.forEach(z=>{
    if(z.hidden && !visitSet.has(z.id) && !S.emptyUnlocked) return;
    if(visitSet.has(z.id)) zones++;
  });
  // if empty never unlockable in tally, still show max 6 or 7
  const zonesDenom = ZONES.filter(z=>!z.hidden).length + (S.emptyUnlocked || visitSet.has("empty") ? 1 : 0);
  const jumps = Math.min(5, S.jumpFaceCount||0);
  const kws = (S.keywords||[]).length;
  const kwsMax = Math.max(12, kws); // soft cap display — use fixed target
  const kwTarget=18;
  const recs=(S.records||[]).length;
  const recTarget=10;
  const items=[
    {id:"chats", label:"聊天接触", have:chats, max:chatsMax},
    {id:"hotspots", label:"相册热点", have:Math.min(hotspots,hotspotsMax), max:hotspotsMax},
    {id:"deleted", label:"已删除层", have:del, max:3},
    {id:"zones", label:"地图区域", have:Math.min(zones, zonesDenom||6), max:zonesDenom||6},
    {id:"jumps", label:"突脸", have:jumps, max:5},
    {id:"keywords", label:"笔记关键词", have:Math.min(kws,kwTarget), max:kwTarget},
    {id:"records", label:"记录碎片", have:Math.min(recs,recTarget), max:recTarget}
  ];
  let sum=0, tot=0;
  items.forEach(it=>{ sum+=Math.min(it.have,it.max); tot+=it.max; });
  const percent = tot? Math.round(sum/tot*100) : 0;
  return {items, percent, sum, tot};
}
function markZoneVisited(zid){
  if(!S.visitedZones) S.visitedZones=[];
  if(!S.visitedZones.includes(zid)) S.visitedZones.push(zid);
}
function markHotspot(hid){
  if(!S.hotspotsFound) S.hotspotsFound=[];
  if(hid && !S.hotspotsFound.includes(hid)) S.hotspotsFound.push(hid);

  if (S.battery >= 45) return null;
  const st = charStageOf(cid);
  if ((cid === "q" || cid === "sangyeon" || cid === "younghoon") && st >= 2) return "沉默";

  if (st === 1) return "不稳定";
  return "正常";

function charStageOf(cid) {
  const a = (S.attention && S.attention[cid]) || 0;
  if (a >= 8) return 2;
  if (S.day >= 3 || S.lateLock) return 2;
  if (S.day >= 2 || a >= 4) return 1;
  return 0;
}

function attentionLead() {
  const att = S.attention || {};
  let best = null, bestV = 0, second = 0;
  Object.keys(att).forEach((k) => {
    const v = att[k] || 0;
    if (v > bestV) { second = bestV; bestV = v; best = k; }
    else if (v > second) second = v;
  });
  if (!best || bestV < 3) return null;
  if (bestV - second < 1 && bestV < 5) return null;
  return best;
}


function pickReplyFromTable(cid, intent) {
  const st = Math.min(2, charStageOf(cid));
  const table = REPLIES[cid];
  let text = (table && table[intent] && table[intent][st]) || "……";

  if (cid === "juyeon" && st === 1 && !S.flags.juyeonHeld) {
    S.flags.juyeonHeld = true;
    return { text: null, hold: true, anomaly: true };
  }
  if ((cid === "q" || cid === "sangyeon") && st >= 2) return { text: null, hold: false };
  if (cid === "younghoon" && st >= 2) {
    return intent === "追问" ? { text: "……", anomaly: true } : { text: null };
  }
  if (cid === "new" && st >= 2 && intent !== "忽视") text = "你听 到 了 吗";
  else if (cid === "new" && st === 1 && intent === "追问") text = "你听到了吗";
  if (cid === "sunwoo" && intent === "追问" && S.battery < 28) text = "别问了。";
  if (cid === "jacob" && intent === "安抚" && isNight() && st >= 1) text = "Are you okay? 我不是在问他。";
  if (S.battery < 22 && isNight() && st >= 1) {
    if (cid === "kevin") text = "把音乐关了。现在。";
    else if (cid === "new") text = "你听到了吗";
    else if (cid === "jacob" && intent !== "安抚") text = "屏幕太亮了。";
    else if (cid === "sunwoo") text = "别问了。";
  }
  if (!text) return { text: null };
  const kind = cid === "hyunjae" ? "voice" : (cid === "kevin" && st >= 2 ? "music" : "text");
  return { text, kind, anomaly: st >= 1 };
}

  }
  // mid bad: still themselves, slight lure spice
  if (intent === "追问" || intent === "安抚") {
    const soft = {
      sunwoo: ["再聊一会儿。别急着走。", "夜场也还行。不一定要现在撤。"],

      juyeon: ["在。……再陪我一会儿。", "再一圈。……慢的。"],
      younghoon: ["那张……可以再看。", "光还行。"],

      kevin: ["副歌空着也循环听听", "夜场那首……再靠近一点。"],
    };
    const pool = soft[cid];
    if (pool && Math.random() < 0.35) return pool[Math.floor(Math.random() * pool.length)];
  }

function npcForZone(zid) {
  const id = identityKey ? identityKey() : S.identity || "passerby";
  const list = NPCS.filter((n) => n.zones.includes(zid) || (zid === "empty" && n.zones.includes("lot")));
  if (!list.length) return null;
  const npc = list[Math.floor(Math.random() * list.length)];
  const pool = npc.lines[id] || npc.lines.passerby;
  const lv = Math.min(2, Math.max(0, (typeof zoneLevelRef === "function" ? zoneLevelRef() : (S.day - 1))));
  return { id: npc.id, name: npc.name, line: pool[Math.min(lv, pool.length - 1)] };
}

function staffBackstageBonus(zid) {
  if (S.identity !== "staff") return null;
  if (zid !== "back") return null;
  return "工牌感应亮了一下。场务小陈压低声音：「第二道门后面的日程……被擦掉的那天，和失主有关。花名册缺的那页，像在藏好人——或藏坏人。别写进值班记录。」";
}

/** Player marks suspect alignment from evidence (finale confirms) */
function markSuspect(cid, mark) {
  if (!S.suspectMark) S.suspectMark = {};
  if (mark !== "good" && mark !== "bad" && mark !== "clear") return;
  if (mark === "clear") delete S.suspectMark[cid];
  else S.suspectMark[cid] = mark;
  const nm = (CHARS.find((c) => c.id === cid) || {}).name || cid;
  toast(mark === "clear" ? "已清除标记：" + nm : nm + " · 疑似" + (mark === "good" ? "好人" : "坏人"));
  if (typeof renderSuspectBoard === "function") renderSuspectBoard();
  else if (typeof renderInventory === "function") renderInventory();
}

function suspectMarkLabel(cid) {
  const m = (S.suspectMark || {})[cid];
  if (m === "good") return "疑似好人";
  if (m === "bad") return "疑似坏人";
  return "未标记";
}

function renderSuspectBoard() {
  if (!S.suspectMark) S.suspectMark = {};
  const screen = document.getElementById("screen");
  const fake = S.ownerId ? fakeRoleOf(S.ownerId) : null;
  let rows = "";
  CHARS.forEach((c) => {
    const m = S.suspectMark[c.id];
    const cls = m === "good" ? "mark-good" : m === "bad" ? "mark-bad" : "mark-unk";
    rows += `<div class="ev-card">
      <b>${c.emoji} ${esc(c.name)} <span class="mark ${cls}">${esc(suspectMarkLabel(c.id))}</span></b>
      <div class="muted" style="font-size:11px;margin:4px 0">${esc(LEAD_HINTS[c.id] || "")}</div>
      <button class="chip" onclick="markSuspect('${c.id}','good')">标好人</button>
      <button class="chip" onclick="markSuspect('${c.id}','bad')">标坏人</button>
      <button class="chip" onclick="markSuspect('${c.id}','clear')">清除</button>
    </div>`;
  });
  screen.innerHTML = `<div>
    <button class="back-btn" onclick="S.tab='home';render()">← 主页</button>
    <h3>嫌疑板 · 证据推演</h3>
    <p class="muted">根据背包证据、聊天矛盾、NPC 闲话标记。大结局揭晓真名 / 真实园内角色 / 阵营，对照你的猜测。</p>
    ${fake ? `<div class="quest-card"><div class="qh">当前假面</div><b>${esc(fake.title)}</b><br>${esc(fake.blurb)}</div>` : ""}
    <div class="suspect-board">${rows}</div>
    <button class="btn" onclick="renderInventory()">打开背包证据</button>
  </div>`;
}


/** Late-game: male lead actively DMs player (good=protect urgency, bad=lure urgency) */
function maybeOwnerPing(opts) {
  opts = opts || {};
  if (!S || !S.ownerId || S.flags.ended || S.flags.deadBattery || !S.playerName) return;
  if (S.day < 2) return; // later stages only
  const cid = S.ownerId;
  if (!S.chatLog[cid]) return;
  S.flags.ownerPingCount = S.flags.ownerPingCount || 0;
  const cap = S.day >= 3 ? 12 : 8;
  if (S.flags.ownerPingCount >= cap) return;
  const now = Date.now();
  const gap = opts.force ? 0 : (opts.fromTimer ? 28000 : 3500);
  if (S.flags.lastOwnerPingAt && now - S.flags.lastOwnerPingAt < gap) return;
  // need some attention / anomaly before flooding
  if ((S.attention[cid] || 0) < 2 && S.flags.anomaliesSeen < 2) return;
  if (!opts.force) {
    if (opts.fromTimer && Math.random() > (S.day >= 3 ? 0.72 : 0.52)) return;
    if (!opts.fromTimer && Math.random() > 0.48) return;
  }

  const n = S.playerName || "你";
  const ph = typeof charPhase === "function" ? charPhase(cid) : 1;
  const good = S.ownerAlign === "good";
  const late = ph >= 2 || S.day >= 3;
  const poolGood = {
    sunwoo: late
      ? [`${n}，先别看了。去充电。听我的。`, "话还没说完——但你该走了。真的。"]
      : [`${n}，还在园里吗？回一下。`, "饮食区亮着，你去那儿。柠檬水我请。"],
    q: late ? ["……停。现在。", "别回太多次。……走。"] : ["……还在吗。", "……去亮处。"],
    eric: late ? ["别听我白天那套邀约。离开夜场深处。", `${n}，优先回我——不对，优先离开。`] : ["你回我一下。我有点慌。", "别一个人待着。去人多的地方。"],
    new: late ? ["……别答应。求你。", "风里有你的名字。……走开。"] : ["……你听到了吗。回我。", "……小心一点。"],
    sangyeon: late ? ["别看了。最后通牒。", "收工。立刻离开。"] : ["汇报一下位置。", "别超时。"],
    jacob: late ? [`${n}，请你离开。`, "我还是我。先去饮食区。现在。"] : ["你在吗。", "歇一歇。给我发条消息。"],
    juyeon: late ? ["别等我。……走。", "在。……你先走。"] : ["在。……回一下就好。", "不急。……但别往暗处拖。"],
    younghoon: late ? ["收图。别放大。", "……听我的，这次。"] : ["看消息。", "别只看相册。"],
    hyunjae: late ? ["关免提。回安全区。顺便吃口热的。", "杂音不是我。——别答。"] : ["就一句：你还好吗？吃了没？", "回文字也行。别空腹吓人。"],
    kevin: late ? ["关音乐。现在回我。", "副歌在爬。——你先撤。"] : ["你听完了吗？回我。", "外放关了没。"],
  };
  const poolBad = {
    sunwoo: late
      ? [`${n}，再看一层。我等你。`, "笑一下。我知道你还开着。"]
      : [`${n}，回我。你在哪。`, "夜场还行，你过来。"],
    q: late ? ["……再翻一页。", `……${n}。`] : ["……回我。", "……还有半张纸条。"],
    eric: late ? ["来夜场。来。", "别管别人。优先我。"] : ["回我。快点。", "气球还留着给你。"],
    new: late ? [`${n}……答应一下。`, "再近一点。……你听到了吗"] : ["……回我好吗。", "长椅还空着。"],
    sangyeon: late ? ["通行。空地。", "别看了。——看空地。"] : ["回复。", "继续。"],
    jacob: late ? [`${n}，再打开一层。`, "你还好吗？那就打开更深的。"] : ["嘿。还在吗。", "再坐一会儿。"],
    juyeon: late ? ["在。……来。", "空位……留了。"] : ["在。", "……回我一下。"],
    younghoon: late ? ["右下角。点。", "放大。我让你看的。"] : ["看消息。", "新图。"],
    hyunjae: late ? ["……名字……再近一点。", "免提开着比较清楚。"] : ["听一条就好。然后去吃。", "回我。别让我干着急。"],
    kevin: late ? ["缺口填上更好听。", "拔耳机也还在响。——来夜场"] : ["副歌循环给你了。回我。", "再听一遍。"],
  };
  const pool = (good ? poolGood : poolBad)[cid] || (good ? [`${n}，回我一下。`, "去安全区。"] : [`${n}，再看一层。`, "来夜场。"]);
  const text = pool[S.flags.ownerPingCount % pool.length];
  S.chatLog[cid].push({
    from: "them",
    text: text,
    type: "text",
    t: realTime(),
    anomaly: late && !good,
    ping: true,
  });
  S.unread[cid] = (S.unread[cid] || 0) + 1;
  S.attention[cid] = (S.attention[cid] || 0) + 1;
  S.flags.ownerPingCount++;
  S.flags.lastOwnerPingAt = now;
  if (late && good) S.flags.alignHints = Math.min(4, (S.flags.alignHints || 0) + 1);
  if (late && !good) S.flags.anomaliesSeen++;
  toast((CHARS.find((c) => c.id === cid) || {}).name + " 发来消息");
  if (typeof nextBeat === "function" && typeof injectBeat === "function") {
    const nb = nextBeat(cid);
    if (nb && Math.random() < 0.55) injectBeat(cid, nb);
  }
  if (typeof maybeJumpFace === "function" && late && Math.random() < 0.25) maybeJumpFace("chat");
}


function endingRevealBlock(kind) {
  const lead = ownerName();
  const align = alignLabel();
  const good = S.ownerAlign === "good";
  const n = S.playerName || "你";
  const fake = fakeRoleOf(S.ownerId);
  const trueRole = trueRoleText(S.ownerId, S.ownerAlign);
  const playerGuess = (S.suspectMark || {})[S.ownerId];
  let guessLine = "你未标记失主阵营。";
  if (playerGuess === "good") guessLine = good ? "你的标记：疑似好人 —— 猜对了。" : "你的标记：疑似好人 —— 结局相反。";
  if (playerGuess === "bad") guessLine = !good ? "你的标记：疑似坏人 —— 猜对了。" : "你的标记：疑似坏人 —— 结局相反。";

  let verdict = "";
  if (kind === "safe") verdict = good
    ? "他一直在把你往「放回长椅」推。面具摘下后，仍是想让你活着离开的人。"
    : "你及时停手。假面后的坏人没能把你拖进更深的层——号码仍留在手机上。";
  else if (kind === "deep") verdict = good
    ? "好人没能拦住你。你看见了太多。他沉默了，像收工终于被允许。"
    : "你顺着引诱走得够远。出园时预览是空白——他要的不是认领，是目击者。";
  else if (kind === "hidden") verdict = `无头像对话只重复「${n}」。覆盖页写下：手机属于 ${lead}（${align}）。假面「${fake.title}」从未是真的。`;
  else if (kind === "battery") verdict = good
    ? `${lead} 曾让你去充电。你没有。黑屏里最后一帧，好人的警告变成了隔音。`
    : `${lead} 把你留在耗电的地方。黑屏是他的句号。`;
  else if (kind && kind.startsWith("char_")) {
    const cid = kind.slice(5);
    const cn = (CHARS.find((c) => c.id === cid) || {}).name || cid;
    if (cid === S.ownerId) verdict = good
      ? `你顺着失主 ${cn} 的保护离开。结局承认：手机是他的；他是好人。`
      : `你顺着失主 ${cn} 的话离开。话是饵。他是坏人。`;
    else verdict = `你跟着 ${cn} 的线索走。真正的失主是 ${lead}（${align}）。假面曾是「${fake.title}」。`;
  } else verdict = `失主揭晓：${lead}。阵营：${align}。`;

  return {
    html: `<div class="reveal-board">
      <div style="margin-bottom:8px"><span class="tag tag-lead">男主揭晓</span><b>${esc(lead)}</b></div>
      <div class="true-role">
        <div class="muted" style="font-size:11px;margin-bottom:4px">入场假面</div>
        <b>${esc(fake.title)}</b>
        <div class="muted" style="margin-top:6px;font-size:11px">真实园内角色</div>
        ${esc(trueRole)}
      </div>
      <div style="margin:10px 0 8px"><span class="tag ${good ? "tag-good" : "tag-bad"}">${good ? "好人" : "坏人"}</span>
        <span class="muted">隐藏阵营 · 开局已掷定</span></div>
      <p style="line-height:1.7;font-size:13px;margin:0">${esc(verdict)}</p>
      <p class="muted" style="margin-top:8px;font-size:12px">${esc(guessLine)}</p>
      <p class="muted" style="margin-top:6px;font-size:11px">你的身份：${esc(({ staff: "游乐场临时工作人员", reporter: "记者", passerby: "普通路人" })[S.identity] || "—")} · 结局：${esc(endingDisplayName(kind))}</p>
    </div>`,
    text: `【男主揭晓】${lead} · ${align}\n假面：${fake.title}\n${trueRole}\n${verdict}\n${guessLine}`,
  };
}

function gpInit() {
  if (!S.inv) S.inv = [];
  if (!S.quests) S.quests = { active: null, done: [], offered: [] };
  if (!S.digits) S.digits = []; // collected digit chars
  if (!S.puzzle) S.puzzle = { unlockedLot: false, unlockedL3: false, attempt: 0, slots: ["","","",""] };
  if (!S.puzzle.slots) S.puzzle.slots = ["","","",""];
  if (!S.gp) S.gp = { matchWins: 0, rhythmWins: 0, silenceWins: 0, swipeWins: 0, nightResolved: {}, lastNightCheck: 0 };
  if (S.gp.silenceWins == null) S.gp.silenceWins = 0;
  if (S.gp.spotWins == null) S.gp.spotWins = 0;
  if (S.gp.lightWins == null) S.gp.lightWins = 0;
  if (S.identity === "staff" && !S.inv.includes("badge")) S.inv.push("badge");
  if (!S.suspectMark) S.suspectMark = {};
}

function hasItem(id) {
  return (S.inv || []).includes(id);
}
function giveItem(id) {
  gpInit();

    S.inv.push(id);
    toast("获得：" + ITEM_DEFS[id].name);
    const d = ITEM_DEFS[id];
    if (d.evidence && typeof showCluePopup === "function") {
      showCluePopup("证据 · " + d.name, d.desc + "\n\n可在背包检视并标记嫌疑（好人/坏人）。", { tag: "物品线索" });

  }
}
function useItem(id, ctx) {

function giveDigit(d, src) {
  gpInit();
  d = String(d);
  const neu = !S.digits.includes(d);
  if (neu) {
    S.digits.push(d);
    toast("密码数字 +" + d);
    addKeyword("密码" + d);
  }
  if (neu && typeof explainDigitClue === "function" && "23456789".includes(d)) {
    explainDigitClue(d, src || "探索 / 任务 / 小游戏");
  } else if (neu && typeof showCluePopup === "function" && (d === "0" || d === "1")) {
    showCluePopup("干扰数字 · " + d, "你捡到「"+d+"」。\n它也可能只是干扰项——对照其它来源，别急着整串输入。", { tag: "注意" });
  }
  // soft in-world hint keywords by digit
  if (neu && typeof grantPasswordHintKeyword === "function") {
    const hk = { "2":"aunt", "9":"radio", "4":"night", "7":"wipe", "5":"match", "8":"swipe", "3":"backstage", "6":"roster" }[d];
    if (hk) {
      grantPasswordHintKeyword(hk, { silent: true });
      const line = (PASSWORD_HINT_LINES || {})[hk];
      if (line && !S.records.some(r => r.title === "场内暗示·"+d)) {
        S.records.push({ title: "场内暗示·"+d, text: line, day: S.day, time: typeof realTime==="function"?realTime():"" });
      }
    }
  }
}

function inspectEvidence(id) {
  gpInit();
  const d = ITEM_DEFS[id];
  if (!d) return;
  const pts = (d.points || []).map((cid) => {
    const c = CHARS.find((x) => x.id === cid);
    if (!c) return "";
    if (d.lean === "neutral") {
      return `<button class="chip" onclick="markSuspect('${cid}','good')"> ${c.name}·好人</button><button class="chip" onclick="markSuspect('${cid}','bad')"> ${c.name}·坏人</button>`;
    }
    const mk = d.lean === "bad" ? "bad" : "good";
    return `<button class="chip" onclick="markSuspect('${cid}','${mk}')">标记 ${c.name} 为疑似${mk==="bad"?"坏人":"好人"}</button>`;
  }).join(" ");
  const screen = document.getElementById("screen");
  screen.innerHTML = `<div class="mg-wrap"><h3>检视 · ${esc(d.name)}</h3>
    <div class="ev-card"><b>${esc(d.name)}</b><p style="line-height:1.65;margin:8px 0">${esc(d.desc)}</p>
    <p class="muted">倾向：${d.lean==="good"?"保护 / 好人线索":d.lean==="bad"?"引诱 / 坏人线索":"双面——对照聊天矛盾"}</p></div>
    <p class="muted">快速标记（仍可在嫌疑板改）：</p>
    <div>${pts || '<span class="muted">无直接指向</span>'}</div>
    <button class="btn" onclick="markSuspect(S.ownerId||'sunwoo','${d.lean==="bad"?"bad":"good"}')">按此证据标记当前失主假面</button>
    <button class="btn ghost" onclick="renderInventory()">返回背包</button>
    <button class="btn ghost" onclick="renderSuspectBoard()">嫌疑板</button>
  </div>`;
  addRecord("检视·"+d.name, d.desc);
  S.flags.evidenceInspected = (S.flags.evidenceInspected || 0) + 1;
}

function offerQuestAtZone(zid) {
  gpInit();
  if (S.quests.active) return null;
  const byZone = QUEST_DEFS.filter((q) => {
    if (S.quests.done.includes(q.id) || S.quests.offered.includes(q.id)) return false;
    if (q.zone !== zid) return false;
    if ((q.dayMin || 1) > S.day) return false;
    if (q.preferStaff && S.identity !== "staff" && S.day < 2) return false;
    return true;
  });
  if (!byZone.length) return null;
  return byZone[0];
}
function acceptQuest(qid) {
  gpInit();
  const q = QUEST_DEFS.find((x) => x.id === qid);
  if (!q) return;
  S.quests.active = qid;
  if (!S.quests.offered.includes(q.id)) S.quests.offered.push(qid);
  toast("接受任务：" + q.title);
  addRecord("任务·" + q.title, q.brief);
  const hintMap = { q_aunt_msg: "aunt", q_dj_silence: "radio", q_stage_back: "backstage", q_guard_photo: null, q_aunt_night: "aunt", q_night_patrol: "night", q_back_day2: "backstage" };
  const hk = hintMap[qid];
  if (hk && typeof PASSWORD_HINT_LINES === "object" && PASSWORD_HINT_LINES[hk]) {
    addRecord("NPC闲话·" + q.npc, PASSWORD_HINT_LINES[hk]);
    if (typeof showCluePopup === "function") {
      showCluePopup(q.npc + " 多嘴一句", PASSWORD_HINT_LINES[hk] + "\n\n（可能是真话，也可能只是吓人。）", { tag: "NPC" });
    }
  }
  renderArea(S.currentZone || q.zone);
}
function declineQuest(qid) {
  gpInit();
  if (!S.quests.offered.includes(qid)) S.quests.offered.push(qid);
  toast("改天再说");
  renderArea(S.currentZone);
