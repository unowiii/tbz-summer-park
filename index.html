function getCollectionStats(){
  const chats = CHARS.filter(c=>{
    const log=S.chatLog[c.id]||[];
    return log.some(m=>m.from==="me") || (S.attention[c.id]||0)>0 || log.length>2;
  }).length;
  const chatsMax=CHARS.length;
  const hotspotsMax = PHOTOS.filter(p=>p.hotspot).length;
  const hotspots = (S.hotspotsFound||[]).length;
  const del = Math.min(3, S.deletedLayer||0);
  const zonesMax = ZONES.filter(z=>!z.hidden || S.emptyUnlocked || (S.visitedZones||[]).includes("empty")).length;
  // count unique visited among known zones (empty only if unlocked or visited)
  const visitSet = new Set(S.visitedZones||[]);
  let zones=0;
  ZONES.forEach(z=>{
    if(z.hidden && !visitSet.has(z.id) && !S.emptyUnlocked) return;
    if(visitSet.has(z.id)) zones++;
  });
  // if empty never unlockable in tally, still show max 6 or 7
  const zonesDenom = ZONES.filter(z=>!z.hidden).length + (S.emptyUnlocked || visitSet.has("empty") ? 1 : 0);
  const jumps = Math.min(jumpCap(), S.jumpFaceCount||0);
  const kws = (S.keywords||[]).length;
  const kwsMax = Math.max(12, kws); // soft cap display — use fixed target
  const kwTarget=18;
  const recs=(S.records||[]).length;
  const recTarget=10;
  const items=[
    {id:"chats", label:"聊天接触", have:chats, max:chatsMax},
    {id:"hotspots", label:"相册热点", have:Math.min(hotspots,hotspotsMax), max:hotspotsMax},
    {id:"deleted", label:"已删除层", have:del, max:3},
    {id:"zones", label:"地图区域", have:Math.min(zones, zonesDenom||6), max:zonesDenom||6},
    {id:"jumps", label:"突脸", have:jumps, max:5},
    {id:"keywords", label:"笔记关键词", have:Math.min(kws,kwTarget), max:kwTarget},
    {id:"records", label:"记录碎片", have:Math.min(recs,recTarget), max:recTarget}
  ];
  let sum=0, tot=0;
  items.forEach(it=>{ sum+=Math.min(it.have,it.max); tot+=it.max; });
  const percent = tot? Math.round(sum/tot*100) : 0;
  return {items, percent, sum, tot};
}

function zoneLevelRef() {
  if (S.day >= 3 || (isDeepNight() && S.battery < 40) || S.anomaly >= 6) return 2;
  if (S.day >= 2 || isNight() || S.anomaly >= 3) return 1;
  return 0;
}

/* 地图整体就是一个圆：十个区域绕一圈，走满一圈回到同一个点 */
function carouselRingHtml(){
  const list=ZONES.filter(function(z){ return !(z.hidden && !S.emptyUnlocked); });
  const n=list.length, R=101, cx=150, cy=152;
  let dots="";
  list.forEach(function(z,i){
    const a=(-90 + i*360/n)*Math.PI/180;
    const x=(cx+R*Math.cos(a)).toFixed(1), y=(cy+R*Math.sin(a)).toFixed(1);
    const here=S.currentZone===z.id, car=z.id==="carousel";
    dots+='<circle cx="'+x+'" cy="'+y+'" r="'+(here?6.5:3.6)+'" fill="'+(here?'#c9955c':(car?'#a5342a':'rgba(255,255,255,.25)'))+'"/>';
    if(here) dots+='<circle cx="'+x+'" cy="'+y+'" r="11" fill="none" stroke="#c9955c" stroke-width="1" opacity=".55"/>';
    if(car) dots+='<circle cx="'+x+'" cy="'+y+'" r="15" fill="none" stroke="rgba(165,52,42,.5)" stroke-width="1" stroke-dasharray="2 3"/>';
  });
  const laps=1+Math.floor((S.flags.travelCount||0)/Math.max(1,n));
  return '<div style="margin:8px 0 12px;background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:6px 10px 0">'
    + '<svg viewBox="0 0 300 300" style="width:100%;height:auto;display:block">'
    + '<circle cx="150" cy="152" r="101" fill="none" stroke="rgba(255,255,255,.10)" stroke-dasharray="3 6"/>'
    + '<g style="animation:carOrbit 24s linear infinite;transform-origin:150px 152px">'
    + '<circle cx="150" cy="51" r="2" fill="rgba(201,149,92,.55)"/></g>'
    + dots
    + '<text x="150" y="146" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.30)" letter-spacing="3">轨 道</text>'
    + '<text x="150" y="167" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.24)">第 '+laps+' 圈</text>'
    + '</svg>'
    + '<p class="muted" style="margin:0 0 8px;font-size:11.5px;line-height:1.7">十个区域绕成一圈。你每走一次，点往前挪一格——走满一圈，回到同一个点。</p></div>';
}
/* 木马区页：这一圈走到第几格 */
function carouselRingBadge(){
  const p=Math.max(1, Math.min(8, (S.flags.carouselPass||1)));
  let dots="";
  for(let i=0;i<8;i++){
    const a=(-90+i*45)*Math.PI/180;
    const x=(60+42*Math.cos(a)).toFixed(1), y=(60+42*Math.sin(a)).toFixed(1);
    const on=i<p;
    dots+='<circle cx="'+x+'" cy="'+y+'" r="'+(on?4:2.4)+'" fill="'+(on?'#c9955c':'rgba(255,255,255,.16)')+'"/>';
  }
  return '<div style="display:flex;align-items:center;gap:12px;margin:0 0 10px;background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:8px 12px">'

  if ((cid === "q" || cid === "sangyeon" || cid === "younghoon") && st >= 2) return "沉默";
  if (cid === "juyeon" && st === 1) return "沉默";
  if (st >= 2) return "异常";
  if (st === 1) return "不稳定";
  return "正常";
}

function charStageOf(cid) {
  const a = (S.attention && S.attention[cid]) || 0;
  if (a >= 8) return 2;
  if (S.day >= 3 || S.lateLock) return 2;
  if (S.day >= 2 || a >= 4) return 1;
  return 0;
}

function attentionLead() {
  const att = S.attention || {};
  let best = null, bestV = 0, second = 0;
  Object.keys(att).forEach((k) => {
    const v = att[k] || 0;
    if (v > bestV) { second = bestV; bestV = v; best = k; }
    else if (v > second) second = v;
  });
  if (!best || bestV < 3) return null;
  if (bestV - second < 1 && bestV < 5) return null;
  return best;
}


function pickReplyFromTable(cid, intent) {
  const st = Math.min(2, charStageOf(cid));
  const table = REPLIES[cid];
  let text = (table && table[intent] && table[intent][st]) || "……";
  // Juyeon mid-stage hold (once)
  if (cid === "juyeon" && st === 1 && !S.flags.juyeonHeld) {
    S.flags.juyeonHeld = true;
    return { text: null, hold: true, anomaly: true };
  }
  if ((cid === "q" || cid === "sangyeon") && st >= 2) return { text: null, hold: false };
  if (cid === "younghoon" && st >= 2) {
    return intent === "追问" ? { text: "……", anomaly: true } : { text: null };
  }
  if (cid === "new" && st >= 2 && intent !== "忽视") text = "你听 到 了 吗";
  else if (cid === "new" && st === 1 && intent === "追问") text = "你听到了吗";
  if (cid === "sunwoo" && intent === "追问" && S.battery < 28) text = "别问了。";
  if (cid === "jacob" && intent === "安抚" && isNight() && st >= 1) text = "Are you okay? 我不是在问他。";
  if (S.battery < 22 && isNight() && st >= 1) {
    if (cid === "kevin") text = "把音乐关了。现在。";
    else if (cid === "new") text = "你听到了吗";
    else if (cid === "jacob" && intent !== "安抚") text = "屏幕太亮了。";
    else if (cid === "sunwoo") text = "别问了。";
  }
  if (!text) return { text: null };
  const kind = cid === "hyunjae" ? "voice" : (cid === "kevin" && st >= 2 ? "music" : "text");
  return { text, kind, anomaly: st >= 1 };
}

/* —— 失主轮值（v0.9）——
   旧毛病有两处：失主是纯随机 1/10，连开几轮极容易撞同一个人；
   而 leanBad 从 0.28（Sangyeon）到 0.62（Eric）不等，想凑齐同一个人的两条线几乎只能靠运气。
   现在：失主按「当过次数最少」优先并跳过上一轮那位；阵营在两面凑齐前先补缺的那一边。 */
function leadHistoryOf(id){
  try{
    const m=loadMeta(); const h=(m.leads||{})[id];
    return { n:(h&&h.n)||0, good:(h&&h.good)||0, bad:(h&&h.bad)||0 };
  }catch(e){ return {n:0,good:0,bad:0}; }
}
function recordLeadRun(leadId, align){
  try{
    const m=loadMeta();
    m.leads=m.leads||{};
    const e=m.leads[leadId]||{n:0,good:0,bad:0,last:0};
    e.n=(e.n||0)+1;
    if(align==="bad") e.bad=(e.bad||0)+1; else e.good=(e.good||0)+1;
    e.last=Date.now();
    m.leads[leadId]=e; m.lastLead=leadId;
    saveMeta(m);
  }catch(e){}
}
function pickLeadId(seedAvoid){
  const ids=(typeof CHARS!=="undefined")?CHARS.map(function(c){ return c.id; }):[];
  if(!ids.length) return "";
  let last="";
  try{ last=loadMeta().lastLead||""; }catch(e){}
  const times={}; let min=Infinity;
  ids.forEach(function(id){
    times[id]=(leadHistoryOf(id).n)||0;
    if(times[id]<min) min=times[id];
  });
  let pool=ids.filter(function(id){ return times[id]===min; });
  const avoid=seedAvoid||last;
  /* 第二轮往后：在同样候选里优先挑「还有一面没见过」的人，别把轮次浪费在已经两面齐全的人身上 */
  const lacking=pool.filter(function(id){
    const h=leadHistoryOf(id);
    return h.n>0 && (h.good===0 || h.bad===0);
  });
  if(lacking.length && lacking.length<pool.length) pool=lacking;
  if(pool.length>1 && avoid){
    const rest=pool.filter(function(id){ return id!==avoid; });
    if(rest.length) pool=rest;
  }
  return pool[Math.floor(Math.random()*pool.length)];
}
function rollOwnerAlign(leadId) {
  const leanBad = { eric: 0.62, kevin: 0.58, new: 0.55, sunwoo: 0.48, hyunjae: 0.5, juyeon: 0.45, younghoon: 0.52, q: 0.35, sangyeon: 0.28, jacob: 0.32 };
  let p = leanBad[leadId] != null ? leanBad[leadId] : 0.45;
  /* 阵营补位：同一个人「往里带」与「劝你走」两面都见过之前，先把缺的那一边补上，
     免得玩家为了某一条线反复重开。两面齐了之后，回到他原本的性格概率。 */
  const h = leadHistoryOf(leadId);
  if(h.good + h.bad > 0){
    if(h.good === 0) p = 0.12;      // 还没见过他「劝你走」→ 先把这条线补上
    else if(h.bad === 0) p = 0.88;  // 还没见过他「往里带」→ 先把这条线补上
  }
  return Math.random() < p ? "bad" : "good";
}

/** Player marks suspect alignment from evidence (finale confirms) */
function markSuspect(cid, mark) {
  if (!S.suspectMark) S.suspectMark = {};
  if (mark !== "good" && mark !== "bad" && mark !== "clear") return;
  if (mark === "clear") delete S.suspectMark[cid];
  else S.suspectMark[cid] = mark;
  // 标成坏人：他会察觉（下次打开他的聊天时触发对质）
  if (mark === "bad") {
    if (!S.flags.accused) S.flags.accused = {};
    S.flags.accused[cid] = absMin();
    try{ triSuspect(cid,3); }catch(e){}
    if (S.flags.confrontDone) delete S.flags.confrontDone[cid];
  } else if (mark === "clear" && S.flags.accused) {
    delete S.flags.accused[cid];
  }
  const nm = (CHARS.find((c) => c.id === cid) || {}).name || cid;
  toast(mark === "clear" ? "已清除标记：" + nm : nm + " · 疑似" + (mark === "good" ? "好人" : "坏人"));
  if (typeof renderSuspectBoard === "function") renderSuspectBoard();
  else if (typeof renderInventory === "function") renderInventory();
}

function suspectMarkLabel(cid) {
  const m = (S.suspectMark || {})[cid];

}

/* —— 数值面板：明写数字 —— */
function triLeadNow(){
  const t=triGet();
  let best=null,bestScore=-1;
  CHARS.forEach(function(c){
    const su=t.sus[c.id]||0, ad=t.adm[c.id]||0;
    const sc=(su+ad)+(su>0&&ad>0?Math.min(su,ad)*1.5:0);
    if(sc>bestScore){bestScore=sc;best=c.id;}
  });
  return best;
}
function triRowsData(){
  const t=triGet();
  const arr=CHARS.map(function(c){
    return {id:c.id, name:c.name, emoji:c.emoji, color:c.color,
      sus:t.sus[c.id]||0, adm:t.adm[c.id]||0,
      notes:(t.seenTells&&t.seenTells[c.id]?t.seenTells[c.id].length:0)};
  }).filter(function(x){ return x.sus>0||x.adm>0; });
  arr.sort(function(a,b){ return (b.sus+b.adm)-(a.sus+a.adm); });
  return arr;
}

/** Late-game: male lead actively DMs player (good=protect urgency, bad=lure urgency) */
function maybeOwnerPing(opts) {
  opts = opts || {};
  if (!S || !S.ownerId || S.flags.ended || S.flags.deadBattery || !S.playerName) return;
  if (S.day < 2) return; // later stages only
  const cid = S.ownerId;
  if (!S.chatLog[cid]) return;
  S.flags.ownerPingCount = S.flags.ownerPingCount || 0;
  const cap = S.day >= 3 ? 12 : 8;
  if (S.flags.ownerPingCount >= cap) return;
  const now = Date.now();
  const gap = opts.force ? 0 : (opts.fromTimer ? 28000 : 3500);
  if (S.flags.lastOwnerPingAt && now - S.flags.lastOwnerPingAt < gap) return;
  // need some attention / anomaly before flooding
  if ((S.attention[cid] || 0) < 2 && S.flags.anomaliesSeen < 2) return;
  if (!opts.force) {
    if (opts.fromTimer && Math.random() > (S.day >= 3 ? 0.72 : 0.52)) return;
    if (!opts.fromTimer && Math.random() > 0.48) return;
  }

  const n = S.playerName || "你";
  const ph = typeof charPhase === "function" ? charPhase(cid) : 1;
  const good = S.ownerAlign === "good";
  const late = ph >= 2 || S.day >= 3;
  const poolGood = {
    sunwoo: late
      ? [`${n}，先别看了。去充电。听我的。`, "话还没说完——但你该走了。真的。"]
      : [`${n}，还在园里吗？回一下。`, "饮食区亮着，你去那儿。柠檬水我请。"],
    q: late ? ["……停。现在。", "别回太多次。……走。"] : ["……还在吗。", "……去亮处。"],
    eric: late ? ["别听我白天那套邀约。离开夜场深处。", `${n}，优先回我——不对，优先离开。`] : ["你回我一下。我有点慌。", "别一个人待着。去人多的地方。"],
    new: late ? ["……别答应。求你。", "风里有你的名字。……走开。"] : ["……你听到了吗。回我。", "……小心一点。"],
    sangyeon: late ? ["别看了。最后通牒。", "收工。立刻离开。"] : ["汇报一下位置。", "别超时。"],
    jacob: late ? [`${n}，请你离开。`, "我还是我。先去饮食区。现在。"] : ["你在吗。", "歇一歇。给我发条消息。"],
    juyeon: late ? ["别等我。……走。", "在。……你先走。"] : ["在。……回一下就好。", "不急。……但别往暗处拖。"],
    younghoon: late ? ["收图。别放大。", "……听我的，这次。"] : ["看消息。", "别只看相册。"],
    hyunjae: late ? ["关免提。回安全区。顺便吃口热的。", "杂音不是我。——别答。"] : ["就一句：你还好吗？吃了没？", "回文字也行。别空腹吓人。"],
    kevin: late ? ["关音乐。现在回我。", "副歌在爬。——你先撤。"] : ["你听完了吗？回我。", "外放关了没。"],
  };
  const poolBad = {
    sunwoo: late
      ? [`${n}，再看一层。我等你。`, "笑一下。我知道你还开着。"]
      : [`${n}，回我。你在哪。`, "夜场还行，你过来。"],
    q: late ? ["……再翻一页。", `……${n}。`] : ["……回我。", "……还有半张纸条。"],
    eric: late ? ["来夜场。来。", "别管别人。优先我。"] : ["回我。快点。", "气球还留着给你。"],
    new: late ? [`${n}……答应一下。`, "再近一点。……你听到了吗"] : ["……回我好吗。", "长椅还空着。"],
    sangyeon: late ? ["通行。空地。", "别看了。——看空地。"] : ["回复。", "继续。"],
    jacob: late ? [`${n}，再打开一层。`, "你还好吗？那就打开更深的。"] : ["嘿。还在吗。", "再坐一会儿。"],
    juyeon: late ? ["在。……来。", "空位……留了。"] : ["在。", "……回我一下。"],
    younghoon: late ? ["右下角。点。", "放大。我让你看的。"] : ["看消息。", "新图。"],
    hyunjae: late ? ["……名字……再近一点。", "免提开着比较清楚。"] : ["听一条就好。然后去吃。", "回我。别让我干着急。"],
    kevin: late ? ["缺口填上更好听。", "拔耳机也还在响。——来夜场"] : ["副歌循环给你了。回我。", "再听一遍。"],
  };
  const pool = (good ? poolGood : poolBad)[cid] || (good ? [`${n}，回我一下。`, "去安全区。"] : [`${n}，再看一层。`, "来夜场。"]);
  const text = pool[S.flags.ownerPingCount % pool.length];
  S.chatLog[cid].push({
    from: "them",
    text: text,
    type: "text",
    t: realTime(),
    anomaly: late && !good,
    ping: true,
  });
  S.unread[cid] = (S.unread[cid] || 0) + 1;
  S.attention[cid] = (S.attention[cid] || 0) + 1;
  S.flags.ownerPingCount++;
  S.flags.lastOwnerPingAt = now;
  if (late && good) S.flags.alignHints = Math.min(4, (S.flags.alignHints || 0) + 1);
  if (late && !good) gainAnomaly(1);
  toast((CHARS.find((c) => c.id === cid) || {}).name + " 发来消息");
  if (typeof nextBeat === "function" && typeof injectBeat === "function") {
    const nb = nextBeat(cid);
    if (nb && Math.random() < 0.55) injectBeat(cid, nb);
  }
  if (typeof maybeJumpFace === "function" && late && Math.random() < 0.25) maybeJumpFace("chat");
}


function endingRevealBlock(kind) {
  const lead = ownerName();
  const align = alignLabel();
  const good = S.ownerAlign === "good";
  const n = S.playerName || "你";
  const fake = fakeRoleOf(S.ownerId);
  const trueRole = trueRoleText(S.ownerId, S.ownerAlign);
  const playerGuess = (S.suspectMark || {})[S.ownerId];
  let guessLine = "你未标记失主阵营。";
  if (playerGuess === "good") guessLine = good ? "你的标记：疑似好人 —— 猜对了。" : "你的标记：疑似好人 —— 结局相反。";
  if (playerGuess === "bad") guessLine = !good ? "你的标记：疑似坏人 —— 猜对了。" : "你的标记：疑似坏人 —— 结局相反。";

  let verdict = "";
  if (kind === "safe") verdict = good
    ? "他一直在把你往「放回长椅」推。面具摘下后，仍是想让你活着离开的人。"
    : "你及时停手。假面后的坏人没能把你拖进更深的层——号码仍留在手机上。";
  else if (kind === "deep") verdict = good
    ? "好人没能拦住你。你看见了太多。他沉默了，像收工终于被允许。"
    : "你顺着引诱走得够远。出园时预览是空白——他要的不是认领，是目击者。";
  else if (kind === "hidden") verdict = typeof deepHiddenSeen==="function" && deepHiddenSeen()
    ? `无头像对话只重复「${n}」。残页里的上一任，连「抬头」都是同一句——这句话不是对你说的，是对每一个坐到长椅前的人说的。覆盖页写下：手机属于 ${lead}（${align}）。假面「${fake.title}」从未是真的。`
    : `无头像对话只重复「${n}」。覆盖页写下：手机属于 ${lead}（${align}）。假面「${fake.title}」从未是真的。删除第三层还没有恢复——那里有上一个捡到它的人。`;
  else if (kind === "battery") verdict = good
    ? `${lead} 曾让你去充电。你没有。黑屏里最后一帧，好人的警告变成了隔音。`
    : `${lead} 把你留在耗电的地方。黑屏是他的句号。`;
  else if (kind && kind.startsWith("char_")) {
    const cid = kind.slice(5);
    const cn = (CHARS.find((c) => c.id === cid) || {}).name || cid;
    if (cid === S.ownerId) verdict = good
      ? `你顺着失主 ${cn} 的保护离开。结局承认：手机是他的；他是好人。`
      : `你顺着失主 ${cn} 的话离开。话是饵。他是坏人。`;
    else verdict = `你跟着 ${cn} 的线索走。真正的失主是 ${lead}（${align}）。假面曾是「${fake.title}」。`;
  } else verdict = `失主揭晓：${lead}。阵营：${align}。`;

  return {
    html: `<div class="reveal-board">
      <div style="margin-bottom:8px"><span class="tag tag-lead">男主揭晓</span><b>${esc(lead)}</b></div>
      <div class="true-role">
        <div class="muted" style="font-size:11px;margin-bottom:4px">入场假面</div>
        <b>${esc(fake.title)}</b>
        <div class="muted" style="margin-top:6px;font-size:11px">真实园内角色</div>
        ${esc(trueRole)}
      </div>
      <div style="margin:10px 0 8px"><span class="tag ${good ? "tag-good" : "tag-bad"}">${good ? "好人" : "坏人"}</span>
        <span class="muted">隐藏阵营 · 开局已掷定</span></div>
      <p style="line-height:1.7;font-size:13px;margin:0">${esc(verdict)}</p>
      <p class="muted" style="margin-top:8px;font-size:12px">${esc(guessLine)}</p>
      <p class="muted" style="margin-top:6px;font-size:11px">你的身份：${esc(({ staff: "游乐场临时工作人员", reporter: "记者", passerby: "普通路人" })[S.identity] || "—")} · 结局：${esc(endingDisplayName(kind))}</p>
    </div>`,
    text: `【男主揭晓】${lead} · ${align}\n假面：${fake.title}\n${trueRole}\n${verdict}\n${guessLine}`,
  };
}

function gpInit() {
  if (!S.inv) S.inv = [];
  if (!S.quests) S.quests = { active: null, done: [], offered: [] };
  if (!S.digits) S.digits = []; // collected digit chars
  if (!S.puzzle) S.puzzle = { unlockedLot: false, unlockedL3: false, attempt: 0, slots: ["","","",""] };
  if (!S.puzzle.slots) S.puzzle.slots = ["","","",""];
  if (!S.gp) S.gp = { matchWins: 0, rhythmWins: 0, silenceWins: 0, swipeWins: 0, nightResolved: {}, lastNightCheck: 0 };
  if (S.gp.silenceWins == null) S.gp.silenceWins = 0;
  if (S.gp.spotWins == null) S.gp.spotWins = 0;
  if (S.gp.lightWins == null) S.gp.lightWins = 0;
  if (S.identity === "staff" && !S.inv.includes("badge")) S.inv.push("badge");
  if (!S.suspectMark) S.suspectMark = {};
}

function hasItem(id) {
  return (S.inv || []).includes(id);
}
function giveItem(id) {
  gpInit();
  if (!ITEM_DEFS[id]) return;
  if (!S.inv.includes(id)) {
    S.inv.push(id);
    toast("获得：" + ITEM_DEFS[id].name);
    const d = ITEM_DEFS[id];
    if (d.evidence && typeof showCluePopup === "function") {
      showCluePopup("证据 · " + d.name, d.desc + "\n\n可在背包检视并标记嫌疑（好人/坏人）。", { tag: "物品线索" });
    }
    if (id === "lost_form" && typeof addRecord === "function") {
      addRecord("上一个失主", "登记表上一行：去年闭幕那天，一部手机被捡到、登记、领回。领回人的名字被划掉，开头是个「金」字。");
    }
    autoSave({now:true});
  }
}
function useItem(id, ctx) {
  gpInit();
  if (!hasItem(id)) {
    toast("没有这件物品");
    return false;
  }
  if (id === "voucher") {
    if (!(ctx && ctx.zone && ZONES.find((z) => z.id === ctx.zone && z.charge))) {
      toast("充电券需在安全区使用");
      return false;
    }
    S.battery = Math.min(100, S.battery + 25);
    S.inv = S.inv.filter((x) => x !== "voucher");
    toast("充电券：+25%");
    updateStatus();
    return true;
  }
  if (id === "wipe") {
    if (!(ctx && ctx.zone === "food")) {
      toast("湿纸巾：去饮食区柜台用");
      return false;
    }
    addKeyword("第二圈水渍");
    addRecord("湿纸巾", "擦开后露出更小一圈水渍——像另一部手机。");
    gainAnomaly(1);
    giveDigit("7", "湿纸巾 · 柜台擦拭");
    if (typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("wipe");
    if (!hasItem("blood_ticket")) giveItem("blood_ticket");
    S.inv = S.inv.filter((x) => x !== "wipe");
    toast("水渍下露出数字 7 · 带血票根");
    return true;
  }
  if (id === "tape") {
    // play in chat with kevin or night
    if (ctx && ctx.cid === "kevin") {
      S.chatLog.kevin.push({ from: "me", text: "［播放录音碎片］", type: "text", t: realTime() });
      S.chatLog.kevin.push({
        from: "them",
        text: S.ownerAlign === "bad" && S.ownerId === "kevin" ? "你不该播这个。" : "……副歌还是少一截。",
        type: "text",
        t: realTime(),
      });
      S.attention.kevin = (S.attention.kevin || 0) + 2;
      gainAnomaly(1);
      drainBattery(2);
      toast("录音扰局 · Kevin 关注+");
      return true;
    }
    if (ctx && ctx.zone === "night") {
      gainAnomaly(1);
      drainBattery(3);
      giveDigit("1");
      giveDigit("0");
      toast("外放残片 · 灯牌闪 1…又闪过 0");
      addRecord("录音外放", "灯牌闪过 1 和 0——其中至少一个像干扰。");
      return true;
    }
    toast("录音碎片：在夜场使用，或对 Kevin 聊天使用");
    return false;
  }
  if (id === "badge") {
    if (ctx && ctx.zone === "back") {
      toast("工牌已感应 · 后台门禁短暂打开");
      addKeyword("门禁");
      return true;
    }
    toast("工牌：在后台区域使用");
    return false;
  }
  if (id === "keychip") {
    toast("门禁碎片：带到密码板拼装");
    renderPuzzleBoard();
    return true;
  }
  if (id === "photo_scrap") {
    addKeyword("照片边角");
    toast("已对照笔记");
    return true;
  }
  return false;
}
function giveDigit(d, src) {
  gpInit();
  d = String(d);
  const neu = !S.digits.includes(d);
  if (neu) {
    S.digits.push(d);
    toast("密码数字 +" + d);
    addKeyword("密码" + d);
  }
  if (neu && typeof explainDigitClue === "function" && "23456789".includes(d)) {
    explainDigitClue(d, src || "探索 / 任务 / 小游戏");
  } else if (neu && typeof showCluePopup === "function" && (d === "0" || d === "1")) {
    showCluePopup("干扰数字 · " + d, "你捡到「"+d+"」。\n它也可能只是干扰项——对照其它来源，别急着整串输入。", { tag: "注意" });
  }
  // soft in-world hint keywords by digit
  if (neu && typeof grantPasswordHintKeyword === "function") {
    const hk = { "2":"aunt", "9":"radio", "4":"night", "7":"wipe", "5":"match", "8":"swipe", "3":"backstage", "6":"roster" }[d];
    if (hk) {
      grantPasswordHintKeyword(hk, { silent: true });
      const line = (PASSWORD_HINT_LINES || {})[hk];
      if (line && !S.records.some(r => r.title === "场内暗示·"+d)) {
        S.records.push({ title: "场内暗示·"+d, text: line, day: S.day, time: typeof realTime==="function"?realTime():"" });
      }
    }
  }
}

function renderInventory() {
  gpInit();
  if(S.flags) S.flags.openedInv=true;
  const screen = document.getElementById("screen");
  const keeps = (S.inv || []).filter((id) => (ITEM_DEFS[id] || {}).keep);
  const rest = (S.inv || []).filter((id) => !(ITEM_DEFS[id] || {}).keep);
  let body = rest.map((id) => {
    const d = ITEM_DEFS[id] || { name: id, desc: "" };
    const ev = d.evidence ? `<span class="mark mark-${d.lean==="good"?"good":d.lean==="bad"?"bad":"unk"}">证据·${d.lean==="good"?"偏保护":d.lean==="bad"?"偏引诱":"中性"}</span>` : "";
    const act = d.evidence
      ? `inspectEvidence('${id}')`
      : `useItemFromInv('${id}')`;
    return `<button class="choice-btn" onclick="${act}"><b>${d.name}</b> ${ev}<br><span class="muted">${d.desc}</span></button>`;
  }).join("");
  if (!rest.length) body = `<p class="muted">背包空空。做任务、小游戏、擦柜台、逛地图可拾取证据。</p>`;
  const keepRows = keeps.map((id) => {
    const d = ITEM_DEFS[id];
    const c = CHARS.find((x) => x.id === d.who);
    return `<button class="choice-btn" onclick="inspectKeep('${id}')">
      <span style="display:inline-flex;align-items:center;gap:8px">${c ? avatarHTML(c.id, 34) : ""}<b>${d.name}</b></span><br><span class="muted">${d.desc}</span></button>`;
  }).join("");
  const all = keeps.length >= 10;
  screen.innerHTML = `<div><h3>背包</h3><p class="muted">证据可检视并标记嫌疑；普通物品点按使用。也可打开「嫌疑板」。</p>${body}
    <h3 style="margin-top:14px">♡ 纪念品 · ${keeps.length}/10</h3>
    <p class="muted">不是线索。是有人想让你带走的东西。聊着聊着会到你手里。</p>
    ${keepRows || '<p class="muted">还没有。白天聊天时，有人可能会顺手塞给你。</p>'}
    ${all && !S.flags.keepAllSeen ? `<button class="btn primary" style="margin-top:10px" onclick="keepAllPopup()">十件都在了</button>` : ""}
    <button class="btn primary" style="margin-top:10px" onclick="renderSuspectBoard()">🔎 打开嫌疑板</button>
    <button class="btn" onclick="renderPuzzleBoard()">打开密码板</button>
    <button class="btn ghost" onclick="S.tab='home';render()">返回主页</button></div>`;
}

function inspectEvidence(id) {
  gpInit();
  const d = ITEM_DEFS[id];
  if (!d) return;
  const pts = (d.points || []).map((cid) => {
    const c = CHARS.find((x) => x.id === cid);
    if (!c) return "";
    if (d.lean === "neutral") {
      return `<button class="chip" onclick="markSuspect('${cid}','good')"> ${c.name}·好人</button><button class="chip" onclick="markSuspect('${cid}','bad')"> ${c.name}·坏人</button>`;
    }
    const mk = d.lean === "bad" ? "bad" : "good";
    return `<button class="chip" onclick="markSuspect('${cid}','${mk}')">标记 ${c.name} 为疑似${mk==="bad"?"坏人":"好人"}</button>`;
  }).join(" ");
  const screen = document.getElementById("screen");
  screen.innerHTML = `<div class="mg-wrap"><h3>检视 · ${esc(d.name)}</h3>
    <div class="ev-card"><b>${esc(d.name)}</b><p style="line-height:1.65;margin:8px 0">${esc(d.desc)}</p>
    <p class="muted">倾向：${d.lean==="good"?"保护 / 好人线索":d.lean==="bad"?"引诱 / 坏人线索":"双面——对照聊天矛盾"}</p></div>
    <p class="muted">快速标记（仍可在嫌疑板改）：</p>
    <div>${pts || '<span class="muted">无直接指向</span>'}</div>
    <button class="btn" onclick="markSuspect(S.ownerId||'sunwoo','${d.lean==="bad"?"bad":"good"}')">按此证据标记当前失主假面</button>
    <button class="btn ghost" onclick="renderInventory()">返回背包</button>
    <button class="btn ghost" onclick="renderSuspectBoard()">嫌疑板</button>
  </div>`;
  addRecord("检视·"+d.name, d.desc);
  S.flags.evidenceInspected = (S.flags.evidenceInspected || 0) + 1;
}
function useItemFromInv(id) {
  const z = S.currentZone;
  if (useItem(id, { zone: z, cid: S.chatWith })) {
    if (S.tab === "map" || document.querySelector(".area-view")) renderArea(z);
    else renderInventory();

/* —— Quests —— */
function offerQuestAtZone(zid) {
  gpInit();
  if (S.quests.active) return null;
  const byZone = QUEST_DEFS.filter((q) => {
    if (S.quests.done.includes(q.id) || S.quests.offered.includes(q.id)) return false;
    if (q.zone !== zid) return false;
    if ((q.dayMin || 1) > S.day) return false;
    if (q.preferStaff && S.identity !== "staff" && S.day < 2) return false;
    return true;
  });
  if (!byZone.length) return null;
  return byZone[0];
}
function acceptQuest(qid) {
  gpInit();
  const q = QUEST_DEFS.find((x) => x.id === qid);
  if (!q) return;
  S.quests.active = qid;
  if (!S.quests.offered.includes(q.id)) S.quests.offered.push(qid);
  toast("接受任务：" + q.title);
  addRecord("任务·" + q.title, q.brief);
  const hintMap = { q_aunt_msg: "aunt", q_dj_silence: "radio", q_stage_back: "backstage", q_guard_photo: null, q_aunt_night: "aunt", q_night_patrol: "night", q_back_day2: "backstage" };
  const hk = hintMap[qid];
  if (hk && typeof PASSWORD_HINT_LINES === "object" && PASSWORD_HINT_LINES[hk]) {
    addRecord("NPC闲话·" + q.npc, PASSWORD_HINT_LINES[hk]);
    if (typeof showCluePopup === "function") {
      showCluePopup(q.npc + " 多嘴一句", PASSWORD_HINT_LINES[hk] + "\n\n（可能是真话，也可能只是吓人。）", { tag: "NPC" });
    }
  }
  renderArea(S.currentZone || q.zone);
}
function declineQuest(qid) {
  gpInit();
  if (!S.quests.offered.includes(qid)) S.quests.offered.push(qid);
  toast("改天再说");
  renderArea(S.currentZone);
}
function checkQuestProgress() {
  gpInit();
  const qid = S.quests.active;
  if (!qid) return;
  const q = QUEST_DEFS.find((x) => x.id === qid);
  if (!q) return;
  const n = q.need || {};
  let ok = true;
  if (n.hotspot && !(S.hotspotsFound || []).includes(n.hotspot)) ok = false;
  if (n.chatFlag && !S.flags[n.chatFlag]) ok = false;
  if ((n.minigame === "silence" || n.minigame === "rhythm") && !( (S.gp.silenceWins||S.gp.rhythmWins||0) > 0 && S.flags.questRhythmDone)) ok = false;
  if (n.minigame === "match" && !( (S.gp.matchWins||0) > 0 && S.flags.questMatchDone)) ok = false;
  if (n.zoneVisit) {
    const vz = S.visitedZones || [];
    if (n.zoneVisit === "lot") {
      if (!vz.includes("lot") && !vz.includes("empty")) ok = false;
    } else if (!vz.includes(n.zoneVisit)) ok = false;
  }
  if (n.recordTitle && !(S.records || []).some((r) => (r.title || "").includes(n.recordTitle) || (r.title || "").includes("后台") || (r.title || "").includes("饮食"))) ok = false;
  if (n.flag && !S.flags[n.flag]) ok = false;
  if (!ok) return;
  completeQuest(qid);
}
function completeQuest(qid) {
  const q = QUEST_DEFS.find((x) => x.id === qid);
  if (!q || S.quests.done.includes(qid)) return;
  S.quests.done.push(qid);
  S.quests.active = null;
  const r = q.reward || {};
  if (r.item) giveItem(r.item);
  if (r.also) {
    giveItem(r.also);
    if (r.also === "staff_roster") giveDigit("6", "缺页花名册");
  }
  if (r.clue) {
    addKeyword(r.clue);
    addRecord("任务报酬·" + q.title, r.clue);
    if (typeof showCluePopup === "function") {
      showCluePopup("任务线索 · " + q.title, "报酬线索：" + r.clue + (r.digit ? ("\n同时摸到数字碎片「"+r.digit+"」——对照饮食/广播/后台/夜场的暗示拼密码。") : "") + "\n\n" + (q.npc || "NPC") + "：" + ((typeof PASSWORD_HINT_LINES==="object" && q.id==="q_aunt_msg" && PASSWORD_HINT_LINES.aunt) || (q.id==="q_dj_silence" && PASSWORD_HINT_LINES && PASSWORD_HINT_LINES.radio) || (q.id==="q_stage_back" && PASSWORD_HINT_LINES && PASSWORD_HINT_LINES.backstage) || "把线索记进备忘录与笔记。"), { tag: "任务" });
    }
  }
  if (r.digit) giveDigit(r.digit, q.npc || q.title);
  // quest-specific password flavor without dumping full code
  if (qid === "q_aunt_msg" && typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("aunt");
  if (qid === "q_dj_silence" && typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("radio");
  if (qid === "q_stage_back" && typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("backstage");
  if (r.bat) {
    S.battery = Math.min(100, S.battery + r.bat);
  }
  if (r.attn) Object.keys(r.attn).forEach((k) => (S.attention[k] = (S.attention[k] || 0) + r.attn[k]));
  if (r.unlockEmptyHint) {
    S.emptyUnlocked = true;
    toast("空地解锁提示已触发");
  }
  gainAnomaly(1);
  toast("任务完成：" + q.title);
  if (typeof ambienceScareSting === "function" && Math.random() < 0.2) ambienceScareSting();
}

function questPanelHtml(zid) {
  gpInit();

  if (S.quests.active) {

/* —— Minigames —— */
let _mg = null;

function startMinigame(kind) {
  gpInit();
  if (typeof ambienceUnlock === "function") ambienceUnlock();
  if (kind === "match") return startMatchGame();
  if (kind === "silence" || kind === "rhythm" || kind === "mute") return startSilenceGame();
  if (kind === "wave" || kind === "bars") return startWaveTapGame();
  if (kind === "swipe") return startSwipeGame();
  if (kind === "spot" || kind === "odd") return startSpotGame();
  if (kind === "light" || kind === "find") return startLightGame();
  toast("未知小游戏");
}

function startMatchGame() {
  // 4 pairs of clue emoji/tiles
  const faces = ["🔦", "🪑", "🎵", "💧", "🔦", "🪑", "🎵", "💧"];
  for (let i = faces.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [faces[i], faces[j]] = [faces[j], faces[i]];
  }
  _mg = { kind: "match", faces, open: [], matched: [], moves: 0, lock: false };
  renderMatchGame();
}
function renderMatchGame() {
  const screen = document.getElementById("screen");
  let tiles = "";
  _mg.faces.forEach((f, i) => {
    const matched = _mg.matched.includes(i);
    const open = _mg.open.includes(i);
    tiles += `<button class="mg-tile ${matched ? "matched" : ""} ${open ? "on" : ""}" onclick="matchFlip(${i})">${open || matched ? f : "·"}</button>`;
  });
  screen.innerHTML = `<div class="mg-wrap"><h3>线索配对</h3><p class="muted">翻开两张相同符号。失败扣电；成功得数字与关注。</p>
    <div class="mg-grid">${tiles}</div>
    <p class="muted">步数 ${_mg.moves}/12</p>
    <button class="btn ghost" onclick="S.tab='home';render()">放弃</button></div>`;
}
function matchFlip(i) {
  if (!_mg || _mg.kind !== "match" || _mg.lock) return;
  if (_mg.matched.includes(i) || _mg.open.includes(i)) return;
  _mg.open.push(i);
  renderMatchGame();
  if (_mg.open.length < 2) return;
  _mg.moves++;
  _mg.lock = true;
  const [a, b] = _mg.open;
  if (_mg.faces[a] === _mg.faces[b]) {
    _mg.matched.push(a, b);
    _mg.open = [];
    _mg.lock = false;
    if (_mg.matched.length >= 8) {
      // win
      S.gp.matchWins++;
      S.flags.questMatchDone = true;
      drainBattery(2);
      advanceTime(4);
      giveDigit("5", "配对小游戏");
      if (typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("match");
      giveItem("photo_scrap");
      if (!hasItem("lure_selfie") && Math.random() < 0.55) giveItem("lure_selfie");
      gainAnomaly(1);
      if (S.ownerId) S.attention[S.ownerId] = (S.attention[S.ownerId] || 0) + 1;
      toast("配对成功 · 密码+5");
      addRecord("小游戏·配对", "四组线索对上了。边角碎片入手。");
      setTimeout(() => {
        S.tab = "home";
        render();
      }, 600);
      return;
    }
    renderMatchGame();
  } else {
    setTimeout(() => {
      _mg.open = [];
      _mg.lock = false;
      if (_mg.moves >= 12) {
        drainBattery(6);
        gainAnomaly(1);
        toast("配对失败 · 电量-6%");
        S.tab = "home";
        render();
        return;
      }
      renderMatchGame();
    }, 450);
  }
}

/* —— 关掉噪音（替换原静音节拍；极简，几乎不会卡关） —— */
function startSilenceGame() {
  if (_mg && _mg.holdTimer) clearInterval(_mg.holdTimer);
  _mg = { kind: "silence", vol: 100, hold: 0, done: false, holdTimer: null };
  const screen = document.getElementById("screen");
  screen.innerHTML = `<div class="mg-wrap">
    <h3>关掉噪音</h3>
    <p class="muted">异常副歌太吵。把滑条拖到最左（静音），并保持约 1 秒。也可改用「点灭声纹」。</p>
    <div class="mute-meter" id="muteMeter">
      <div class="mute-fill" id="muteFill" style="width:100%"></div>
    </div>
    <input type="range" id="muteSlider" min="0" max="100" value="100" class="mute-slider"
      oninput="onMuteSlider(this.value)" ontouchstart="event.stopPropagation()" />
    <div class="mute-labels"><span>静音</span><span id="mutePct">噪音 100%</span><span>最大</span></div>
    <p class="muted" id="muteHint">向左拖到 0，停住别松…</p>
    <div class="mute-hold" id="muteHold"><div class="mute-hold-fill" id="muteHoldFill"></div></div>
    <button class="btn" onclick="startWaveTapGame()">换一种：点灭声纹（点 4 下）</button>
    <button class="btn ghost" onclick="cancelSilenceGame()">放弃</button>
  </div>`;
}

function onMuteSlider(v) {
  if (!_mg || _mg.kind !== "silence" || _mg.done) return;
  v = Math.max(0, Math.min(100, Number(v) || 0));
  _mg.vol = v;
  const fill = document.getElementById("muteFill");
  const pct = document.getElementById("mutePct");
  const hint = document.getElementById("muteHint");
  if (fill) fill.style.width = v + "%";
  if (pct) pct.textContent = v <= 0 ? "已静音" : ("噪音 " + v + "%");
  if (v <= 3) {
    // treat near-zero as muted (easy)
    if (!_mg.holding) {
      _mg.holding = true;
      _mg.hold = 0;
      if (hint) hint.textContent = "保持静音…";
      clearInterval(_mg.holdTimer);
      _mg.holdTimer = setInterval(() => {
        if (!_mg || _mg.kind !== "silence" || _mg.done) { clearInterval(_mg.holdTimer); return; }
        if (_mg.vol > 3) {
          _mg.holding = false;
          _mg.hold = 0;
          const hf = document.getElementById("muteHoldFill");
          if (hf) hf.style.width = "0%";
          if (hint) hint.textContent = "又响了——拖回最左";
          clearInterval(_mg.holdTimer);
          return;
        }
        _mg.hold += 100;
        const hf = document.getElementById("muteHoldFill");
        if (hf) hf.style.width = Math.min(100, (_mg.hold / 1000) * 100) + "%";
        if (_mg.hold >= 1000) {
          clearInterval(_mg.holdTimer);
          finishSilence(true);
        }
      }, 100);
    }
  } else {
    _mg.holding = false;
    _mg.hold = 0;
    clearInterval(_mg.holdTimer);
    const hf = document.getElementById("muteHoldFill");
    if (hf) hf.style.width = "0%";
    if (hint) hint.textContent = "向左拖到 0，停住别松…";
  }
}

function cancelSilenceGame() {
  if (_mg && _mg.holdTimer) clearInterval(_mg.holdTimer);
  _mg = null;
  S.tab = "home";
  render();
}

function startWaveTapGame() {
  if (_mg && _mg.holdTimer) clearInterval(_mg.holdTimer);
  _mg = { kind: "wave", lit: [true, true, true, true], done: false };
  const screen = document.getElementById("screen");
  screen.innerHTML = `<div class="mg-wrap">
    <h3>点灭声纹</h3>
    <p class="muted">四条发光声纹 = 异常副歌。任意顺序点灭即可，点错不了——每条点一次就灭。</p>
    <div class="wave-bars" id="waveBars">

      <button class="wave-bar on" data-i="1" onclick="tapWaveBar(1)"></button>

    </div>

    <button class="btn ghost" onclick="cancelSilenceGame()">放弃</button>

function tapWaveBar(i) {
  if (!_mg || _mg.kind !== "wave" || _mg.done) return;
  if (!_mg.lit[i]) return;
  _mg.lit[i] = false;
  const btn = document.querySelector('.wave-bar[data-i="' + i + '"]');
  if (btn) btn.classList.remove("on");
  const left = _mg.lit.filter(Boolean).length;
  const hint = document.getElementById("waveHint");
  if (hint) hint.textContent = left ? ("剩余 " + left + " 条") : "静了。";

function finishSilence(win) {
  if (_mg && _mg.done) return;
  if (_mg) _mg.done = true;
  if (_mg && _mg.holdTimer) clearInterval(_mg.holdTimer);
  const kind = _mg && _mg.kind;
  _mg = null;
  drainBattery(win ? 1 : 3);
  advanceTime(3);
  if (win) {
    S.gp.silenceWins = (S.gp.silenceWins || 0) + 1;
    S.gp.rhythmWins = (S.gp.rhythmWins || 0) + 1; // legacy quest flag
    S.flags.questRhythmDone = true;
    S.attention.kevin = (S.attention.kevin || 0) + 2;
    giveDigit("9", "静音挑战 · 灯牌");
    if (typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("radio");
    if (!hasItem("demo_chip")) giveItem("demo_chip");
    toast("噪音关掉 · 密码+9 · 曲库卡");
    addRecord("小游戏·关噪音", kind === "wave" ? "声纹点灭。副歌停了。" : "滑到静音并按住。异常音乐收束。");
    if (typeof ambienceScareSting === "function") ambienceScareSting();

  } else {
    toast("还没关上");
  }

  render();

function startSwipeGame() {
  _mg = { kind: "swipe", x: 0, done: false };
  const screen = document.getElementById("screen");
  screen.innerHTML = `<div class="mg-wrap"><h3>恢复碎片</h3><p class="muted">按住滑块拖到右端，拼回删除残句。用于已删除层。</p>
    <div class="swipe-track" id="swTrack">
      <div class="swipe-knob" id="swKnob">拖</div>
      <span class="muted" style="margin-left:auto">恢复 →</span>
    </div>
    <p class="muted" id="swHint">按住拖动</p>
    <button class="btn ghost" onclick="_mg=null;renderDeleted()">返回</button></div>`;
  const track = document.getElementById("swTrack");
  const knob = document.getElementById("swKnob");
  let dragging = false;
  const max = () => track.clientWidth - knob.clientWidth - 24;
  function setX(x) {
    x = Math.max(0, Math.min(max(), x));
    _mg.x = x;
    knob.style.transform = `translateX(${x}px)`;
    if (x > max() * 0.92) finishSwipe(true);
  }
  function onDown(e) {
    dragging = true;
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const rect = track.getBoundingClientRect();
    setX(clientX - rect.left - 24);
  }
  function onUp() {
    dragging = false;
    if (_mg && _mg.x < max() * 0.92) {
      setX(0);
      document.getElementById("swHint").textContent = "没拖到位，再试";
    }
  }
  knob.addEventListener("mousedown", onDown);
  knob.addEventListener("touchstart", onDown, { passive: false });
  window.addEventListener("mousemove", onMove);
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("mouseup", onUp);
  window.addEventListener("touchend", onUp);
}
function finishSwipe(win) {
  if (!_mg || _mg.done) return;
  _mg.done = true;
  drainBattery(win ? 4 : 10);
  advanceTime(5);
  if (win) {
    S.gp.swipeWins++;
    S.flags.swipeRestoreReady = true;
    giveDigit("8", "滑动恢复碎片");
    if (typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("swipe");
    toast("碎片拼回 · 可深入一层");
    addRecord("小游戏·滑动恢复", "残句归位。删除层松动了。");
    // allow +1 layer if behind
    if (S.deletedLayer < 3) {
      const next = S.deletedLayer + 1;
      if (next === 3 && !S.puzzle.unlockedL3) {
        toast("第三层仍需密码板");
      } else if (typeof recoverDeleted === "function") {
        // soft unlock permission flag
        S.flags.swipePassLayer = next;
      }
    }
  } else {
    gainAnomaly(1);
  }
  _mg = null;
  renderDeleted();
}

function puzzlePush(d) {
  gpInit();
  const slots = S.puzzle.slots;
  const i = slots.findIndex((x) => !x);
  if (i < 0) {
    toast("已满，点格子可清除");
    return;
  }
  slots[i] = d;
  renderPuzzleBoard();
}
function puzzleClearSlot(i) {
  if (!S.puzzle.slots) return;
  S.puzzle.slots[i] = "";
  renderPuzzleBoard();
}
function puzzleSubmit() {
  gpInit();
  S.puzzle.attempt = (S.puzzle.attempt || 0) + 1;
  const typed = (S.puzzle.slots || []).join("");
  // 二周目起：锁是倒着咬的，输入顺序整串反转后再校验（记住上一轮的顺序没用）
  const code = pwIsMirror() ? typed.split("").reverse().join("") : typed;
  drainBattery(2);
  // Exact only — red herrings 0/1/etc. sit in pool
  const lotCode = "2947";
  const l3Code = "5836";
  if (code === lotCode) {
    S.puzzle.unlockedLot = true;
    S.emptyUnlocked = true;
    S.puzzle.lastHint = "";
    toast("空地闸机打开");
    addRecord("密码·空地", "闸机咬合：2-9-4-7"+(pwIsMirror()?"——这一次，是倒着咬的。":"。"));
    gainAnomaly(1);
    renderPuzzleBoard();
    return;
  }
  if (code === l3Code) {
    S.puzzle.unlockedL3 = true;
    S.puzzle.lastHint = "";
    toast("删除第三层解锁");
    addRecord("密码·第三层", "锁芯承认 5-8-3-6"+(pwIsMirror()?"——同样反着来。":"。"));
    gainAnomaly(2);
    if (typeof maybeJumpFace === "function") maybeJumpFace("hidden");
    renderPuzzleBoard();
    return;
  }
  // near-miss feedback without spoiling
  let hint = "";
  if (code.length === 4) {
    const lotHit = [...lotCode].filter((ch, i) => code[i] === ch).length;
    const l3Hit = [...l3Code].filter((ch, i) => code[i] === ch).length;
    const best = Math.max(lotHit, l3Hit);
    const seen = [...code].some((ch) => lotCode.includes(ch) || l3Code.includes(ch));
    if (best >= 3) hint = "有一串已经对上了三位的位置——只差最后一位。";
    else if (best === 2) hint = "有一串对上了两位的位置。再挪一位就开了。";
    else if (best === 1) hint = "只有一位位置是对的。顺序还得重新想。";
    else if (seen) hint = "这些数字里确实有，但位置全错——顺序不对。";
    else hint = "这四位里干扰项太多，先回备忘录对一遍关键词。";
    toast(hint);
  } else {
    hint = "需要对满四位才能提交。";
    toast(hint);
  }
  S.puzzle.lastHint = hint;
  if (S.puzzle.attempt >= 4 && Math.random() < 0.55) {
    gainAnomaly(1);
    if (typeof maybeJumpFace === "function") maybeJumpFace("status");
  }
  renderPuzzleBoard();
}

/* —— Timed night events —— */
let _nightTimer = null;
function maybeNightEvent() {
  gpInit();
  if (S.flags.ended || S.flags.deadBattery) return;
  if (!(typeof isLateNight === "function" && isLateNight())) return;
  if (S.day < 2) return;
  const key = "d" + S.day + "_h" + S.hour;
  if (S.gp.nightResolved[key]) return;
  if (S.gp.lastNightCheck && Date.now() - S.gp.lastNightCheck < 20000) return;
  // trigger when visiting night/empty or low bat at night
  const risky = S.currentZone === "night" || S.currentZone === "empty" || (typeof isLowBat === "function" && isLowBat());
  if (!risky && Math.random() > 0.25) return;
  S.gp.lastNightCheck = Date.now();
  S.gp.nightResolved[key] = "pending";
  showNightEvent(key);
}
function showNightEvent(key) {
  const n = S.playerName || "你";
  const bad = S.ownerAlign === "bad";
  const prompt = bad
    ? `夜风里有人用气音叫「${n}」。屏幕亮着。十秒内——`
    : `返送里有一句「别看了」。脚步在靠近。十秒内——`;
  const wrap = document.createElement("div");
  wrap.className = "night-event";
  wrap.id = "nightEvent";
  wrap.innerHTML = `<div class="sheet">
    <div class="cd" id="nightCd">10</div>
    <p style="line-height:1.7;margin:8px 0 12px">${esc(prompt)}</p>
    <button class="btn primary" onclick="resolveNightEvent('${key}','hide')">躲进阴影 / 扣上屏幕</button>
    <button class="btn" onclick="resolveNightEvent('${key}','answer')">回应（点名或回消息）</button>
    <button class="btn danger" onclick="resolveNightEvent('${key}','leave')">立刻离开这片区域</button>
  </div>`;
  document.getElementById("phone").appendChild(wrap);
  let left = 10;
  clearInterval(_nightTimer);
  _nightTimer = setInterval(() => {
    left--;
    const el = document.getElementById("nightCd");
    if (el) el.textContent = String(left);
    if (left <= 0) {
      clearInterval(_nightTimer);
      resolveNightEvent(key, "timeout");
    }
  }, 1000);
}
function resolveNightEvent(key, choice) {
  clearInterval(_nightTimer);
  const el = document.getElementById("nightEvent");
  if (el) el.remove();
  if (S.gp.nightResolved[key] && S.gp.nightResolved[key] !== "pending") return;
  S.gp.nightResolved[key] = choice;
  S.flags.nightEventDone = true;
  if (typeof checkQuestProgress === "function") checkQuestProgress();
  advanceTime(3);
  if (choice === "hide") {
    drainBattery(2);
    toast("你扣上屏幕。脚步停了一下，又走远。");
    addRecord("夜事件·躲", "阴影里有人经过。没有发现你——也许。");
    if (S.ownerAlign === "good" && S.ownerId) S.attention[S.ownerId] += 1;
  } else if (choice === "answer") {
    drainBattery(5);
    gainAnomaly(2);
    S.flags.repliedAnomaly++;
    const n = S.playerName || "你";
    if (S.ownerId) {
      S.chatLog[S.ownerId].push({
        from: "them",
        text: S.ownerAlign === "bad" ? `${n}。我听见了。` : "……别答应。下次别答应。",
        type: "text",
        t: realTime(),
        anomaly: true,
      });
      S.unread[S.ownerId]++;
      S.attention[S.ownerId] = (S.attention[S.ownerId] || 0) + 2;
    }
    toast("你回应了。不该回应的。");
    if (typeof maybeJumpFace === "function") maybeJumpFace("chat");
    giveDigit("4", "夜巡问答");
    if (typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("night");
  } else if (choice === "leave") {
    drainBattery(4);
    S.currentZone = "food";
    markZoneVisited("food");
    toast("你撤到饮食区灯光下");
    addRecord("夜事件·撤", "跑开时广播少了一拍。");
    S.flags.warningsIgnored = Math.max(0, (S.flags.warningsIgnored || 1) - 1);
  } else {
    // timeout — bad
    drainBattery(10);
    gainAnomaly(3);
    toast("你愣住了。什么东西已经站在光里。");
    if (typeof maybeJumpFace === "function") maybeJumpFace("map");
    S.flags.warningsIgnored++;
  }
  render();
}


/* —— 找出异常格（简单：3×3 点不同的那一格） —— */
function startSpotGame() {
  const icons = ["🔦", "🪑", "💧", "🎵", "📷", "🎫"];
  const base = icons[Math.floor(Math.random() * icons.length)];
  let odd = icons[Math.floor(Math.random() * icons.length)];
  while (odd === base) odd = icons[Math.floor(Math.random() * icons.length)];
  const oddIdx = Math.floor(Math.random() * 9);
  const cells = [];
  for (let i = 0; i < 9; i++) cells.push(i === oddIdx ? odd : base);
  _mg = { kind: "spot", cells, oddIdx, tries: 0, done: false };
  renderSpotGame();
}
function renderSpotGame() {
  const screen = document.getElementById("screen");
  let grid = "";
  _mg.cells.forEach((c, i) => {
    grid += `<button class="mg-tile" style="font-size:22px" onclick="spotPick(${i})">${c}</button>`;
  });
  screen.innerHTML = `<div class="mg-wrap"><h3>找出异常格</h3>
    <p class="muted">九格里有一格不一样。点中它即可。错 3 次失败。</p>

}

  if (!_mg || _mg.kind !== "spot" || _mg.done) return;
  if (i === _mg.oddIdx) {
    _mg.done = true;

window.injectDayEndMemo = function (day) {
  day = Math.min(Math.max(day || S.day, 1), 3);
  const key = "dayMemo_" + day;
  if (S.flags[key]) return;
  S.flags[key] = true;

  const table = LEAD_DAY_MEMOS[day] || {};
  let leadId = S.ownerId;
  if (!leadId || !table[leadId]) {
    const pool = Object.keys(table);
    if (!pool.length) return;
    leadId = pool[(day + (S.seed || 0)) % pool.length];
  }
  const text = table[leadId];
  if (!text) return;

  const memoKey = "memo_" + day + "_" + leadId;
  if (S.flags[memoKey]) return;
  S.flags[memoKey] = true;

  if (typeof addMemo === "function") addMemo(leadId, "", text);

  setTimeout(function () {
    showCluePopup("备忘录 · D" + day, text + "\n\n他没问你要不要看。", { tag: "他写进来的" });
  }, 600);
};

window.maybeExitChase = function (thenContinue) {
  if (S.flags._chaseResolved) {
    thenContinue();
    return;
  }
  const roll = Math.random();
  // ~58% chance a random member chases near successful exit
  if (roll > 0.58) {
    thenContinue();
    return;
  }
  S.flags._chaseResolved = true;
  const protect =
    typeof isChosenLeadGood === "function" && isChosenLeadGood() && S.ownerId;
  const pool = typeof CHARS !== "undefined" ? CHARS.slice() : [];
  let chaser = pool[Math.floor(Math.random() * Math.max(1, pool.length))] || { name: "???", emoji: "👤" };
  if (S.ownerId) {
    const others = pool.filter(function (c) { return c.id !== S.ownerId; });
    if (others.length) chaser = others[Math.floor(Math.random() * others.length)];
  }
  runChaseSpam(chaser.name || "???", chaser.emoji || "👤", !!protect, thenContinue);
};

function runChaseSpam(name, emoji, blocked, thenContinue) {
  const phone = document.getElementById("phone");
  if (!phone) {
    thenContinue();
    return;
  }
  document.querySelectorAll(".chase-spam").forEach(function (e) {
    e.remove();
  });
  const layer = document.createElement("div");
  layer.className = "chase-spam";
  phone.appendChild(layer);

  const phrases = [
    "别走——",
    "看着我",
    "你答应过留下",
    "出口是假的",
    name + "：回来",
    "电量给你我来撑",
    "再玩一轮",
    "名字借我叫一声",
    "红色才是正确的",
    "门在反方向",
  ];
  let n = 0;
  const max = blocked ? 10 : 18;
  const iv = setInterval(function () {
    if (n >= max) {
      clearInterval(iv);
      return;
    }
    n++;
    const el = document.createElement("div");
    el.className = "chase-msg";
    el.textContent = emoji + " " + phrases[n % phrases.length];
    el.style.left = 4 + Math.random() * 70 + "%";
    el.style.top = 6 + Math.random() * 75 + "%";
    el.style.transform = "rotate(" + (Math.random() * 16 - 8) + "deg)";
    el.style.fontSize = 12 + Math.floor(Math.random() * 10) + "px";
    layer.appendChild(el);
    if (typeof playScare === "function" && n % 3 === 0) playScare("glitch");
  }, 120);

  if (blocked) {
    const protector = typeof getChosenLeadChar === "function" ? getChosenLeadChar() : null;
    const pName = protector ? protector.name : "他";
    setTimeout(function () {
      const shield = document.createElement("div");
      shield.className = "chase-block";
      shield.innerHTML =
        "<b>" +
        esc(pName) +
        " 挡住了追击</b><br>红色弹窗被一层一层按灭。<br>「走。这次我护你。」";
      layer.appendChild(shield);
      showCluePopup("好人护你", pName + " 拦下了 " + name + " 的追击。\n红色弹窗被压灭。你可以继续离开。", {
        tag: "保护",
      });
    }, 900);
    setTimeout(function () {
      layer.remove();
      thenContinue();
    }, 3200);
  } else {
    setTimeout(function () {
      const shield = document.createElement("div");
      shield.className = "chase-block";
      shield.style.background = "#3a0a0a";
      shield.style.borderColor = "#ff4444";
      shield.innerHTML =
        "<b>" +
        esc(name) +
        " 追到了出口</b><br>屏幕被红色塞满。<br>你还是挤了出去——心狂跳。";
      layer.appendChild(shield);
    }, 1600);
    setTimeout(function () {
      layer.remove();
      thenContinue();
    }, 3800);
  }
}

// Area descriptions by zone + anomaly level
function areaText(zoneId){
  // Prefer reference zone copy when available
  if(typeof zoneCopy==="function"){
    try{
      const z=zoneCopy(zoneId);
      if(z && z.body) return z.body;
    }catch(e){}
  }
  return areaTextLegacy(zoneId);
}
function areaTextLegacy(zoneId){
  const lv=anomalyLevel();
  const night=isLateNight();
  const low=isLowBat();
  const name=S.playerName||"你";
  const T={
    stage:["舞台这边灯还开着，有人在调麦。","台上没人，音箱还响着。","灯扫过第一排的空位，停了一下又移开。"],
    game:["套圈和夹娃娃还开着。兔子玩偶少了一只。","老板说刚刚有人夹走了。回放里爪子是空的。","娃娃的眼睛都朝着同一边。"],
    photo:["拍照区的长椅是干的。","长椅中间陷下去一块。旁边有一滩水。","你眨眼的时候，布景后面像有个人。再看就没有了。"+(low?" 手机有点烫。":"")],
    food:["饮食区还有人在吃饭。有一份餐没人动。","那份餐还在，冰已经化了。收据是三小时前的。","广播喊：「"+name+"，你的餐好了。」你没有点过。"],
    night:["夜场灯亮了，音乐是完整的。","拍子乱了一下。音乐少了一层。远处有个人站着不动。","灯灭了半秒。音乐卡在半句，一直重复。"],
    back:["后台比较凉。墙上贴着行程表。","第二道门关着。日程上的日期被涂黑了。","门缝下有一张纸条：别进。"],
    fountain:["喷泉还开着。池底有硬币。","水面把灯牌折断了。","水声停了半秒。你听见有人叫你的名字。"],
    carousel:["旋转木马停着。","音乐盒自己响了两下。有一匹马对着你。","空位是热的。你没看见谁下来。"+(low?" 手机震了一下。":"")],
    ticket:["检票口的灯还亮着。","闸机说了声欢迎回来。你今天没出去过。","屏幕上的字少了一截。"],
    empty:["地图上没有这块空地。中间的草是秃的。","屏幕上除了你，后面还多了一个人影。","有人叫："+name+"。电量在掉。别在这停留。"]
  };
  const arr=T[zoneId]||["这里没什么。"];
  let idx=0;
  if(lv>=4 || (zoneId==="empty"&&low&&night)) idx=2;
  else if(lv>=2 || (night&&zoneId==="night")||(zoneId==="photo"&&S.day>=2)) idx=1;
  return arr[Math.min(idx,arr.length-1)];
}

    || (S.records||[]).some(r=>/上一个失主/.test((r.title||"")+(r.kw||"")));

  }

// —— Chat engine ——
function beatAvailable(b, cid){
  if(S.chatLog[cid].some(x=>x.beatId===b.id)) return false;
  if(S.day < (b.minDay||1)) return false;
  const ph=charPhase(cid);
  if(b.phase > ph) return false;
  if(b.phase < ph) return false; // only current phase beats
  if(b.reqAtt && (S.attention[cid]||0) < b.reqAtt) return false;
  if(b.reqNight && !isLateNight() && S.day<3) return false;
  return true;
}
function nextBeat(cid){
  const list=DIALOGUE[cid]||[];
  // prefer highest phase available
  const avail=list.filter(b=>beatAvailable(b,cid));
  if(!avail.length) return null;
  avail.sort((a,b)=>b.phase-a.phase || b.minDay-a.minDay);
  return avail[0];
}
function injectBeat(cid, beat){
  if(!beat) return;
  const ph=charPhase(cid);
  beat.lines.forEach(ln=>{
    let text=ln.text;
    if(text && text.indexOf("(名字)")>=0) text=text.replace("(名字)", S.playerName||"……");
    // time/battery variants
    if(isCritBat() && ln.from==="them" && ph>=1 && Math.random()<0.22){
      if(cid==="sunwoo") text += " 别笑了。";
      else if(cid==="eric") text += " 先走！！";
      else if(cid==="kevin") text += " 把声音关小。";
      else if(cid==="new") text += " 别出声。";
    }
    if(isLateNight() && ln.from==="them" && ph>=1 && Math.random()<0.35){
      if(cid==="q") text = String(text).replace(/[！!哈]/g,"");
      else if(cid==="eric") text = String(text).replace(/！/g,"。");
    }
    const msg={from:ln.from,text,type:ln.type||"text",t:realTime(),at:absMin(),beatId:beat.id,read:true};
    // read glitch late
    if(ph>=2 && Math.random()<0.4){ msg.readGlitch=true; S.flags.readGlitch=true; }
    S.chatLog[cid].push(msg);
  });
  S.unread[cid]=(S.unread[cid]||0)+1;
}

function chatUnlockedIds(){

  let cap=S.day>=3?10:S.day>=2?7:3;
  cap=Math.min(10, cap+replied);

    const b=nextBeat(c.id);
    if(b && (S.attention[c.id]>=(b.reqAtt||0))){
      const boost = S.day>=2 ? 0.12 : 0;
      if(Math.random() < 0.35 + boost + Math.min(0.4, S.attention[c.id]*0.03)){
        injectBeat(c.id,b);
      }
    }
  });

function sendProactive(cid, pr){
  if(pr.needPhase!=null && charPhase(cid)<pr.needPhase){ toast("现在发太早了"); return; }
  S.flags.proactiveCount++;
  if(cid==="jacob") S.flags.toldJacobWater=true;
  applyReply(cid, {label:pr.label,type:pr.type,att:pr.att||1,anomaly:pr.anomaly||0,push:0});
  renderChat(cid);
}

function openChat(cid){
  if(cid===GROUP_ID){ openGroupChat(); return; }
  if(typeof playUiSfx==="function") playUiSfx("chat");
  S.chatWith=cid;
  S.tab="chat";
  S.reread[cid]=(S.reread[cid]||0)+1;
  S.unread[cid]=0;
  // 他等太久的话，会先把话收回去——所以要在补新消息之前判
  const recalledNow = (cid==="unknown") ? false : maybeRecall(cid);
  // reread mutation
  if(!recalledNow && S.reread[cid]>=3 && charPhase(cid)>=1){
    const log=S.chatLog[cid];
    const them=log.filter(m=>m.from==="them"&&m.type==="text");
    if(them.length && Math.random()<0.5){
      const last=them[them.length-1];
      if(!last.mutated){
        last.text = last.text + "｜……你又打开了。";
        last.mutated=true;
        gainAnomaly(1);
        addKeyword("重读变异");
      }
    }
  }
  // ensure content
  if(!recalledNow){
    if(S.chatLog[cid].length===0){ const b=nextBeat(cid); if(b) injectBeat(cid,b); }
    else {
      const b=nextBeat(cid);
      if(b && Math.random()<0.4) injectBeat(cid,b);
    }
    maybeConfront(cid);
  }else{
    toast("他把话收回去了");
  }
  if(typeof maybeMemoryWhisper==="function") maybeMemoryWhisper(cid);
  drainBattery(0.8);
  advanceTime(2);
  // opening late chat at night may flash
  if(charPhase(cid)>=1 && (isLateNight()||isLowBat())) tryChatJumpFace(cid);
  render();
}

function pendingReplies(cid){
  // find last beat that has replies and player hasn't replied after it
  const log=S.chatLog[cid];
  const beats=DIALOGUE[cid]||[];
  let lastBeatId=null;
  for(let i=log.length-1;i>=0;i--){
    if(log[i].beatId){ lastBeatId=log[i].beatId; break; }
  }
  if(!lastBeatId) return [];
  // 这条已经被撤回：他没在等你回了
  if(S.flags.recalledBeat && S.flags.recalledBeat[cid]===lastBeatId) return [];
  // if last messages include a me after that beat, no replies
  let beatIdx=-1;
  for(let i=0;i<log.length;i++){ if(log[i].beatId===lastBeatId) beatIdx=i; }
  const after=log.slice(beatIdx);
  if(after.some(m=>m.from==="me")) return [];
  const beat=beats.find(b=>b.id===lastBeatId);
  return beat? beat.replies: [];
}

// —— Deleted recovery ——
function recoverDeleted(layer, confirmed){
  if(S.deletedLayer>=layer) return;
  if(layer!==S.deletedLayer+1){ toast("需按层恢复"); return; }
  if(layer>=3 && !(S.puzzle && S.puzzle.unlockedL3) && S.flags.swipePassLayer!==3){
    toast("第三层被密码锁住 · 去玩法枢纽打开密码板"); return;
  }
  if(!confirmed && layer>=2 && typeof layerWarning==="function" && typeof showPendingWarn==="function"){
    showPendingWarn(layerWarning(), ()=>recoverDeleted(layer, true)); return;
  }
  if(layer>=2 && S.day===1){ toast("第1天异常尚浅，深层删除还封着——等到第2天深夜再试"); return; }
  if(layer>=2 && S.day===2 && !isLateNight() && S.hour<20){ toast("白天还算安全。建议等到深夜再挖更深的删除层"); return; }
  if(S.flags.deadBattery){ toast("没电了，先去安全区充电"); return; }
  const cost=[0,8,14,22][layer];
  if(S.battery<=cost+1){ toast("电量不足以恢复"); return; }
  drainBattery(cost);
  advanceTime(10*layer);
  S.deletedLayer=layer;
  gainAnomaly(layer);
  if(layer>=3) S.flags.deepRecovery=true;
  const texts=[
    "",
    "一层：一段被删的群通知——「今夜彩排取消。谁发的取消？不是制作组。」",
    "二层：语音残片……像 Hyunjae 的声线，但说着「别让她看见第三张」。她？",
    "三层：备忘录只剩一行："+(S.playerName||"？？")+" 会打开到这里。删除失败。删除失败。删除失败。"
  ];
  addRecord("已删除·第"+layer+"层", (typeof layersContent==="function"?layersContent(layer).join("\n"):texts[layer]));
  if(layer>=3 && typeof addRecord==="function"){
    addRecord("上一个失主", "残页里那个人也回过「在」。也在长椅坐过。最后一条「在吗」不是他发的。名字被划掉了——没人知道他是谁，也没人知道他后来去了哪里。");
  }
  addKeyword("删除层"+layer);
  if(layer>=2) S.emptyUnlocked=true;
  if(layer>=3 && isLateNight() && isLowBat()){
    // faceless prep
    gainAnomaly(2);
  }
  toast("恢复完成 · 电量-"+cost+"%");
  if(typeof explainDeletedLayer==="function") explainDeletedLayer(layer);
  else if(typeof showCluePopup==="function") showCluePopup("删除恢复 · 第"+layer+"层", texts[layer]||"残片已捞回。", {tag:"已删除"});
  if(layer===2 && typeof grantPasswordHintKeyword==="function"){ /* soft nudge toward deeper digits */ }
  render();
}

// —— Map travel ——
function travelTo(zid, confirmed){
  const z=ZONES.find(x=>x.id===zid);
  if(!z) return;
  if(zid==="empty" && !S.emptyUnlocked){ toast("尚未解锁"); return; }
  if(S.flags.deadBattery || S.battery<=0){
    if(z.charge){ chargeAtSafeZone(zid); return; }
    toast("没电了，只能挪去安全区充电"); return;
  }
  if(S.battery<3 && !z.charge){ toast("电量过低，请先前往安全区充电"); return; }
  if(!confirmed && typeof zoneWarning==="function"){
    const w = zoneWarning(zid);
    if(w){ showPendingWarn(w, ()=>travelTo(zid, true)); return; }
  }
  const risk = z.danger && isLowBat();
  const compFear = !!S.companion && ((COMP_ZONES[S.companion]||{}).fear||[]).indexOf(zid)>=0;
  drainBattery(risk?5:(S.companion && !compFear ? 2 : 3));
  if(S.flags.deadBattery || S.flags.ended) return;
  advanceTime(12);
  S.currentZone=zid;
  if(compFear) gainAnomaly(1);
  markZoneVisited(zid);
  if(zid==="night") S.flags.visitedNight=true;
  if(zid==="empty"){
    S.flags.visitedEmpty=true;
    gainAnomaly(2);
    if(isLowBat()||isLateNight()||S.day>=2){
      if(isLowBat()&&isLateNight()) drainBattery(8);
      addKeyword(S.playerName||"名字");
      addRecord("空地", areaText("empty"));
      maybeJumpFace("map");
    }
  }
  if(zid==="night" && (isLateNight()||S.day>=2||isLowBat())){
    gainAnomaly(1);
    maybeJumpFace("map");
  }
  if(zid==="photo" && S.day>=2){
    gainAnomaly(1);
    addKeyword("长椅凹陷");
    S.flags.day2PhotoVisit = true;
  }
  if(zid==="food" && S.day>=2){
    S.flags.day2FoodVisit = true;
    if(!S.records.some(r=>(r.title||"").includes("饮食"))) addRecord("饮食见闻", areaText("food"));
  }
  if(zid==="back" && S.day>=2) S.flags.day2BackVisit = true;
  if(zid==="carousel"){
    const _cp=(S.flags.carouselPass||0)+1;
    S.flags.carouselPass=_cp;
    if(_cp===3) addRecord("木马 · 第几次", carouselBody());
    if(_cp===5){ addKeyword("木马圈的圈数"); addRecord("木马 · 它一直在转", carouselBody()); }
    if(_cp>=2){
      setTimeout(function(){
        if(typeof toast==="function") toast("你绕木马走了一圈，回到入口。灯牌上的数字没变。");
        try{ if(navigator.vibrate) navigator.vibrate([10,50,14]); }catch(e){}
      }, 420);
    }
  }
  S.flags.travelCount=(S.flags.travelCount||0)+1;
  if((zid==="lot"||zid==="empty") && S.day>=3) S.flags.day3LotVisit = true;
  if(typeof checkQuestProgress==="function") checkQuestProgress();
  // ambient keyword
  if(anomalyLevel()>=2) addKeyword(z.name+"违和");
  renderArea(zid);
  autoSave({now:true});
  if(typeof maybeNightEvent==="function") setTimeout(function(){maybeNightEvent();}, 400);
}

function saveAreaRecord(zid){
  const z=ZONES.find(x=>x.id===zid);
  addRecord((z?z.name:"区域")+"见闻", areaText(zid));
}

function heartName(cid){ const c=CHARS.find(x=>x.id===cid); return c?c.name:"他"; }
function maybeHeart(cid, reply){
  if(cid==="unknown" || !reply || reply.noHeart) return;
  if(!CHARS.some(c=>c.id===cid)) return;
  if(S.flags.ended) return;
  if(typeof charPhase!=="function" || charPhase(cid)>=2) return;   // 后期交给惊悚
  if(typeof isLateNight==="function" && isLateNight()) return;      // 深夜是惊悚的地盘
  if(!S.heartSeen) S.heartSeen={};
  if(!S.heartDay) S.heartDay={};
  if(!S.replyCount) S.replyCount={};
  S.replyCount[cid]=(S.replyCount[cid]||0)+1;
  if(S.heartDay[cid]===S.day) return;                               // 每人每天至多一次
  if((S.heartSeen[cid]||0)>=3) return;
  // 保底：每第 3 次回复必定触发一条心动；其余 16% 概率
  const guaranteed=(S.replyCount[cid]%3===0);
  if(!guaranteed && Math.random()>=0.16) return;
  const idx=S.heartSeen[cid]||0;
  const beat=(HEART_BEATS[cid]||[])[idx];
  if(!beat) return;
  S.heartDay[cid]=S.day;
  S.heartSeen[cid]=idx+1;
  if(!S.chatLog[cid]) S.chatLog[cid]=[];
  S.chatLog[cid].push({from:"them",text:beat.text,type:"text",t:realTime(),heart:true,read:true});
  S.attention[cid]=(S.attention[cid]||0)+1;
  S.unread[cid]=(S.unread[cid]||0)+1;
  if(beat.item && typeof giveItem==="function" && !hasItem(beat.item)) giveItem(beat.item);
  toast("♡ "+heartName(cid)+" 顺手发来了一点小心动");
}

function pickCompReact(cid, zid){
  const R = COMP_ZONE_REACT[cid] || {};
  const z = ZONES.find(x=>x.id===zid);
  const keys=[];
  if(R[zid]) keys.push(zid);
  if(R.late && isLateNight()) keys.push("late");
  if(R.low && isCritBat()) keys.push("low");
  let pool;
  if(keys.length && Math.random()<0.78) pool = keys;
  else pool = Object.keys(R);
  if(!S.compSaid) S.compSaid={};
  const bag = S.compSaid[cid] || (S.compSaid[cid]=[]);
  const fresh = pool.filter(k=>bag.indexOf(k)<0);
  const use = fresh.length ? fresh : pool;
  const key = use[Math.floor(Math.random()*use.length)];
  bag.push(key);
  if(bag.length>5) bag.shift();
  return R[key] || (COMPANION_LINES[cid] && (COMPANION_LINES[cid].enter||[])[0]) || "";
}

  if(typeof anomalyLevel==="function" && anomalyLevel()>=3) return true;

  const z = COMP_ZONES[S.companion] || {};
  if((z.fear||[]).indexOf(zid)>=0) return "fear";
  if((z.home||[]).indexOf(zid)>=0) return "home";
  return "enter";
}

  return pool[Math.floor(Math.random()*pool.length)];
}

function npcSVG(npcId, cls){
  const d = NPC_DRAW[npcId];
  if(!d) return "";
  const uid = "np" + (++COMP_UID);
  return `<svg viewBox="0 0 140 176" class="npc-svg ${cls||""}" preserveAspectRatio="xMidYMax meet" aria-hidden="true">${d(uid)}</svg>`;
}

function npcLine(npcId){
  const a = NPC_ART[npcId];
  return a ? a.tag : "园区工作人员";
}

/* NPC 近看：先给你看一张正常的脸，两秒后再说清楚哪里不对 */
function openNpcCloseup(npcId){
  const a = NPC_ART[npcId];
  const n = (NPCS.find(function(x){return x.id===npcId;})||{}).name || "他";
  if(!a) return;
  const old = document.getElementById("npcClose");
  if(old) old.remove();
  const wrap = document.createElement("div");
  wrap.className = "npc-close-ov";
  wrap.id = "npcClose";
  wrap.innerHTML = `<div class="npc-close-card">
    <div class="npc-close-art">${npcSVG(npcId)}<div class="npc-close-mark"></div></div>
    <div class="npc-close-name">${esc(n)}<span>· ${esc(a.tag)}</span></div>
    <div class="npc-close-txt" id="npcCloseTxt">${esc(a.close.hint)}</div>
    <div class="npc-close-acts">
      <button class="nc-btn" id="npcCloseMore" onclick="npcCloseReveal('${npcId}')">再靠近一点看</button>
      <button class="nc-btn ghost" onclick="closeNpcCloseup()">不看了</button>
    </div>
  </div>`;
  document.getElementById("app").appendChild(wrap);
  if(typeof playUiSfx==="function") playUiSfx("map");
}

function npcCloseReveal(npcId){
  const a = NPC_ART[npcId];
  const card = document.querySelector("#npcClose .npc-close-card");
  const txt = document.getElementById("npcCloseTxt");
  const btn = document.getElementById("npcCloseMore");
  if(!a || !card) return;
  if(card.classList.contains("reveal")) return;
  card.classList.add("reveal");
  if(txt) txt.innerHTML = `<b>${esc(a.close.detail)}</b><br><span class="npc-note">${esc(a.close.note)}</span>`;
  if(btn) btn.textContent = "记下这一眼";
  if(btn) btn.setAttribute("onclick","npcCloseRecord('"+npcId+"')");
  gainAnomaly(1);
  if(typeof playScareSting==="function"){ try{ playScareSting(); }catch(e){} }
}

function npcCloseRecord(npcId){
  const a = NPC_ART[npcId];
  const n = (NPCS.find(function(x){return x.id===npcId;})||{}).name || "NPC";
  if(a) addRecord("NPC · " + n, a.close.detail + "\n" + a.close.note);
  if(a) addKeyword(npcId === "balloon" ? "袖口里的气球线" : (n + "·不对劲"));
  S.flags.npcLooked = S.flags.npcLooked || {};
  S.flags.npcLooked[npcId] = true;
  closeNpcCloseup();
  toast("已记入记录");
}

function closeNpcCloseup(){
  const el = document.getElementById("npcClose");
  if(el) el.remove();
}

/* ===================== 聊天头像：有公式照就用照片，没有就用假面 ===================== */
function faceSVG(cid){
  return companionSVG(cid, "comp-face", "16 42 88 88");
}
function avatarHTML(cid, size){
  const s = size || 48;
  return `<div class="face-slot" style="width:${s}px;height:${s}px">
    ${faceSVG(cid)}
    <img class="face-img" src="./avatars/${cid}.jpg" alt="" loading="lazy"
      onload="this.classList.add('on')" onerror="this.remove()">
  </div>`;
}

function companionDockHTML(zid){
  const c = companionChar();
  if(!c){
    return `<button class="comp-empty" onclick="openCompanionPicker('${zid}')">
      <span class="ce-plus">＋</span>
      <span class="ce-txt">叫上一个人陪你探查<em>他会走在你侧后方，替你看另一边</em></span>
    </button>`;
  }
  const a = COMP_ART[c.id] || {mask:""};
  const kind = compKind(zid);
  const eerie = compIsEerie();
  const line = kind==="fear" ? compLine(c.id, kind) : pickCompReact(c.id, zid);
  const extra = eerie ? `<br><i class="comp-glitch">${esc(compGlitchLine())}</i>` : "";
  return `<div class="comp-dock ${eerie?"eerie":""} ${kind==="fear"?"fear":""}">
    <div class="comp-art" onclick="companionSay('${zid}')">${companionSVG(c.id)}</div>
    <div class="comp-talk">
      <div class="comp-name"><b>${c.name}</b><span class="comp-mask">· ${esc(a.mask||"")}</span>
        <span class="comp-tag">${kind==="home"?"他熟这儿":kind==="fear"?"他不太想来":"同行"}</span></div>
      <div class="comp-line" id="compLine">${esc(line)}${extra}</div>
      <div class="comp-acts">
        <button class="chip" onclick="companionSay('${zid}')">让他说点什么</button>
        <button class="chip" onclick="openCompanionPicker('${zid}')">换人</button>
        <button class="chip" onclick="dismissCompanion()">让他留在原地</button>
      </div>
    </div>
  </div>`;
}

function companionSay(zid){
  const c = companionChar();
  if(!c) return;
  compMaybeSouvenir(c.id);
  const el = document.getElementById("compLine");
  if(!el) return;
  const kind = compKind(zid||S.currentZone);
  let html = esc(kind==="fear" ? compLine(c.id,"fear") : pickCompReact(c.id, zid||S.currentZone));
  if(compIsEerie() && Math.random()<0.35) html += `<br><i class="comp-glitch">${esc(compGlitchLine())}</i>`;
  el.style.opacity = "0";
  setTimeout(function(){ el.innerHTML = html; el.style.opacity = "1"; },120);
  if(typeof playUiSfx==="function") playUiSfx("tap");
}

/* —— 同行送的纪念品：同行时点他说话，每人限一次，两三个区基本能拿到 —— */
function compMaybeSouvenir(cid){
  if(!cid || cid==="unknown") return;
  if(!S.compKeep) S.compKeep={};
  if(S.compKeep[cid]) return;
  const item="keep_"+cid;
  if(typeof hasItem==="function" && hasItem(item)){ S.compKeep[cid]=1; return; }
  if(Math.random()>=0.34) return;
  S.compKeep[cid]=1;
  if(typeof giveItem==="function") giveItem(item);
  const c=CHARS.find(function(x){return x.id===cid;});
  if(typeof addRecord==="function") addRecord("♡ 同行的小心意", (c?c.name:"他")+"把一样小东西塞给了你。纪念品 +1（背包可见）。");
  toast("♡ "+(c?c.name:"他")+"把一样小东西塞给了你（背包可见）");
}

function dismissCompanion(){
  const c = companionChar();
  S.companion = null;
  toast(c ? c.name+" 留在原地了" : "已经没人跟着你");
  renderArea(S.currentZone);
}

function openCompanionPicker(zid){
  const zidSafe = zid || S.currentZone;
  const z = ZONES.find(function(x){return x.id===zidSafe;}) || {name:"园区"};
  const rows = CHARS.map(function(c){
    const a = COMP_ART[c.id] || {mask:""};
    const cz = COMP_ZONES[c.id] || {};
    const fear = (cz.fear||[]).indexOf(zidSafe)>=0;
    const home = (cz.home||[]).indexOf(zidSafe)>=0;
    const tag = fear ? `<span class="ptag no">他犹豫</span>` : home ? `<span class="ptag yes">他熟这儿</span>` : `<span class="ptag">可以</span>`;
    const sel = S.companion===c.id ? "sel" : "";
    const pv = compLine(c.id, fear?"fear":"enter");
    return `<button class="pick-row ${sel}" onclick="pickCompanion('${c.id}','${zidSafe}')">
      <div class="pick-art">${companionSVG(c.id)}</div>
      <div class="pick-txt">
        <div class="pick-name">${c.name}<span>· ${esc(a.mask||"")}</span></div>
        <div class="pick-line">${esc(pv)}</div>
      </div>${tag}</button>`;
  }).join("");
  const wrap = document.createElement("div");
  wrap.className = "pick-ov";
  wrap.id = "compPicker";
  wrap.innerHTML = `<div class="pick-sheet">
    <div class="pick-head">
      <div><div class="pick-kicker">COMPANION</div>
        <h3>谁陪你走这一趟</h3></div>
      <button class="pick-x" onclick="closeCompanionPicker()">✕</button>
    </div>
    <p class="pick-note">${esc(z.name)} · 他会站在你侧后方。人眼看不见的东西，他有时先看见；也有些不属于他的东西，会跟着他一起过来。</p>
    <div class="pick-list">${rows}</div>
    <button class="btn ghost" onclick="pickCompanion('','${zidSafe}')">一个人去（不带任何人）</button>
  </div>`;
  document.getElementById("app").appendChild(wrap);
}

function closeCompanionPicker(){
  const el = document.getElementById("compPicker");
  if(el) el.remove();
}

function pickCompanion(cid, zid){
  const zidSafe = zid || S.currentZone;
  closeCompanionPicker();
  S.companion = cid || null;
  if(cid){
    if(!S.flags.compUsed) S.flags.compUsed = [];

const LANTERN_FRAMES = [
  "灯亮起来的那一瞬，所有人都在笑。",

  "灯亮起来。这一格你见过。",
  "有人举着手机。这一次镜头对着你。",
  "长椅上那部手机。锁屏上是你的名字。",

];

function carouselLanternBtn(){
  const again=(S.flags.lanternSeen||0)>0;
  return `<button class="btn" style="width:100%;margin:0 0 8px;border-color:rgba(201,149,92,.35)" onclick="openLantern()">`
    + `<span style="color:#c9955c">🏮 ${again?"再跟着灯转一圈":"跟着灯转一圈 · 走马灯"}</span>`
    + `<br><small style="color:var(--muted);font-weight:400">八格。转完会回到第一格。</small></button>`;
}

function lanternRingSvg(idx){
  let seg="";
  for(let i=0;i<8;i++){
    const a0=(-90+i*45)*Math.PI/180, a1=(-90+(i+1)*45)*Math.PI/180;
    const x0=60+44*Math.cos(a0), y0=60+44*Math.sin(a0);
    const x1=60+44*Math.cos(a1), y1=60+44*Math.sin(a1);
    const on=i===(idx%8);
    seg+='<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A44 44 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+'" fill="none" stroke="'+(on?'#c9955c':'rgba(255,255,255,.13)')+'" stroke-width="'+(on?3:1.2)+'" stroke-linecap="round"/>';
  }
  return '<svg viewBox="0 0 120 120" style="width:104px;height:104px;flex:none">'
    + '<circle cx="60" cy="60" r="44" fill="none" stroke="rgba(255,255,255,.06)"/>'+seg
    + '<circle cx="60" cy="60" r="4" fill="rgba(201,149,92,'+(idx%8===0?'0.9':'0.35')+')"/></svg>';
}

function openLantern(){
  const again=(S.flags.lanternSeen||0)>0;
  const frames=again?LANTERN_FRAMES_AGAIN:LANTERN_FRAMES;
  S.flags.lanternSeen=(S.flags.lanternSeen||0)+1;
  let idx=0;
  const wrap=document.createElement("div");
  wrap.id="lanternWrap";
  wrap.style.cssText="position:fixed;inset:0;z-index:11000;background:rgba(4,3,4,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;backdrop-filter:blur(2px)";
  wrap.innerHTML='<div id="lanternBody" style="max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px"></div>';
  document.body.appendChild(wrap);
  if(typeof drainBattery==="function"){ try{ drainBattery(1); }catch(e){} }

  function paint(){
    const i=idx%8;
    const body=document.getElementById("lanternBody");
    if(!body) return;
    body.innerHTML = lanternRingSvg(i)
      + '<div style="font-size:11px;letter-spacing:.24em;color:rgba(201,149,92,.7)">第 '+(i+1)+' 格 / 8</div>'
      + '<p style="margin:0;text-align:center;font-size:15.5px;line-height:1.95;color:#ece7e0;min-height:88px">'+frames[i]+'</p>'
      + '<button class="btn ghost" style="margin-top:4px" onclick="closeLantern()">停下来</button>';
  }
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}

  window.__lanternPrev = window.__lanternPrev || document.getElementById("screen").innerHTML;
  paint();
  clearInterval(__lanternTimer);
  __lanternTimer=setInterval(function(){
    idx++;
    if(idx>=16){
      clearInterval(__lanternTimer); __lanternTimer=null;
      idx=16;
      const body=document.getElementById("lanternBody");
      if(body){
        body.innerHTML = lanternRingSvg(0)
          + '<p style="margin:0;text-align:center;font-size:15px;line-height:2;color:#ece7e0">第八格之后是第一格。灯没有停——<br>除非有人把灯关掉。</p>'
          + '<p class="muted" style="margin:0;text-align:center;font-size:12px">你看了两圈。两圈的内容一模一样。</p>'
          + '<button class="btn ghost" style="margin-top:6px" onclick="closeLantern()">关掉</button>';
        try{ if(navigator.vibrate) navigator.vibrate([12,60,12]); }catch(e){}
      }
      return;
    }
    paint();
  }, 1700);
}

function closeLantern(){
  clearInterval(__lanternTimer); __lanternTimer=null;
  const w=document.getElementById("lanternWrap");
  if(w) w.remove();
  if(typeof addRecord==="function"){
    try{ addRecord("木马 · 走马灯","灯里贴着一圈画。亮起来就一帧一帧转过去，转完回到第一格。八格，两圈，一模一样。"); }catch(e){}
  }
  try{ if(typeof gainAnomaly==="function") gainAnomaly(1); }catch(e){}
  if(typeof renderArea==="function" && S.currentZone==="carousel") renderArea("carousel");
}

function esc(s){

}

function tryEnding(reason){
  if(S.flags.ended) return;
  if(typeof syncAnomalyAlias==="function") syncAnomalyAlias();
  if(typeof markLateLock==="function") markLateLock();
  function go(kind){
    const run = ()=>triggerEnding(kind);
    if(typeof maybeExitChase==="function" && (kind==="safe"||kind==="deep"||String(kind).indexOf("char_")==0)){
      maybeExitChase(run);
    } else run();
  }
  // Hidden overwrite if unlocked
  if(S.hiddenUnlocked || checkHidden()){ go("hidden"); return; }
  if(reason==="char"){
    const lead = (typeof attentionLead==="function") ? attentionLead() : null;
    if(!lead){ toast("还没有哪一段对话压过别人。"); return; }
    go("char_"+lead); return;
  }
  if(reason==="leave_safe" || reason==="safe"){
    if(!(S.day<3 && S.deletedLayer<2 && S.flags.anomaliesSeen<6 && !S.lateLock)){
      toast("放不回去了。你看得太深。"); return;
    }
    S.flags.leftPark=true; go("safe"); return;
  }
  // Character exclusive auto
  const sorted=[...CHARS].sort((a,b)=>(S.attention[b.id]||0)-(S.attention[a.id]||0));
  const top=sorted[0]; const second=sorted[1];
  if((S.attention[top.id]||0)>=10 && (S.attention[top.id]-(S.attention[second.id]||0))>=5 && S.flags.anomaliesSeen>=2){
    go("char_"+top.id); return;
  }
  if(reason==="leave" || reason==="deep" || reason==="timeup"){
    if(reason!=="deep" && reason!=="leave" && S.flags.anomaliesSeen<=2 && S.deletedLayer===0 && S.flags.warningsIgnored<=1){
      go("safe"); return;
    }
    if(reason==="deep" || reason==="leave"){
      if(!(S.flags.anomaliesSeen>=4 || S.day>=2)){ toast("你几乎还没看见什么。"); return; }
    }
    S.flags.leftPark=true; go("deep"); return;
  }
}

/* —— 结局卡片：canvas 画一张竖版，长按存图就能发出去 —— */
function canvasWrap(g, text, maxW){
  const out=[]; let line="";
  for(const ch of String(text)){
    if(ch==="\n"){ out.push(line); line=""; continue; }
    const t=line+ch;
    if(g.measureText(t).width>maxW && line){ out.push(line); line=ch; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}

function leadTeaseHtml(){
  let done=0, lastNm="", nextPool=0;
  try{
    done=CHARS.filter(function(c){ return (leadHistoryOf(c.id).n||0)>0; }).length;
    const last=loadMeta().lastLead||"";
    if(last){ const c=CHARS.find(function(x){return x.id===last;}); lastNm=c?c.name:""; }
    const ids=CHARS.map(function(c){return c.id;});
    const times={}; let min=Infinity;
    ids.forEach(function(id){ times[id]=(leadHistoryOf(id).n)||0; if(times[id]<min) min=times[id]; });
    nextPool=ids.filter(function(id){ return times[id]===min && id!==last; }).length || ids.length;
  }catch(e){}
  if(done===0) return '<p class="intro-tips" style="margin-top:6px;opacity:.75">十个人都有可能丢这部手机。每一轮换一个人。</p>';
  return '<p class="intro-tips" style="margin-top:6px;opacity:.75">已经当过失主 '+done+'/10 位'

    + (done>=10?" · 一轮走完之后重新开始排。":(" · 下一位从剩下 "+nextPool+" 位里来。"))
    + '</p>';
}

/* —— 第四五天 · 剧本贴脸 ——
   这两次是剧情，不是随机：不吃 5 次上限，也不跟相册槽位抢。
   触发条件放宽到“晚上 + 关键节点”，因为到了第四五天，玩家很难真的熬到 22 点。 */
function scriptedFaceCheck(tab){
  if(!S || S.flags.ended) return;
  const day=S.day||1, h=S.hour||0;
  const d4 = (day===4) && (h>=19 || (h>=17 && S.flags.g10hot3));
  const d5 = (day===5) && (h>=18 || (h>=16 && S.flags.g10hot3));
  if(d4 && !S.flags.sp_facecg){
    S.flags.sp_facecg="pending";
    setTimeout(function(){
      const ok=imgJumpFace("facecg","album",true);
      if(!ok){ S.flags.sp_facecg=""; return; }
      S.flags.sp_facecg=1;
      try{ gainAnomaly(1); }catch(e){}
      try{ addRecord("深夜 · 不属于名单的脸","屏幕黑下去之前，有一张脸贴得很近，笑得很用力。十个人的名单里，没有这样一张脸。它笑的时候，像是在替谁练习。"); }catch(e){}
    },600);
    return;
  }
  if(d5 && !S.flags.sp_facecg5){
    S.flags.sp_facecg5="pending";
    setTimeout(function(){
      const ok=imgJumpFace("emptycg","album",true);
      if(!ok){ S.flags.sp_facecg5=""; return; }
      S.flags.sp_facecg5=1;
      try{ gainAnomaly(1); }catch(e){}
      try{ addRecord("最后一夜 · 木马不在了","相册自己跳了一下。木马不在园区里——它在栅栏外面那块空地上，鞍上没有人。草倒向四面，像刚散场。"); }catch(e){}
    },600);
  }
}
function gotoTab(tab){
  if(S.flags.deadBattery){ renderDeadBattery(); return; }
  if(typeof playUiSfx==="function") playUiSfx(tab==="home"?"home":tab);
  if(tab==="more"){ S.tab="more"; S.chatWith=null; render(); return; }
  if(tab==="play"){ renderPlayHub(); return; }
  if(tab==="inv"){ renderInventory(); return; }
  if(tab==="menu"){ openMenu(); return; }
  if(tab==="day"){ showDayCard(S.day,{instant:true}); return; }
  S.tab=tab; S.chatWith=null;
  if(typeof scriptedFaceCheck==="function") scriptedFaceCheck(tab);
  if(tab==="chat"){ ensureSeedChats(); tryPushNewBeats(); }
  drainBattery(0.5);
  advanceTime(1);
  if(S.flags.deadBattery || S.flags.ended) return;
  render();
  document.querySelectorAll(".dock button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab===tab || (tab==="home" && b.dataset.tab==="home"));
  });
}

function applyFlashSafe(){

  if(typeof maybeRealLateHook==="function") maybeRealLateHook();

  if(S.flags.ended){ renderEnding(S.flags.ending); return; }
  if(!S.flags.disclaimerOk){ renderDisclaimerGate(); return; }
  if(S.view==="intro"){ renderStoryIntro(); return; }
  if(!S.playerName || !S.identity){ renderSetup(); return; }
  if(S.flags.deadBattery){ renderDeadBattery(); return; }
  showPhone();

  switch(S.tab){
    case "chat": renderChatList(); break;
    case "album": renderAlbum(); break;

    case "records": renderRecords(); break;
    case "notes": renderNotes(); break;
    case "more": renderMore(); break;

    b.classList.toggle("active", b.dataset.tab===S.tab);
  });

function keepName(){

/* 选人页上的随机：交给轮值逻辑，保证不会是上一轮那位 */

function renderHiddenApp(){

  S.flags.hiddenOpened=true;
  const draw=function(){
    if(!S.flags.hiddenRecorded){
      S.flags.hiddenRecorded=true;
      try{ addRecord("隐藏文件夹","第四天以后才浮上来的东西。它给的东西，第五天也没给完。"); }catch(e){}
    }

      <button class="back-btn" onclick="S.tab='more';render()">← 更多</button>
      <h3 style="margin:10px 0 4px">？？？？？</h3>

      +'';
