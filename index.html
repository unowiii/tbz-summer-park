function checkQuestProgress() {
  gpInit();
  const qid = S.quests.active;
  if (!qid) return;
  const q = QUEST_DEFS.find((x) => x.id === qid);
  if (!q) return;
  const n = q.need || {};
  let ok = true;
  if (n.hotspot && !(S.hotspotsFound || []).includes(n.hotspot)) ok = false;
  if (n.chatFlag && !S.flags[n.chatFlag]) ok = false;
  if ((n.minigame === "silence" || n.minigame === "rhythm") && !( (S.gp.silenceWins||S.gp.rhythmWins||0) > 0 && S.flags.questRhythmDone)) ok = false;
  if (n.minigame === "match" && !( (S.gp.matchWins||0) > 0 && S.flags.questMatchDone)) ok = false;
  if (n.zoneVisit) {
    const vz = S.visitedZones || [];
    if (n.zoneVisit === "lot") {
      if (!vz.includes("lot") && !vz.includes("empty")) ok = false;
    } else if (!vz.includes(n.zoneVisit)) ok = false;
  }
  if (n.recordTitle && !(S.records || []).some((r) => (r.title || "").includes(n.recordTitle) || (r.title || "").includes("后台") || (r.title || "").includes("饮食"))) ok = false;
  if (n.flag && !S.flags[n.flag]) ok = false;
  if (!ok) return;
  completeQuest(qid);
}
function completeQuest(qid) {
  const q = QUEST_DEFS.find((x) => x.id === qid);
  if (!q || S.quests.done.includes(qid)) return;
  S.quests.done.push(qid);
  S.quests.active = null;
  const r = q.reward || {};
  if (r.item) giveItem(r.item);
  if (r.also) {
    giveItem(r.also);
    if (r.also === "staff_roster") giveDigit("6", "缺页花名册");
  }
  if (r.clue) {
    addKeyword(r.clue);
    addRecord("任务报酬·" + q.title, r.clue);
    if (typeof showCluePopup === "function") {
      showCluePopup("任务线索 · " + q.title, "报酬线索：" + r.clue + (r.digit ? ("\n同时摸到数字碎片「"+r.digit+"」——对照饮食/广播/后台/夜场的暗示拼密码。") : "") + "\n\n" + (q.npc || "NPC") + "：" + ((typeof PASSWORD_HINT_LINES==="object" && q.id==="q_aunt_msg" && PASSWORD_HINT_LINES.aunt) || (q.id==="q_dj_silence" && PASSWORD_HINT_LINES && PASSWORD_HINT_LINES.radio) || (q.id==="q_stage_back" && PASSWORD_HINT_LINES && PASSWORD_HINT_LINES.backstage) || "把线索记进备忘录与笔记。"), { tag: "任务" });
    }
  }
  if (r.digit) giveDigit(r.digit, q.npc || q.title);
  // quest-specific password flavor without dumping full code
  if (qid === "q_aunt_msg" && typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("aunt");
  if (qid === "q_dj_silence" && typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("radio");
  if (qid === "q_stage_back" && typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("backstage");
  if (r.bat) {
    S.battery = Math.min(100, S.battery + r.bat);
  }
  if (r.attn) Object.keys(r.attn).forEach((k) => (S.attention[k] = (S.attention[k] || 0) + r.attn[k]));
  if (r.unlockEmptyHint) {
    S.emptyUnlocked = true;
    toast("空地解锁提示已触发");
  }
  S.flags.anomaliesSeen++;
  toast("任务完成：" + q.title);
  if (typeof ambienceScareSting === "function" && Math.random() < 0.2) ambienceScareSting();
}

/* —— Minigames —— */
let _mg = null;

function startMinigame(kind) {
  gpInit();
  if (typeof ambienceUnlock === "function") ambienceUnlock();
  if (kind === "match") return startMatchGame();
  if (kind === "silence" || kind === "rhythm" || kind === "mute") return startSilenceGame();
  if (kind === "wave" || kind === "bars") return startWaveTapGame();
  if (kind === "swipe") return startSwipeGame();
  if (kind === "spot" || kind === "odd") return startSpotGame();
  if (kind === "light" || kind === "find") return startLightGame();
  toast("未知小游戏");
}

function startMatchGame() {
  // 4 pairs of clue emoji/tiles
  const faces = ["🔦", "🪑", "🎵", "💧", "🔦", "🪑", "🎵", "💧"];
  for (let i = faces.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [faces[i], faces[j]] = [faces[j], faces[i]];
  }
  _mg = { kind: "match", faces, open: [], matched: [], moves: 0, lock: false };
  renderMatchGame();
}
function renderMatchGame() {
  const screen = document.getElementById("screen");
  let tiles = "";
  _mg.faces.forEach((f, i) => {
    const matched = _mg.matched.includes(i);
    const open = _mg.open.includes(i);
    tiles += `<button class="mg-tile ${matched ? "matched" : ""} ${open ? "on" : ""}" onclick="matchFlip(${i})">${open || matched ? f : "·"}</button>`;
  });
  screen.innerHTML = `<div class="mg-wrap"><h3>线索配对</h3><p class="muted">翻开两张相同符号。失败扣电；成功得数字与关注。</p>
    <div class="mg-grid">${tiles}</div>
    <p class="muted">步数 ${_mg.moves}/12</p>
    <button class="btn ghost" onclick="S.tab='home';render()">放弃</button></div>`;
}
function matchFlip(i) {
  if (!_mg || _mg.kind !== "match" || _mg.lock) return;
  if (_mg.matched.includes(i) || _mg.open.includes(i)) return;
  _mg.open.push(i);
  renderMatchGame();
  if (_mg.open.length < 2) return;
  _mg.moves++;
  _mg.lock = true;
  const [a, b] = _mg.open;
  if (_mg.faces[a] === _mg.faces[b]) {
    _mg.matched.push(a, b);
    _mg.open = [];
    _mg.lock = false;
    if (_mg.matched.length >= 8) {
      // win
      S.gp.matchWins++;
      S.flags.questMatchDone = true;
      drainBattery(2);
      advanceTime(4);
      giveDigit("5", "配对小游戏");
      if (typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("match");
      giveItem("photo_scrap");
      if (!hasItem("lure_selfie") && Math.random() < 0.55) giveItem("lure_selfie");
      S.flags.anomaliesSeen++;
      if (S.ownerId) S.attention[S.ownerId] = (S.attention[S.ownerId] || 0) + 1;
      toast("配对成功 · 密码+5");
      addRecord("小游戏·配对", "四组线索对上了。边角碎片入手。");
      setTimeout(() => {
        S.tab = "home";
        render();
      }, 600);
      return;
    }
    renderMatchGame();
  } else {
    setTimeout(() => {
      _mg.open = [];
      _mg.lock = false;
      if (_mg.moves >= 12) {
        drainBattery(6);
        S.flags.anomaliesSeen++;
        toast("配对失败 · 电量-6%");
        S.tab = "home";
        render();
        return;
      }
      renderMatchGame();
    }, 450);
  }
}

function startSilenceGame() {

function onMuteSlider(v) {
  if (!_mg || _mg.kind !== "silence" || _mg.done) return;
  v = Math.max(0, Math.min(100, Number(v) || 0));
  _mg.vol = v;
  const fill = document.getElementById("muteFill");
  const pct = document.getElementById("mutePct");
  const hint = document.getElementById("muteHint");
  if (fill) fill.style.width = v + "%";
  if (pct) pct.textContent = v <= 0 ? "已静音" : ("噪音 " + v + "%");
  if (v <= 3) {
    // treat near-zero as muted (easy)
    if (!_mg.holding) {
      _mg.holding = true;
      _mg.hold = 0;
      if (hint) hint.textContent = "保持静音…";
      clearInterval(_mg.holdTimer);
      _mg.holdTimer = setInterval(() => {
        if (!_mg || _mg.kind !== "silence" || _mg.done) { clearInterval(_mg.holdTimer); return; }
        if (_mg.vol > 3) {
          _mg.holding = false;
          _mg.hold = 0;
          const hf = document.getElementById("muteHoldFill");
          if (hf) hf.style.width = "0%";
          if (hint) hint.textContent = "又响了——拖回最左";
          clearInterval(_mg.holdTimer);
          return;
        }
        _mg.hold += 100;
        const hf = document.getElementById("muteHoldFill");
        if (hf) hf.style.width = Math.min(100, (_mg.hold / 1000) * 100) + "%";
        if (_mg.hold >= 1000) {
          clearInterval(_mg.holdTimer);
          finishSilence(true);
        }
      }, 100);
    }
  } else {
    _mg.holding = false;
    _mg.hold = 0;
    clearInterval(_mg.holdTimer);
    const hf = document.getElementById("muteHoldFill");
    if (hf) hf.style.width = "0%";
    if (hint) hint.textContent = "向左拖到 0，停住别松…";

function startSwipeGame() {

    <button class="btn primary" onclick="puzzleSubmit()">尝试解锁</button>

    <div class="card" style="margin-top:8px;font-size:12px;line-height:1.55"><b>场内拼法提示</b><br>

function puzzlePush(d) {
  gpInit();
  const slots = S.puzzle.slots;
  const i = slots.findIndex((x) => !x);
  if (i < 0) {
    toast("已满，点格子可清除");
    return;
  }
  slots[i] = d;
  renderPuzzleBoard();
}
function puzzleClearSlot(i) {
  if (!S.puzzle.slots) return;
  S.puzzle.slots[i] = "";
  renderPuzzleBoard();
}
function puzzleSubmit() {
  gpInit();
  S.puzzle.attempt = (S.puzzle.attempt || 0) + 1;
  const code = (S.puzzle.slots || []).join("");
  drainBattery(2);
  // Exact only — red herrings 0/1/etc. sit in pool
  const lotCode = "2947";
  const l3Code = "5836";
  if (code === lotCode) {
    S.puzzle.unlockedLot = true;
    S.emptyUnlocked = true;
    toast("空地闸机打开");
    addRecord("密码·空地", "闸机咬合：2-9-4-7。");
    S.flags.anomaliesSeen++;
    renderPuzzleBoard();
    return;
  }
  if (code === l3Code) {
    S.puzzle.unlockedL3 = true;
    toast("删除第三层解锁");
    addRecord("密码·第三层", "锁芯承认 5-8-3-6。");
    S.flags.anomaliesSeen += 2;
    if (typeof maybeJumpFace === "function") maybeJumpFace("hidden");
    renderPuzzleBoard();
    return;
  }
  // near-miss feedback without spoiling
  if (code.length === 4) {
    const lotHit = [...lotCode].filter((ch, i) => code[i] === ch).length;
    const l3Hit = [...l3Code].filter((ch, i) => code[i] === ch).length;
    if (lotHit >= 2 || l3Hit >= 2) toast("有数字对上了位置——但整串还不对。");
    else if ([...code].some((ch) => lotCode.includes(ch) || l3Code.includes(ch))) toast("有的数见过，顺序或组合不对。");
    else toast("这串里干扰项太多。");
  } else toast("需要对满四位。");
  if (S.puzzle.attempt >= 4 && Math.random() < 0.55) {
    S.flags.anomaliesSeen++;
    if (typeof maybeJumpFace === "function") maybeJumpFace("status");
  }
  renderPuzzleBoard();
}

/* —— Timed night events —— */
let _nightTimer = null;
function maybeNightEvent() {
  gpInit();
  if (S.flags.ended || S.flags.deadBattery) return;
  if (!(typeof isLateNight === "function" && isLateNight())) return;
  if (S.day < 2) return;
  const key = "d" + S.day + "_h" + S.hour;
  if (S.gp.nightResolved[key]) return;
  if (S.gp.lastNightCheck && Date.now() - S.gp.lastNightCheck < 20000) return;
  // trigger when visiting night/empty or low bat at night
  const risky = S.currentZone === "night" || S.currentZone === "empty" || (typeof isLowBat === "function" && isLowBat());
  if (!risky && Math.random() > 0.25) return;
  S.gp.lastNightCheck = Date.now();
  S.gp.nightResolved[key] = "pending";
  showNightEvent(key);
}
function showNightEvent(key) {
  const n = S.playerName || "你";
  const bad = S.ownerAlign === "bad";
  const prompt = bad
    ? `夜风里有人用气音叫「${n}」。屏幕亮着。十秒内——`
    : `返送里有一句「别看了」。脚步在靠近。十秒内——`;
  const wrap = document.createElement("div");
  wrap.className = "night-event";
  wrap.id = "nightEvent";
  wrap.innerHTML = `<div class="sheet">
    <div class="cd" id="nightCd">10</div>
    <p style="line-height:1.7;margin:8px 0 12px">${esc(prompt)}</p>
    <button class="btn primary" onclick="resolveNightEvent('${key}','hide')">躲进阴影 / 扣上屏幕</button>
    <button class="btn" onclick="resolveNightEvent('${key}','answer')">回应（点名或回消息）</button>
    <button class="btn danger" onclick="resolveNightEvent('${key}','leave')">立刻离开这片区域</button>
  </div>`;
  document.getElementById("phone").appendChild(wrap);
  let left = 10;
  clearInterval(_nightTimer);
  _nightTimer = setInterval(() => {
    left--;
    const el = document.getElementById("nightCd");
    if (el) el.textContent = String(left);
    if (left <= 0) {
      clearInterval(_nightTimer);
      resolveNightEvent(key, "timeout");
    }
  }, 1000);
}
function resolveNightEvent(key, choice) {
  clearInterval(_nightTimer);
  const el = document.getElementById("nightEvent");
  if (el) el.remove();
  if (S.gp.nightResolved[key] && S.gp.nightResolved[key] !== "pending") return;
  S.gp.nightResolved[key] = choice;
  S.flags.nightEventDone = true;
  if (typeof checkQuestProgress === "function") checkQuestProgress();
  advanceTime(3);
  if (choice === "hide") {
    drainBattery(2);
    toast("你扣上屏幕。脚步停了一下，又走远。");
    addRecord("夜事件·躲", "阴影里有人经过。没有发现你——也许。");
    if (S.ownerAlign === "good" && S.ownerId) S.attention[S.ownerId] += 1;
  } else if (choice === "answer") {
    drainBattery(5);
    S.flags.anomaliesSeen += 2;
    S.flags.repliedAnomaly++;
    const n = S.playerName || "你";
    if (S.ownerId) {
      S.chatLog[S.ownerId].push({
        from: "them",
        text: S.ownerAlign === "bad" ? `${n}。我听见了。` : "……别答应。下次别答应。",
        type: "text",
        t: realTime(),
        anomaly: true,
      });
      S.unread[S.ownerId]++;
      S.attention[S.ownerId] = (S.attention[S.ownerId] || 0) + 2;
    }
    toast("你回应了。不该回应的。");
    if (typeof maybeJumpFace === "function") maybeJumpFace("chat");
    giveDigit("4", "夜巡问答");
    if (typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("night");
  } else if (choice === "leave") {
    drainBattery(4);
    S.currentZone = "food";
    markZoneVisited("food");
    toast("你撤到饮食区灯光下");
    addRecord("夜事件·撤", "跑开时广播少了一拍。");
    S.flags.warningsIgnored = Math.max(0, (S.flags.warningsIgnored || 1) - 1);
  } else {
    // timeout — bad
    drainBattery(10);
    S.flags.anomaliesSeen += 3;
    toast("你愣住了。什么东西已经站在光里。");
    if (typeof maybeJumpFace === "function") maybeJumpFace("map");
    S.flags.warningsIgnored++;
  }
  render();
}


/* —— 找出异常格（简单：3×3 点不同的那一格） —— */
function startSpotGame() {
  const icons = ["🔦", "🪑", "💧", "🎵", "📷", "🎫"];
  const base = icons[Math.floor(Math.random() * icons.length)];
  let odd = icons[Math.floor(Math.random() * icons.length)];
  while (odd === base) odd = icons[Math.floor(Math.random() * icons.length)];
  const oddIdx = Math.floor(Math.random() * 9);
  const cells = [];
  for (let i = 0; i < 9; i++) cells.push(i === oddIdx ? odd : base);
  _mg = { kind: "spot", cells, oddIdx, tries: 0, done: false };
  renderSpotGame();
}
function renderSpotGame() {
  const screen = document.getElementById("screen");
  let grid = "";
  _mg.cells.forEach((c, i) => {
    grid += `<button class="mg-tile" style="font-size:22px" onclick="spotPick(${i})">${c}</button>`;
  });
  screen.innerHTML = `<div class="mg-wrap"><h3>找出异常格</h3>
    <p class="muted">九格里有一格不一样。点中它即可。错 3 次失败。</p>
    <div class="mg-grid" style="grid-template-columns:repeat(3,1fr)">${grid}</div>
    <p class="muted">已试 ${_mg.tries}/3</p>
    <button class="btn ghost" onclick="S.tab='home';render()">放弃</button></div>`;
}
function spotPick(i) {
  if (!_mg || _mg.kind !== "spot" || _mg.done) return;
  if (i === _mg.oddIdx) {
    _mg.done = true;
    S.gp.spotWins = (S.gp.spotWins || 0) + 1;

    advanceTime(3);
    giveDigit("2", "异常格");
    if (typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("spot");
    if (S.ownerId) S.attention[S.ownerId] = (S.attention[S.ownerId] || 0) + 1;
    toast("找到了 · 密码+2");
    addRecord("小游戏·异常格", "九格里那一格不一样。像相册里多出来的影子。");
    S.flags.anomaliesSeen++;
    setTimeout(() => { S.tab = "home"; render(); }, 500);
  } else {
    _mg.tries++;

    if (_mg.tries >= 3) {

      if (typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("light");

window.injectDayEndMemo = function (day) {
  day = Math.min(Math.max(day || S.day, 1), 3);

  if (S.flags[key]) return;
  S.flags[key] = true;

  const table = LEAD_DAY_MEMOS[day] || {};
  let leadId = S.ownerId;
  if (!leadId || !table[leadId]) {
    const pool = Object.keys(table);
    if (!pool.length) return;
    leadId = pool[(day + (S.seed || 0)) % pool.length];
  }
  const text = table[leadId];
  if (!text) return;

  const memoKey = "memo_" + day + "_" + leadId;
  if (S.flags[memoKey]) return;
  S.flags[memoKey] = true;

  if (typeof addMemo === "function") addMemo(leadId, "", text);

  setTimeout(function () {
    showCluePopup("备忘录 · D" + day, text + "\n\n他没问你要不要看。", { tag: "他写进来的" });
  }, 600);
};

window.maybeExitChase = function (thenContinue) {
  if (S.flags._chaseResolved) {
    thenContinue();
    return;
  }
  const roll = Math.random();
  // ~58% chance a random member chases near successful exit
  if (roll > 0.58) {
    thenContinue();
    return;
  }
  S.flags._chaseResolved = true;
  const protect =
    typeof isChosenLeadGood === "function" && isChosenLeadGood() && S.ownerId;
  const pool = typeof CHARS !== "undefined" ? CHARS.slice() : [];
  let chaser = pool[Math.floor(Math.random() * Math.max(1, pool.length))] || { name: "???", emoji: "👤" };
  if (S.ownerId) {
    const others = pool.filter(function (c) { return c.id !== S.ownerId; });
    if (others.length) chaser = others[Math.floor(Math.random() * others.length)];
  }
  runChaseSpam(chaser.name || "???", chaser.emoji || "👤", !!protect, thenContinue);
};

  const iv = setInterval(function () {
    if (n >= max) {

      return;

    el.textContent = emoji + " " + phrases[n % phrases.length];

    el.style.transform = "rotate(" + (Math.random() * 16 - 8) + "deg)";
    el.style.fontSize = 12 + Math.floor(Math.random() * 10) + "px";
    layer.appendChild(el);
    if (typeof playScare === "function" && n % 3 === 0) playScare("glitch");
  }, 120);

  if (blocked) {
    const protector = typeof getChosenLeadChar === "function" ? getChosenLeadChar() : null;
    const pName = protector ? protector.name : "他";
    setTimeout(function () {
      const shield = document.createElement("div");
      shield.className = "chase-block";
      shield.innerHTML =
        "<b>" +
        esc(pName) +
        " 挡住了追击</b><br>红色弹窗被一层一层按灭。<br>「走。这次我护你。」";

      showCluePopup("好人护你", pName + " 拦下了 " + name + " 的追击。\n红色弹窗被压灭。你可以继续离开。", {
        tag: "保护",
      });
    }, 900);
    setTimeout(function () {
      layer.remove();
      thenContinue();
    }, 3200);
  } else {
    setTimeout(function () {
      const shield = document.createElement("div");
      shield.className = "chase-block";
      shield.style.background = "#3a0a0a";
      shield.style.borderColor = "#ff4444";
      shield.innerHTML =
        "<b>" +
        esc(name) +
        " 追到了出口</b><br>屏幕被红色塞满。<br>你还是挤了出去——心狂跳。";
      layer.appendChild(shield);
    }, 1600);
    setTimeout(function () {
      layer.remove();
      thenContinue();
    }, 3800);
  }
}

window.maybeLateGameLoops = function () {
  if (S.day < 2 || S.flags.ended) return;
  if (S.flags._lateLoopNote) return;
  if (S.keywords.length < 4 && S.deletedLayer < 1) return;
  S.flags._lateLoopNote = true;
  addRecord(
    "循环·夜未尽",
    "你发现主页多了可重复的小事：再听一次广播、再擦一次屏、再翻备忘录。线索弹窗会继续提醒你——不是没得玩，是要拼齐数字、看穿备忘录里的真话与假话。"
  );
};

window.runLateLoop = function (kind) {
  if (S.flags.ended || S.flags.deadBattery) return;
  drainBattery(2);
  advanceTime(8);
  if (kind === "radio") {
    addRecord("循环·广播", "副歌又缺了一拍。灯牌微微偏了一格——像在提醒你某个「九点」方位。");

    S.flags.anomaliesSeen++;
    if (typeof grantPasswordHintKeyword === "function") grantPasswordHintKeyword("radio", { silent: true });
  } else if (kind === "wipe") {
    addRecord("循环·擦屏", "血雾退开又覆上。角落刮痕仍在——像不肯被忘掉的笔画。");
    showCluePopup("再擦屏幕", "擦不干净。刮痕还在。\n你越擦，越觉得那像密码里的某一笔。", { tag: "内容循环" });
    S.flags.anomaliesSeen++;
  } else if (kind === "memo") {
    S.tab = "records";
    if (typeof injectDayEndMemo === "function") injectDayEndMemo(Math.min(S.day, 3));
    showCluePopup("翻备忘录", "男主留下的小作文还在。\n有的在护你，有的在留你，有的在骗你。\n对照任务与照片涂鸦，别只信情话。", { tag: "内容循环" });
    if (typeof renderRecords === "function") renderRecords();
    return;
  }
  if (typeof maybeOwnerPing === "function") maybeOwnerPing({});
  updateStatus();
  render();
};

function identityKey(){

function pickEndingBody(kind){
  const id=identityKey();
  const n=S.playerName||"你";
  let preface="";
  if(typeof refEndingBlurb==="function"){
    try{
      if(kind==="battery"){
        const b=refEndingBlurb("blackout");
        preface=(b.title?("【"+b.title+"】\n"):"")+(b.body||[]).join("\n")+"\n\n";
      } else if(kind==="safe"||kind==="deep"||kind==="hidden"){
        const b=refEndingBlurb(kind);
        preface=(b.title?("【"+b.title+"】\n"):"")+(b.body||[]).join("\n")+"\n\n";
      } else if(kind && kind.startsWith("char_")){
        const b=refEndingBlurb("char", kind.slice(5));
        preface=(b.title?("【"+b.title+"】\n"):"")+(b.body||[]).join("\n")+"\n\n";
      }
    }catch(e){}
  }
  if(kind==="safe"||kind==="deep"||kind==="battery"||kind==="hidden"){
    let t=(ENDING_TEXT[kind]||{})[id] || (ENDING_TEXT[kind]||{}).passerby || "";
    if(S.ownerId){
      const on=(CHARS.find(c=>c.id===S.ownerId)||{}).name||"失主";
      preface += (S.ownerAlign==="bad"
        ? `（结局：把你往里带的是 ${on}。）\n\n`
        : `（结局：想让你离开的是 ${on}。）\n\n`);
    }
    return preface+t.replace(/\{n\}/g, n);
  }
  if(kind && kind.startsWith("char_")){
    const cid=kind.slice(5);
    const base=CHAR_ENDING_BASE[cid]||"你与他的对话最多。离开时游乐场灯火依旧，答案依旧没有。";
    const coda=CHAR_ENDING_CODA[id]||"";
    return preface+base+coda+"\n\n（终局将揭晓失主与阵营。）";
  }

}

// —— Chat engine ——
function beatAvailable(b, cid){
  if(S.chatLog[cid].some(x=>x.beatId===b.id)) return false;
  if(S.day < (b.minDay||1)) return false;
  const ph=charPhase(cid);
  if(b.phase > ph) return false;
  if(b.phase < ph) return false; // only current phase beats
  if(b.reqAtt && (S.attention[cid]||0) < b.reqAtt) return false;
  if(b.reqNight && !isLateNight() && S.day<3) return false;
  return true;
}
function nextBeat(cid){
  const list=DIALOGUE[cid]||[];
  // prefer highest phase available
  const avail=list.filter(b=>beatAvailable(b,cid));
  if(!avail.length) return null;
  avail.sort((a,b)=>b.phase-a.phase || b.minDay-a.minDay);
  return avail[0];
}
function injectBeat(cid, beat){
  if(!beat) return;
  const ph=charPhase(cid);
  beat.lines.forEach(ln=>{
    let text=ln.text;
    if(text && text.indexOf("(名字)")>=0) text=text.replace("(名字)", S.playerName||"……");
    // time/battery variants
    if(isCritBat() && ln.from==="them" && ph>=1 && Math.random()<0.22){
      if(cid==="sunwoo") text += " 别笑了。";
      else if(cid==="eric") text += " 先走！！";
      else if(cid==="kevin") text += " 把声音关小。";
      else if(cid==="new") text += " 别出声。";
    }
    if(isLateNight() && ln.from==="them" && ph>=1 && Math.random()<0.35){
      if(cid==="q") text = String(text).replace(/[！!哈]/g,"");
      else if(cid==="eric") text = String(text).replace(/！/g,"。");
    }
    const msg={from:ln.from,text,type:ln.type||"text",t:realTime(),beatId:beat.id,read:true};
    // read glitch late
    if(ph>=2 && Math.random()<0.4){ msg.readGlitch=true; S.flags.readGlitch=true; }
    S.chatLog[cid].push(msg);
  });
  S.unread[cid]=(S.unread[cid]||0)+1;
}
function chatUnlockedIds(){
  const order=[];
  if(S.ownerId) order.push(S.ownerId);
  CHARS.forEach(c=>{ if(c.id!==S.ownerId) order.push(c.id); });
  const replied=CHARS.filter(c=>(S.chatLog[c.id]||[]).some(m=>m.from==="me")).length;
  let cap=S.day>=3?10:S.day>=2?7:3;
  cap=Math.min(10, cap+replied);
  return order.slice(0, cap);
}
function ensureSeedChats(){
  chatUnlockedIds().forEach(id=>{
    if(!S.chatLog[id]) S.chatLog[id]=[];
    if(S.chatLog[id].length===0){
      const b=nextBeat(id);
      if(b) injectBeat(id,b);
    }
  });
}
function tryPushNewBeats(){
  if((S.day||1)<2) return;
  if(typeof maybeOwnerPing==="function") maybeOwnerPing();
  // Day2/D3: male lead gets extra proactive beats
  if(S.ownerId && S.day>=2){
    const ob=nextBeat(S.ownerId);
    if(ob && (S.attention[S.ownerId]||0)>=(ob.reqAtt||0) && Math.random()<0.72){
      injectBeat(S.ownerId, ob);
    }
    if(typeof maybeOwnerPing==="function" && Math.random()<0.4) maybeOwnerPing({force: S.day>=3 && Math.random()<0.35});
  }
  const open=new Set(chatUnlockedIds());
  CHARS.forEach(c=>{
    if(!open.has(c.id)) return;
    if(S.ownerId && c.id===S.ownerId) return; // already handled
    const b=nextBeat(c.id);
    if(b && (S.attention[c.id]>=(b.reqAtt||0))){
      const boost = S.day>=2 ? 0.12 : 0;
      if(Math.random() < 0.35 + boost + Math.min(0.4, S.attention[c.id]*0.03)){
        injectBeat(c.id,b);
      }
    }
  });
}
function applyReply(cid, reply){
  S.chatLog[cid].push({from:"me",text:reply.label,type:"text",t:realTime()});
  if(cid==="jacob" && /水渍|柜台|饮食|手机/.test(reply.label||"")){ S.flags.toldJacobWater=true; if(typeof checkQuestProgress==="function") checkQuestProgress(); }
  S.attention[cid]=(S.attention[cid]||0)+(reply.att||0);
  if(reply.push) S.stage[cid]=Math.min(2,(S.stage[cid]||0)+reply.push);
  if(reply.anomaly){ S.flags.anomaliesSeen+=reply.anomaly; S.flags.repliedAnomaly++; }
  if(reply.warnIgnore) S.flags.warningsIgnored+=reply.warnIgnore;
  if(reply.kw) addKeyword(reply.kw);
  if(reply.saveRec) addRecord(reply.saveRec[0], reply.saveRec[1]);
  if(reply.type==="追问"||reply.type==="质疑") S.flags.proactiveCount++;
  drainBattery(1.5);
  advanceTime(5+Math.floor(Math.random()*8));
  const ph=charPhase(cid);
  let follow="";
  let followType="text";
  if(typeof pickReplyFromTable==="function"){
    const spoken = pickReplyFromTable(cid, reply.type||"追问");
    if(spoken && spoken.hold){
      S.chatLog[cid].push({from:"sys",text:"（已读 · 长时间未回复）",type:"sys",t:realTime()});
      tryChatJumpFace(cid);
      if(S.flags.anomaliesSeen>=3 && S.deletedLayer>=1) S.emptyUnlocked=true;
      const nb=nextBeat(cid);
      if(nb && Math.random()<0.5) injectBeat(cid,nb);
      return;
    }
    if(spoken && spoken.text==null){
      S.chatLog[cid].push({from:"sys",text:"（没有新的回复。）",type:"sys",t:realTime()});
      tryChatJumpFace(cid);
      if(S.flags.anomaliesSeen>=3 && S.deletedLayer>=1) S.emptyUnlocked=true;
      const nb=nextBeat(cid);
      if(nb && Math.random()<0.5) injectBeat(cid,nb);
      return;
    }
    if(spoken && spoken.text){ follow=spoken.text; followType=spoken.kind||"text"; if(spoken.anomaly) S.flags.anomaliesSeen++; }
  }
  if(!follow){
    if(ph>=2) follow = ({追问:"……你问太多了。",忽视:"……",安抚:"晚了。",质疑:"你以为质疑有用？"})[reply.type]||"……";
    else if(ph===1) follow = ({追问:"……以后再说。",忽视:"哦。",安抚:"嗯。",质疑:"……随你。"})[reply.type]||"……";
    else follow = ({追问:"……",忽视:"……",安抚:"……",质疑:"……"})[reply.type]||"……";
  }
  if(typeof ownerFlavorReply==="function") follow=ownerFlavorReply(cid, reply.type||"追问", follow);
  S.chatLog[cid].push({from:"them",text:follow,type:followType,t:realTime(),read:true});
  if(reply.type==="质疑" && follow && typeof addMemo==="function"){
    addMemo(cid,"矛盾","你问：「"+(reply.label||"")+"」\n他答：「"+follow+"」\n这句跟白天那一版对不上，先记着。");
  }
  if(typeof maybeAlignHint==="function") maybeAlignHint();
  tryChatJumpFace(cid);

  // maybe unlock empty
  if(S.flags.anomaliesSeen>=3 && S.deletedLayer>=1) S.emptyUnlocked=true;
  // next beat chance
  const nb=nextBeat(cid);
  if(nb && Math.random()<0.5) injectBeat(cid,nb);
}

function sendProactive(cid, pr){
  if(pr.needPhase!=null && charPhase(cid)<pr.needPhase){ toast("现在发太早了"); return; }
  S.flags.proactiveCount++;
  if(cid==="jacob") S.flags.toldJacobWater=true;
  applyReply(cid, {label:pr.label,type:pr.type,att:pr.att||1,anomaly:pr.anomaly||0,push:0});
  renderChat(cid);
}

function openChat(cid){
  if(typeof playUiSfx==="function") playUiSfx("chat");
  S.chatWith=cid;
  S.tab="chat";
  S.reread[cid]=(S.reread[cid]||0)+1;
  S.unread[cid]=0;
  // reread mutation
  if(S.reread[cid]>=3 && charPhase(cid)>=1){
    const log=S.chatLog[cid];
    const them=log.filter(m=>m.from==="them"&&m.type==="text");
    if(them.length && Math.random()<0.5){
      const last=them[them.length-1];
      if(!last.mutated){
        last.text = last.text + "｜……你又打开了。";
        last.mutated=true;
        S.flags.anomaliesSeen++;
        addKeyword("重读变异");
      }
    }
  }
  // ensure content
  if(S.chatLog[cid].length===0){ const b=nextBeat(cid); if(b) injectBeat(cid,b); }
  else {
    const b=nextBeat(cid);
    if(b && Math.random()<0.4) injectBeat(cid,b);
  }
  drainBattery(0.8);
  advanceTime(2);
  // opening late chat at night may flash
  if(charPhase(cid)>=1 && (isLateNight()||isLowBat())) tryChatJumpFace(cid);
  render();
}

function pendingReplies(cid){
  // find last beat that has replies and player hasn't replied after it
  const log=S.chatLog[cid];
  const beats=DIALOGUE[cid]||[];
  let lastBeatId=null;
  for(let i=log.length-1;i>=0;i--){
    if(log[i].beatId){ lastBeatId=log[i].beatId; break; }
  }
  if(!lastBeatId) return [];
  // if last messages include a me after that beat, no replies
  let beatIdx=-1;
  for(let i=0;i<log.length;i++){ if(log[i].beatId===lastBeatId) beatIdx=i; }
  const after=log.slice(beatIdx);
  if(after.some(m=>m.from==="me")) return [];
  const beat=beats.find(b=>b.id===lastBeatId);
  return beat? beat.replies: [];
}

// —— Deleted recovery ——
function recoverDeleted(layer, confirmed){
  if(S.deletedLayer>=layer) return;
  if(layer!==S.deletedLayer+1){ toast("需按层恢复"); return; }
  if(layer>=3 && !(S.puzzle && S.puzzle.unlockedL3) && S.flags.swipePassLayer!==3){
    toast("第三层被密码锁住 · 去玩法枢纽打开密码板"); return;
  }
  if(!confirmed && layer>=2 && typeof layerWarning==="function" && typeof showPendingWarn==="function"){
    showPendingWarn(layerWarning(), ()=>recoverDeleted(layer, true)); return;
  }
  if(layer>=2 && S.day===1){ toast("第1天异常尚浅，深层删除还封着——等到第2天深夜再试"); return; }
  if(layer>=2 && S.day===2 && !isLateNight() && S.hour<20){ toast("白天还算安全。建议等到深夜再挖更深的删除层"); return; }
  if(S.flags.deadBattery){ toast("没电了，先去安全区充电"); return; }
  const cost=[0,8,14,22][layer];
  if(S.battery<=cost+1){ toast("电量不足以恢复"); return; }
  drainBattery(cost);
  advanceTime(10*layer);
  S.deletedLayer=layer;
  S.flags.anomaliesSeen+=layer;
  if(layer>=3) S.flags.deepRecovery=true;
  const texts=[
    "",
    "一层：一段被删的群通知——「今夜彩排取消。谁发的取消？不是制作组。」",
    "二层：语音残片……像 Hyunjae 的声线，但说着「别让她看见第三张」。她？",
    "三层：备忘录只剩一行："+(S.playerName||"？？")+" 会打开到这里。删除失败。删除失败。删除失败。"
  ];
  addRecord("已删除·第"+layer+"层", (typeof layersContent==="function"?layersContent(layer).join("\n"):texts[layer]));
  addKeyword("删除层"+layer);
  if(layer>=2) S.emptyUnlocked=true;
  if(layer>=3 && isLateNight() && isLowBat()){
    // faceless prep
    S.flags.anomaliesSeen+=2;
  }
  toast("恢复完成 · 电量-"+cost+"%");
  if(typeof explainDeletedLayer==="function") explainDeletedLayer(layer);
  else if(typeof showCluePopup==="function") showCluePopup("删除恢复 · 第"+layer+"层", texts[layer]||"残片已捞回。", {tag:"已删除"});
  if(layer===2 && typeof grantPasswordHintKeyword==="function"){ /* soft nudge toward deeper digits */ }
  render();
}

// —— Map travel ——
function travelTo(zid, confirmed){
  const z=ZONES.find(x=>x.id===zid);
  if(!z) return;
  if(zid==="empty" && !S.emptyUnlocked){ toast("尚未解锁"); return; }
  if(S.flags.deadBattery || S.battery<=0){
    if(z.charge){ chargeAtSafeZone(zid); return; }
    toast("没电了，只能挪去安全区充电"); return;
  }
  if(S.battery<3 && !z.charge){ toast("电量过低，请先前往安全区充电"); return; }
  if(!confirmed && typeof zoneWarning==="function"){
    const w = zoneWarning(zid);
    if(w){ showPendingWarn(w, ()=>travelTo(zid, true)); return; }
  }
  const risk = z.danger && isLowBat();
  const compFear = !!S.companion && ((COMP_ZONES[S.companion]||{}).fear||[]).indexOf(zid)>=0;
  drainBattery(risk?5:(S.companion && !compFear ? 2 : 3));
  if(S.flags.deadBattery || S.flags.ended) return;
  advanceTime(12);
  S.currentZone=zid;
  if(compFear) S.flags.anomaliesSeen=(S.flags.anomaliesSeen||0)+1;
  markZoneVisited(zid);
  if(zid==="night") S.flags.visitedNight=true;
  if(zid==="empty"){
    S.flags.visitedEmpty=true;
    S.flags.anomaliesSeen+=2;
    if(isLowBat()||isLateNight()||S.day>=2){
      if(isLowBat()&&isLateNight()) drainBattery(8);
      addKeyword(S.playerName||"名字");
      addRecord("空地", areaText("empty"));
      maybeJumpFace("map");
    }
  }
  if(zid==="night" && (isLateNight()||S.day>=2||isLowBat())){
    S.flags.anomaliesSeen++;
    maybeJumpFace("map");
  }
  if(zid==="photo" && S.day>=2){
    S.flags.anomaliesSeen++;
    addKeyword("长椅凹陷");
    S.flags.day2PhotoVisit = true;
  }
  if(zid==="food" && S.day>=2){
    S.flags.day2FoodVisit = true;
    if(!S.records.some(r=>(r.title||"").includes("饮食"))) addRecord("饮食见闻", areaText("food"));
  }
  if(zid==="back" && S.day>=2) S.flags.day2BackVisit = true;
  if((zid==="lot"||zid==="empty") && S.day>=3) S.flags.day3LotVisit = true;
  if(typeof checkQuestProgress==="function") checkQuestProgress();
  // ambient keyword
  if(anomalyLevel()>=2) addKeyword(z.name+"违和");
  renderArea(zid);
  if(typeof maybeNightEvent==="function") setTimeout(function(){maybeNightEvent();}, 400);
}

function saveAreaRecord(zid){
  const z=ZONES.find(x=>x.id===zid);
  addRecord((z?z.name:"区域")+"见闻", areaText(zid));
}

function companionChar(){
  if(!S.companion) return null;
  return CHARS.find(function(c){return c.id===S.companion;}) || null;
}
function compIsEerie(){
  if(typeof anomalyLevel==="function" && anomalyLevel()>=3) return true;
  if(typeof isLateNight==="function" && isLateNight()) return true;
  return (S.flags.anomaliesSeen||0)>=11;
}
function compKind(zid){
  const z = COMP_ZONES[S.companion] || {};
  if((z.fear||[]).indexOf(zid)>=0) return "fear";
  if((z.home||[]).indexOf(zid)>=0) return "home";
  return "enter";
}
function compLine(cid,kind){
  const L = COMPANION_LINES[cid];
  if(!L) return "";
  const pool = L[kind] || L.enter || [""];
  return pool[Math.floor(Math.random()*pool.length)];
}
function compGlitchLine(){
  return COMP_GLITCH[Math.floor(Math.random()*COMP_GLITCH.length)];
}

function ambientSound(zid){
  const lv=anomalyLevel();
  if(zid==="night"&&lv>=2) return "不完整的副歌循环，像磁带被咬住。";
  if(zid==="empty") return "很静。静得能听见自己的吞咽，以及另一次吞咽。";
  if(zid==="photo"&&lv>=1) return "远处有快门声，但拍照区没有别人。";
  if(zid==="back"&&lv>=1) return "灯管的电流声，偶尔像耳语。";
  if(zid==="fountain") return lv>=2 ? "水声忽然断一拍，又接上。" : "细碎水声，偶尔硬币落水。";
  if(zid==="carousel") return lv>=2 ? "音乐盒停在同一拍，像卡住。" : "木马轴轻轻吱呀。";
  if(zid==="ticket") return lv>=2 ? "闸机嘀了一声，没人刷卡。" : "远处广播与风。";
  if(lv>=3) return "耳机没戴，却有一层很薄的白噪。";
  return "人群、音乐、夏夜的风。表面正常。";
}

function tapHotspot(pid){
  const p=PHOTOS.find(x=>x.id===pid);
  if(!p||!p.hotspot) return;
  const h=p.hotspot;
  drainBattery(2);
  advanceTime(2);
  markHotspot(h.id||p.id);
  addKeyword(h.clue);
  const body = h.body || h.clue;
  addRecord("照片·"+p.title, body+(h.anomaly?"（异常）":""));
  if(typeof showCluePopup==="function"){
    showCluePopup("照片线索 · "+p.title, body+(h.anomaly?"\n\n（异常感上升）":"")+"\n\n已写入记录。对照备忘录与密码板场内暗示。", {tag:"相册热点", scare: h.anomaly?"glitch":null});
  }
  // discoverable digit graffiti on certain photos
  const digitPhotoHints = {
    "bench:dent": {d:"2", line:"长椅凹陷旁有人用汽水渍点出「二」——像在教你数第一位。"},
    "stage:gap": {d:"9", line:"舞台缝隙反光停在灯牌「九」点方位。"},
    "lot:gap": {d:"4", line:"停车场缺口的编号牌缺了一角，残笔像「四」。"},
    "back:schedule": {d:"3", line:"日程擦痕最深的一笔弯成「三」。"},
  };
  const dh = digitPhotoHints[h.id||p.id] || digitPhotoHints[p.id];
  if(dh && !S.flags["photoDigit_"+dh.d]){
    S.flags["photoDigit_"+dh.d]=true;
    addRecord("照片涂鸦·"+dh.d, dh.line);
    if(typeof showCluePopup==="function"){
      setTimeout(()=>showCluePopup("照片里的数字痕迹", dh.line+"\n\n这不是完整密码，只是碎片。去任务与小游戏里找其余位。", {tag:"密码暗示"}), 400);
    }
  }
  if(h.anomaly) S.flags.anomaliesSeen++;
  if((h.face || h.scare || (h.anomaly && S.day>=2)) && !S.jumpUsed.album){
    if(maybeJumpFace("album")){
      S.flags.faceAlbumDone=true;
      S.flags.anomaliesSeen++;
    }
  }
  if(h.chain && h.chainText){
    const cid=h.chain;
    if(S.chatLog[cid]){
      S.chatLog[cid].push({from:"them",text:h.chainText,type:"text",t:realTime(),anomaly:!!h.anomaly});
      S.unread[cid]=(S.unread[cid]||0)+1;
      S.attention[cid]=(S.attention[cid]||0)+1;
      toast((CHARS.find(c=>c.id===cid)||{}).name+" 发来消息");
    }
  } else if(h.anomaly){
    const targets=["younghoon","new","q","sunwoo"];
    const cid=targets[Math.floor(Math.random()*targets.length)];
    const ph=charPhase(cid);
    const msgs=["你看到了？","……别点那里。","那张，不要放大。","你还在翻相册。"];
    S.chatLog[cid].push({from:"them",text:msgs[Math.min(ph+1,msgs.length-1)],type:"text",t:realTime()});
    S.unread[cid]++;
    toast(CHARS.find(c=>c.id===cid).name+" 发来消息");
  } else {
    toast("发现："+h.clue);
  }
  // show body toast
  if(h.body) setTimeout(()=>toast(h.body.slice(0,36)+(h.body.length>36?"…":"")), 400);
  if(typeof checkQuestProgress==="function") checkQuestProgress();
  if(typeof maybeGiveHotspotEvidence==="function") maybeGiveHotspotEvidence(pid, h);
}
function maybeGiveHotspotEvidence(pid, h){
  if(typeof giveItem!=="function") return;
  const map={
    "bench:dent":"warn_note",
    "food:phone":"blood_ticket",
    "night:sign":"demo_chip",
    "back:schedule":"staff_roster",
    "lot:gap":"lure_selfie",
    "stage:mic":"ink_stamp",
    "stage:gap":"cracked_balloon",
    "h7":"quiet_earbud"
  };
  const id=map[h.id||pid];
  if(id && typeof hasItem==="function" && !hasItem(id) && (h.anomaly || Math.random()<0.75)){
    giveItem(id);
    const nm=(typeof ITEM_DEFS!=="undefined"&&ITEM_DEFS[id])?ITEM_DEFS[id].name:id;
    toast("拾取证据："+nm);
    if(id==="staff_roster" && typeof giveDigit==="function"){ giveDigit("6","缺页花名册"); if(typeof grantPasswordHintKeyword==="function") grantPasswordHintKeyword("roster"); }
  }
  // scattered extras
  if((h.id||pid)==="stage:gap" && typeof giveItem==="function" && !hasItem("mirror_shard")){
    giveItem("mirror_shard");
  }
  if((h.id||pid)==="back:schedule" && typeof giveItem==="function" && !hasItem("sticky_pass")){
    giveItem("sticky_pass");
  }

function tryEnding(reason){
  if(S.flags.ended) return;
  if(typeof syncAnomalyAlias==="function") syncAnomalyAlias();
  if(typeof markLateLock==="function") markLateLock();
  function go(kind){
    const run = ()=>triggerEnding(kind);
    if(typeof maybeExitChase==="function" && (kind==="safe"||kind==="deep"||String(kind).indexOf("char_")==0)){
      maybeExitChase(run);
    } else run();
  }
  // Hidden overwrite if unlocked
  if(S.hiddenUnlocked || checkHidden()){ go("hidden"); return; }
  if(reason==="char"){
    const lead = (typeof attentionLead==="function") ? attentionLead() : null;
    if(!lead){ toast("还没有哪一段对话压过别人。"); return; }
    go("char_"+lead); return;
  }
  if(reason==="leave_safe" || reason==="safe"){
    if(!(S.day<3 && S.deletedLayer<2 && S.flags.anomaliesSeen<6 && !S.lateLock)){
      toast("放不回去了。你看得太深。"); return;
    }
    S.flags.leftPark=true; go("safe"); return;
  }
  // Character exclusive auto
  const sorted=[...CHARS].sort((a,b)=>(S.attention[b.id]||0)-(S.attention[a.id]||0));
  const top=sorted[0]; const second=sorted[1];
  if((S.attention[top.id]||0)>=10 && (S.attention[top.id]-(S.attention[second.id]||0))>=5 && S.flags.anomaliesSeen>=2){
    go("char_"+top.id); return;
  }
  if(reason==="leave" || reason==="deep" || reason==="timeup"){
    if(reason!=="deep" && reason!=="leave" && S.flags.anomaliesSeen<=2 && S.deletedLayer===0 && S.flags.warningsIgnored<=1){
      go("safe"); return;
    }
    if(reason==="deep" || reason==="leave"){
      if(!(S.flags.anomaliesSeen>=4 || S.day>=2)){ toast("你几乎还没看见什么。"); return; }
    }
    S.flags.leftPark=true; go("deep"); return;
  }
}

      <p>所以「手机是谁的」，要到最后一刻才有答案。</p></div>

    <div class="lore-sec"><h4>三层<span class="tag">越看越深</span></h4>
      <p>第一层是记录：他们说的话。<br>第二层是校对：同一件事说两遍，第二遍更短。<br>第三层是署名：有人在念你的名字。</p>
      <p>每往下一层，园区就多认你一分。看到第三层，「把手机放回长椅」这件事就做不到了。</p></div>

    <div class="lore-sec"><h4>电量<span class="tag">额度</span></h4>
      <p>右上角那个数字不是电池。那是今晚你还剩多少「被看清」的额度。</p>
      <p>充电点是园区允许你慢一点的地方。耗到零，你既放不回去，也带不走。</p></div>

    <div class="lore-sec"><h4>假面与岗<span class="tag">他们是谁</span></h4>
      <p>他们不是鬼。他们是以前也被这一夜留下过的人。</p>
      <p>园区给每人一个岗位：广播、检票、取景、充电、木马、副歌。守住岗位，就不会被收走。</p>
      <p>入场时他们给你的是<b>假面</b>——自己起的，还想着当人；结局才会说<b>岗</b>——园区给的，早就不太像人。</p></div>

    <div class="lore-sec"><h4>好与坏<span class="tag">同一岗位</span></h4>
      <p>同一个岗位有两种守法：拿它护着你，或者拿它留住你。</p>
      <p>区别只在他希望你尽快走出去，还是让你再看一层。这一点在结局之前，连他自己都不一定清楚。</p></div>

    <div class="lore-sec"><h4>园丁<span class="tag">不领岗</span></h4>
      <p>园区里只有一个东西不领岗。它不出现，只维护：剪短副歌、修坏灯牌、擦干净空着的那个座位。</p>
      <p>它要的不是人，是「完整」——一首完整的歌，一张全员照，一个填满的位子。所以凡是缺口，都是它的手笔。</p></div>

    <div class="lore-sec"><h4>空地<span class="tag">不在图上</span></h4>
      <p>栅栏外那片草地不在图上，因为它还不是园区，是还没被写成景的空白。</p>
      <p>进去要四位数字，四个数从不放在一起：柜台的水渍里一个，灯牌静音时停住的那一格一个，夜巡老人哼的拍子里一个，玻璃擦开血雾的那一角一个。</p>
      <p>要按「先水、再灯、再拍子、最后擦」的顺序填。顺序错了它不响，只是当你没来过。走进去的人会被写进去，成了明年园里的一处景。</p></div>

    <div class="lore-sec"><h4>三条铁律<span class="tag">入口木牌</span></h4>
      <ul class="lore-list">
        <li><b>别答应风里的名字。</b></li>
        <li><b>木马空着的那个座，不要坐。</b></li>
        <li><b>灯灭之前，回到有人的地方。</b></li>
      </ul></div>

    <div class="lore-sec"><h4>今晚怎么过</h4>
      <p>主页那张卡片是今晚唯一要做的事。回一个人，才会亮起下一个人。</p>
      <p>夜里十一点以后，话会变短。看得越深，越难放回去。</p></div>

    <button class="btn primary" onclick="closeLoreBook()">知道了，回去</button>
  </div>`;
}
function closeLoreBook(){
  if(S.view==="intro"){ renderStoryIntro(); return; }
  if(S.view==="phone"){ renderMore(); return; }
  S.view="title"; renderSetup();
}

function showPhone(){
  document.getElementById("dock").style.display="grid";
  document.getElementById("menuBtn").style.display="block";
  S.view="phone";
  updateStatus();
}
function gotoTab(tab){
  if(S.flags.deadBattery){ renderDeadBattery(); return; }
  if(typeof playUiSfx==="function") playUiSfx(tab==="home"?"home":tab);
  if(tab==="more"){ S.tab="more"; S.chatWith=null; render(); return; }
  if(tab==="play"){ renderPlayHub(); return; }
  if(tab==="inv"){ renderInventory(); return; }
  if(tab==="menu"){ openMenu(); return; }
  if(tab==="day"){ showDayCard(S.day,{instant:true}); return; }
  S.tab=tab; S.chatWith=null;
  if(tab==="chat"){ ensureSeedChats(); tryPushNewBeats(); }
  drainBattery(0.5);
  advanceTime(1);
  if(S.flags.deadBattery || S.flags.ended) return;
  render();
  document.querySelectorAll(".dock button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab===tab || (tab==="home" && b.dataset.tab==="home"));
  });
}

function render(){
  if(typeof syncAnomalyAlias==="function") syncAnomalyAlias();
  if(typeof markLateLock==="function") markLateLock();
  updateStatus();
  if(S.flags.ended){ renderEnding(S.flags.ending); return; }
  if(!S.flags.disclaimerOk){ renderDisclaimerGate(); return; }
  if(S.view==="intro"){ renderStoryIntro(); return; }
  if(!S.playerName || !S.identity){ renderSetup(); return; }
  if(S.flags.deadBattery){ renderDeadBattery(); return; }
  showPhone();
  if(S.chatWith){ renderChat(S.chatWith); return; }
  switch(S.tab){
    case "chat": renderChatList(); break;
    case "album": renderAlbum(); break;
    case "map": renderMap(); break;
    case "records": renderRecords(); break;
    case "notes": renderNotes(); break;
    case "more": renderMore(); break;
    default: renderHome();
  }
  document.querySelectorAll(".dock button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab===S.tab);
  });
}

function renderChat(cid){
  const c=CHARS.find(x=>x.id===cid);
  const log=S.chatLog[cid]||[];
  const replies=pendingReplies(cid);
  const ph=charPhase(cid);
  let bubbles="";
  log.forEach(m=>{
    if(m.from==="sys"){ bubbles+=`<div class="bubble sys">${esc(m.text)}</div>`; return; }
    const side=m.from==="me"?"me":"them";
    if(m.type==="voice"){
      bubbles+=`<div class="bubble ${side} voice" onclick='toast(${JSON.stringify("（播放）"+m.text)});drainBattery(0.5)'>
        <span class="wave">🔊 ～～～</span><span style="font-size:12px">${esc(m.text)}</span></div>`;
    } else if(m.type==="image"){
      bubbles+=`<div class="bubble ${side} img"><div style="padding:20px;background:#111;border-radius:10px;font-size:12px;color:#666">${esc(m.text)}</div></div>`;
    } else {
      const glitch = m.from==="me" && ph>=2 && isLowBat();
      const read = m.from==="me" ? `<div class="read ${glitch?"glitch":""}">${glitch?"已读 · ？？:？？":"已读"}</div>` : "";
      bubbles+=`<div class="bubble ${side}">${esc(m.text)}${read}</div>`;
    }
  });
  let choiceHtml="";
  if(replies.length){
    choiceHtml=`<div class="choices"><p class="muted">回复方式影响关注值与阶段</p>`;
    replies.forEach((r,i)=>{
      choiceHtml+=`<button class="choice-btn" onclick="chooseReply('${cid}',${i})">［${r.type}］${esc(r.label)}</button>`;
    });
    choiceHtml+=`</div>`;
  }
  let proHtml = (S.day>=2) ? `<details class="proactive"><summary>想多说一句（第二天起）</summary>` : "";
  if(S.day>=2){
    PROACTIVE.forEach(pr=>{
      if(pr.needPhase && charPhase(cid)<pr.needPhase) return;
      proHtml+=`<button class="choice-btn" style="margin:4px 0" onclick="sendProactive('${cid}',PROACTIVE.find(x=>x.id==='${pr.id}'))">${esc(pr.label)}</button>`;
    });
    proHtml+=`</details>`;
  }
  if(cid==="jacob" && S.quests && S.quests.active==="q_aunt_msg"){
    proHtml+=`<button class="choice-btn" onclick="S.flags.toldJacobWater=true;applyReply('jacob',{label:'阿姨说柜台上还有水渍',type:'追问',att:1});if(typeof checkQuestProgress==='function')checkQuestProgress();renderChat('jacob')">［任务］转告：柜台还有水渍</button>`;
  }
  if(cid==="kevin" && typeof hasItem==="function" && hasItem("tape")){
    proHtml+=`<button class="choice-btn" onclick="useItem('tape',{cid:'kevin'});renderChat('kevin')">［物品］播放录音碎片</button>`;
  }
  document.getElementById("screen").innerHTML=`
    <div class="chat-header">
      <button class="back-btn" onclick="S.chatWith=null;S.tab='chat';render()">←</button>
      <div class="avatar" style="background:${c.color};width:36px;height:36px">${avatarHTML(c.id,36)}</div>
      <div><b>${c.name}</b><div class="muted">阶段 ${["前期","中期","后期"][ph]} · 关注 ${S.attention[cid]||0}</div></div>
    </div>
    <div class="bubbles">${bubbles}</div>
    ${choiceHtml}${proHtml}`;
  // scroll bottom
  const sc=document.getElementById("screen"); sc.scrollTop=sc.scrollHeight;
}
function chooseReply(cid, idx){
  const replies=pendingReplies(cid);
  const r=replies[idx];
  if(!r) return;
  applyReply(cid,r);
  // offer safe stop once
  if(S.flags.anomaliesSeen>=4 && !S.flags.safeStopOffered && S.flags.warningsIgnored===0){
    S.flags.safeStopOffered=true;
  }
  renderChat(cid);
  if(checkHidden()){ triggerEnding("hidden"); }
}

  addRecord("相机·"+g.title,g.body);
  addKeyword("相机·"+g.title);
  if(g.scare) S.flags.anomaliesSeen++;
  if(g.digit){
    addRecord("相机·数字痕迹",g.title+"：「"+g.digit+"」。取景框里才是正的。");
    addKeyword("密码"+g.digit);
  }
  if(typeof showCluePopup==="function"){
    showCluePopup("相机 · "+g.title,g.body+(g.scare?"\n\n（异常感上升）":"")+(g.digit?("\n\n取景框角落有一个手写的「"+g.digit+"」，肉眼看不见。"):"")+"\n\n已写入记录。",{tag:"只有相机看得见",scare:g.scare?"glitch":null});
  }
  if(g.scare && typeof maybeJumpFace==="function" && Math.random()<0.5) maybeJumpFace("hidden");
  renderArea(zid);
}

function renderNotes(){
  if(typeof playUiSfx==="function") playUiSfx("notes");
  const screen=document.getElementById("screen");
  let html=`<h3>线索笔记</h3><p class="muted">园区里的关键词。他的事不在这里——他写在备忘录里。</p><div style="margin:10px 0">`;
  if(!S.keywords.length) html+=`<span class="muted">对话、热点、区域异常会留下关键词。</span>`;
  S.keywords.forEach(k=>{ html+=`<span class="kw">${esc(k)}</span>`; });
  html+=`</div>
  <div class="card"><p class="muted">关注值最高：</p>`;
  const sorted=[...CHARS].sort((a,b)=>(S.attention[b.id]||0)-(S.attention[a.id]||0)).slice(0,3);
  sorted.forEach(c=>{ html+=`<div>${c.emoji} ${c.name} · ${S.attention[c.id]||0}</div>`; });
  html+=`<p class="muted" style="margin-top:8px">异常感知 ${S.flags.anomaliesSeen} · 无视警告 ${S.flags.warningsIgnored} · 主动/追问 ${S.flags.proactiveCount}</p></div>`;
  // safe leave hint
  html+=`<div class="card" style="margin-top:10px"><p class="muted">三日结构</p>
    <p style="font-size:12px;line-height:1.65;margin-top:6px">
    <b>第1天</b> ${DAY_INFO[1].tone}<br>
    <b>第2天</b> ${DAY_INFO[2].tone}<br>
    <b>第3天</b> ${DAY_INFO[3].tone}
    </p></div>`;
  if(S.flags.safeStopOffered){
    html+=`<div class="alert-banner">你可以选择现在离开游乐场（菜单 / 主页），走向安全向结局。</div>`;
  }
  screen.innerHTML=html;
}

  let html=clips.map((c,i)=>`<div class="frag"><div class="ft">${esc(c.name)} · ${esc(c.meta)}</div>${esc(c.note)}

function playRecorderClip(i){
  drainBattery(2);
  advanceTime(1);
  if(i===1 && S.day>=2){
    S.flags.anomaliesSeen++;
    addKeyword("无声口型");
    toast("……什么也没听见。电量却掉了。");
    if(typeof ambienceScareSting==="function") ambienceScareSting();
  } else if(i===0){
    toast("风声。像喷泉停了一拍。");
  } else {
    toast("空白。录音灯却亮过。");
    S.flags.anomaliesSeen++;
  }
}

window.onload=()=>{
  S=defaultState();
  if(typeof syncAnomalyAlias==="function") syncAnomalyAlias();
  render();
  setInterval(()=>{
    if(S.flags.ended||!S.playerName) return;
    updateStatus();
    if(typeof tryStatusJumpFace==="function" && S.battery<28 && Math.random()<0.08) tryStatusJumpFace();
    if(typeof maybeOwnerPing==="function") maybeOwnerPing({fromTimer:true});
  }, 4000);
};
