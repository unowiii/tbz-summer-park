  if(!ov){
    ov=document.createElement("div"); ov.id="guideOverlay";
    ov.innerHTML='<div class="gb" onclick="closeGuide()"></div>'
      +'<div class="bx"><button class="x" onclick="closeGuide()">×</button>'

/* —— 新手指引：五步，按玩家实际行为自动推进 —— */
function guideState(){
  const p=routeSnapshot();
  const f=S.flags;
  if(f.guideDone) return {done:true,step:5};
  let step=0;
  if(p.replied.length>=1) step=1;
  if(step===1&&(S.visitedZones||[]).length>=2) step=2;
  if(step===2&&p.hot>=1) step=3;
  if(step===3&&f.openedInv&&f.openedMemo) step=4;
  if(step===4&&S.day>=2) step=5;
  if(step>=5){ f.guideDone=true; return {done:true,step:5}; }
  return {done:false,step};
}
const GUIDE_STEPS=[
  {t:"回一条消息",d:"点开「聊天」，选一个回复选项。选了才算推进，不选聊天不会动。",go:"chat",label:"去聊天"},
  {t:"去一个地方",d:"打开「地图」，选一个区域走进去。灯亮的地方先去，电量低就顺便充电。",go:"map",label:"打开地图"},

  {t:"撑到第二天",d:"把时间过到夜里，再熬过凌晨。第二天会解锁更多人和更多东西。",go:"leave",label:"我知道了"}

function guideHtml(){
  const g=guideState();
  if(g.done) return "";
  const s=GUIDE_STEPS[g.step]||GUIDE_STEPS[0];
  return `<div class="card" style="border:1px solid rgba(93,173,226,.4)">
    <div class="sk">新手指引 · 第 ${g.step+1}/5 步</div>
    <h3>${esc(s.t)}</h3>
    <p class="muted" style="margin:6px 0">${esc(s.d)}</p>
    <div style="display:flex;gap:8px;align-items:center">
      ${s.go?`<button class="btn primary" onclick="goGuideStep(${g.step})">${esc(s.label)}</button>`:""}
      <button class="btn ghost" style="margin-left:auto" onclick="S.flags.guideDone=true;autoSaveNow();render()">跳过指引</button>
    </div>

function goGuideStep(i){
  if(i===0){ gotoTab("chat"); return; }
  if(i===1){ gotoTab("map"); return; }
  if(i===2){ gotoTab("album"); return; }
  if(i===3){ S.flags.guideDone=true; renderInventory(); return; }
  S.flags.guideDone=true; render();
}


/* ============================================================
   主页进度面板：把「我走到哪了」写成看得见的数字
   ============================================================ */
function pgMeter(label, val, total, onclick, extraCls){
  const done = val>=total;
  const w = Math.max(3, Math.min(100, Math.round(val/Math.max(total,1)*100)));
  return `<div class="prog-row ${done?"done":""} ${extraCls||""}" onclick="${onclick}">
    <div class="pr-t"><span>${esc(label)}</span><b>${val}/${total}</b></div>
    <div class="prog-bar"><i style="width:${w}%"></i></div>
  </div>`;
}
function progressPanelHtml(){
  if(S.flags.ended) return "";
  try{
    const p=routeSnapshot();
    const cap=dayCap();
    const day=Math.min(S.day||1,cap);
    const dayPct=Math.max(6,Math.round(day/Math.max(cap,1)*100));
    const fold=!!S.flags.progFold;
    const step=nextStep();
    const notes=triAllNotes().length;
    const hot=Math.min(6,p.hot||0);
    const del=Math.min(3,S.deletedLayer||0);
    const dig=Math.min(4,(S.digits||[]).length);
    let rows="";
    rows+=pgMeter("已发现异常",notes,3,"renderCrookBoard()");
    rows+=pgMeter("已回的人",p.replied.length,10,"gotoTab('chat')");
    rows+=pgMeter("相册线索",hot,6,"gotoTab('album')");
    if(day>=2) rows+=pgMeter("密码数字",dig,4,"renderPuzzleBoard()");
    if(day>=2) rows+=pgMeter("删除层",del,3,"renderDeleted()");
    if(day>=4) rows+=pgMeter("隐藏文件",Object.keys(S.flags.hiddenRead||{}).length,6,"renderHiddenApp()");
    return `<div class="prog-card ${fold?"fold":""}">
      <div class="prog-h" onclick="S.flags.progFold=!S.flags.progFold;autoSaveNow();render()">
        <span>本局进度</span><span><b>第 ${day}/${cap} 天</b><span class="pg-f">　${fold?"展开":"收起"} ${fold?"⌄":"⌃"}</span></span>
      </div>
      <div class="prog-daybar"><i style="width:${dayPct}%"></i></div>
      <div class="prog-goal"><span>当前目标 · </span>${esc(step.title)}</div>
      <div class="prog-grid">${rows}</div>

  }catch(e){ return ""; }

function runHintHtml(){
  if(S.flags.ended) return "";
  try{
    const n=ngRunNo();
    if(n<1){
      if((S.day||1)<2) return "";
      return '<div class="ng-card locked" onclick="renderRunArchive()">'
        +'<div class="ng-h">🔒 下一轮才给看</div>'
        +'<div class="ng-b">通关一次之后，有几段话才会浮上来。手机里还留着不属于这一轮的聊天记录——它比你早到。</div>'
        +'<div class="ng-go">看看还差什么 ›</div></div>';
    }
    const seen=ngSeenMap();
    const pills=NG_DIALOGUES.map(function(d){
      return `<span class="ng-pill ${seen[d.id]?"on":""}">${seen[d.id]?"✓":"○"} ${esc(d.title)}</span>`;
    }).join("");
    const got=NG_DIALOGUES.filter(function(d){return !!seen[d.id];}).length;

      <div class="ng-b">${got>0?"已经有人认出你了。剩下的还在等各自的时辰。":"这一轮，他们说的话会和上次不一样。先回一个人试试。"}</div>

      <div class="ng-go">轮次档案 · 已解锁 ${got}/${NG_DIALOGUES.length} ›</div>

  }catch(e){ return ""; }

function groupSender(id){
  if(id===GROUP_GHOST) return {name:"…",color:"#191920",emoji:"▢",ghost:true};

function pushGroup(who,text,type){
  if(!S.chatLog) S.chatLog={};
  if(!S.chatLog[GROUP_ID]) S.chatLog[GROUP_ID]=[];
  const isSys = who==="sys" || type==="sys";
  const msg={
    from: isSys?"sys":(who==="me"?"me":"them"),
    who: who,
    text: text,
    type: isSys?"sys":(type||"text"),
    t: realTime(),
    at: absMin(),
    read: true
  };
  S.chatLog[GROUP_ID].push(msg);
  if(!isSys && who!=="me") S.unread[GROUP_ID]=(S.unread[GROUP_ID]||0)+1;
  return msg;
}
function ensureGroupSeed(){
  if(!S.chatLog) S.chatLog={};
  if(!S.chatLog[GROUP_ID]) S.chatLog[GROUP_ID]=[];
  if(S.flags.groupSeeded) return;
  S.flags.groupSeeded=true;
  GROUP_SEED.forEach(x=>{
    S.chatLog[GROUP_ID].push({from:x.who==="sys"?"sys":(x.who===GROUP_ADMIN?"them":"them"),who:x.who,text:x.text,type:x.type||(x.who==="sys"?"sys":"text"),t:x.t,read:true});
  });
  S.unread[GROUP_ID]=3;
}
/* 每次进群推进一小段当天的新消息 */
function groupTick(){
  const day=Math.min(3, S.day||1);
  if(S.flags.groupDay!==day){ S.flags.groupDay=day; S.flags.groupStep=0; }
  const pool=GROUP_DAILY[day]||[];
  let step=S.flags.groupStep||0;
  if(step>=pool.length) return;
  const n=Math.min(pool.length-step, 1+(Math.random()<0.4?1:0));
  for(let i=0;i<n;i++){
    const it=pool[step+i];
    if(!it) break;
    pushGroup(it.who,it.text,it.who==="sys"?"sys":null);
    if(it.who===GROUP_GHOST && /移出群聊/.test(it.text||"")) S.flags.groupGhostGone=true;
    if(/已被移出群聊/.test(it.text||"")) S.flags.groupGhostGone=true;
  }
  S.flags.groupStep=Math.min(pool.length, step+n);
}

/* ---------- 消息撤回：他等你回，等到不耐烦就把话收回去 ---------- */
function recallWindow(){
  const d=S.day||1;
  // 按“动作次数”折算成分钟，不能写死分钟——每天流速不同，写死会让第三天变成两三步就撤回
  const acts = d>=3 ? 8 : 12;   // 他愿意等几个动作
  return Math.round(acts*10*timeMult());
}
function maybeRecall(cid){
  if(cid===GROUP_ID || cid==="unknown") return false;
  const log=S.chatLog[cid];
  if(!log||!log.length) return false;
  let idx=-1;
  for(let i=log.length-1;i>=0;i--){
    if(log[i].from==="me") return false;      // 你已经回过了
    if(log[i].from==="them"){ idx=i; break; }
  }
  if(idx<0) return false;
  const m=log[idx];
  if(m.recalled || m.type==="voice" || m.type==="image") return false;
  if(m.at==null) return false;
  if(absMin()-m.at <= recallWindow()) return false;
  m.recalled=true;
  m.recalledText=m.text;
  m.text="撤回了一条消息";
  m.type="recalled";
  if(m.beatId){
    S.flags.recalledBeat=S.flags.recalledBeat||{};
    S.flags.recalledBeat[cid]=m.beatId;
  }
  S.flags.recallCount=(S.flags.recallCount||0)+1;
  S.flags.lastRecallAt=absMin();
  return true;
}

/* ---------- 嫌疑对质：你标了他，他会察觉 ---------- */
function maybeConfront(cid){
  try{ triSuspect(cid,1); }catch(e){}
  if(cid===GROUP_ID || cid==="unknown") return false;
  if(S.day<2) return false;                          // 第一天还没那么敏感
  const acc=S.flags.accused;
  if(!acc || acc[cid]==null) return false;
  if((S.flags.confrontDone||{})[cid]) return false;
  if(absMin()-acc[cid] < Math.round(10*timeMult())) return false;              // 刚标完不会立刻被察觉（约一个动作）
  S.flags.confrontDone=S.flags.confrontDone||{};
  S.flags.confrontDone[cid]=true;
  const isOwner=(cid===S.ownerId);
  const align=S.ownerAlign||"base";
  let lines=[], gain=0, rec=null;
  if(isOwner && align==="keep"){
    lines=["你刚才在我背后站了很久。",
           "那个板子上，你把我放到坏的那一边了。",
           "没关系。你放得对。",
           "……所以你更要跟紧我。坏的那一边，至少是真的。"];
    gain=3; rec=["对质·他","你标了他。他没有否认，反而靠得更近。"];
    addMemo&&addMemo(cid,"对质","我把他标成了坏人。他说：你放得对。");
  }else if(isOwner){
    lines=["……你把我也划进去了？",
           "我不问为什么。",
           "但如果你要查，从我自己开始查。这样公平。",
           "前台抽屉里有一本登记簿，最后几页是空的。去翻吧。"];
    gain=1; rec=["对质·他","你标了他。他退开半步，然后自己把路让开了。"];
  }else{
    const fake=FAKE_PARK_ROLES&&FAKE_PARK_ROLES[cid];
    if(fake){
      lines=["听说你在查我们。","为什么是我。",
             "……行。那我告诉你一件真的：喷泉底下有东西，是那台机器不敢让人看的。",
             "信不信随你。反正你已经标了。"];
      rec=["对质·"+cid,"你标了他。他给了一条听起来很真的线索——真假未验证。"];
      addKeyword("未验证线索");
    }else{
      lines=["……为什么是我。","我什么都不知道。","我只想在这待到闭园。"];
      rec=["对质·"+cid,"你标了他。他慌了。不像装的。"];
      gain=0;
    }
  }
  lines.forEach(t=>S.chatLog[cid].push({from:"them",text:t,type:"text",t:realTime(),at:absMin(),read:true}));
  S.attention[cid]=(S.attention[cid]||0)+gain;
  if(isOwner && align==="keep") gainAnomaly(1);
  if(rec) addRecord(rec[0],rec[1]);
  addKeyword("被察觉");
  return true;
}

function answerCallback(zid){

  const okCount=(S.flags.callCorrect||0);
  if(right){

/* 四种园区环境声，现场合成，不加载音频文件 */
function playAmbienceScene(kind){
  const ac=voiceCtx();
  if(!ac) return;
  const now=ac.currentTime;
  const dur=3.4;
  const master=ac.createGain();
  master.gain.setValueAtTime(0,now);
  master.gain.linearRampToValueAtTime(0.22,now+0.3);
  master.gain.setValueAtTime(0.22,now+dur-0.5);
  master.gain.linearRampToValueAtTime(0,now+dur);
  master.connect(ac.destination);

  if(kind==="fountain"){
    const buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){
      const t=i/ac.sampleRate;
      d[i]=(Math.random()*2-1)*(0.5+0.5*Math.sin(t*2.1));
    }
    const src=ac.createBufferSource(); src.buffer=buf;
    const bp=ac.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=900; bp.Q.value=0.6;
    src.connect(bp); bp.connect(master); src.start(now); src.stop(now+dur);
  }else if(kind==="carousel"){
    const notes=[880,784,659,659,659,587];
    notes.forEach((f,i)=>{
      const o=ac.createOscillator(); o.type="triangle"; o.frequency.value=f;
      const g=ac.createGain();
      const st=now+0.15+i*0.42;
      g.gain.setValueAtTime(0,st);
      g.gain.linearRampToValueAtTime(0.16,st+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,st+0.4);
      o.connect(g); g.connect(master); o.start(st); o.stop(st+0.42);
    });
  }else if(kind==="back"){
    const o=ac.createOscillator(); o.type="sawtooth"; o.frequency.value=58;
    const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=260;
    const g=ac.createGain(); g.gain.value=0.5;
    o.connect(lp); lp.connect(g); g.connect(master); o.start(now); o.stop(now+dur);
    // 铁皮上的脚步
    [1.1,1.9,2.6].forEach(t=>{
      const b=ac.createBuffer(1,Math.ceil(ac.sampleRate*0.09),ac.sampleRate);
      const dd=b.getChannelData(0);
      for(let i=0;i<dd.length;i++){ dd[i]=(Math.random()*2-1)*(1-i/dd.length); }
      const s=ac.createBufferSource(); s.buffer=b;
      const hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1400;
      const gg=ac.createGain(); gg.gain.value=0.5;
      s.connect(hp); hp.connect(gg); gg.connect(master);
      s.start(now+t); s.stop(now+t+0.09);
    });
  }else{
    const o=ac.createOscillator(); o.type="sine"; o.frequency.value=112;
    const g=ac.createGain(); g.gain.value=0.18;
    o.connect(g); g.connect(master); o.start(now); o.stop(now+dur);
    // 很远的掌声
    [0.9,1.7,2.4,2.9].forEach((t,i)=>{
      const b=ac.createBuffer(1,Math.ceil(ac.sampleRate*0.12),ac.sampleRate);
      const dd=b.getChannelData(0);
      for(let j=0;j<dd.length;j++){ dd[j]=(Math.random()*2-1)*Math.exp(-j/900); }
      const s=ac.createBufferSource(); s.buffer=b;
      const bp2=ac.createBiquadFilter(); bp2.type="bandpass"; bp2.frequency.value=2200; bp2.Q.value=0.9;
      const gg=ac.createGain(); gg.gain.value=0.28-i*0.05;
      s.connect(bp2); bp2.connect(gg); gg.connect(master);
      s.start(now+t); s.stop(now+t+0.12);
    });
  }
}

/* 聊天列表排序：谁最近有动静谁在上面。不按成员顺序固定，避免看位置就猜到是谁。 */
function chatSortKey(id){
  const log=S.chatLog[id]||[];
  if(!log.length) return null;
  const last=log[log.length-1];
  const m=String(last.t||"").match(/^(\d{1,2}):(\d{2})$/);
  const nowMin=(S.hour||0)*60+(S.minute||0);
  let mins;
  if(m){
    mins=parseInt(m[1],10)*60+parseInt(m[2],10);
    if(mins>nowMin+180) mins-=1440; // 明显晚于当前时间 → 是昨天留下的
  }else{
    mins=nowMin-1500;             // “三天前”这类残留记录沉到底
  }
  return {mins, n:log.length};
}
function renderChatList(){
  ensureSeedChats();
  ensureGroupSeed();
  const screen=document.getElementById("screen");
  let html=`<h3 style="margin-bottom:8px">聊天</h3><p class="muted" style="margin-bottom:8px">${S.ownerId?"没说话的在下面。过了凌晨，他会在聊天里给你写一段很长的话。":"只有一个号码。别的，还没有出现。"}</p>`;
  // 未知号码和所有成员一起排队：按最后一条消息的时间倒序，没消息的沉底
  const rows=[];
  if((S.chatLog.unknown||[]).length) rows.push({id:"unknown", key:chatSortKey("unknown")});
  rows.push({id:GROUP_ID, key:chatSortKey(GROUP_ID)});
  if(S.ownerId) CHARS.forEach(c=>rows.push({id:c.id, key:chatSortKey(c.id)}));
  rows.sort((a,b)=>{
    if(a.key && b.key) return (b.key.mins-a.key.mins) || (b.key.n-a.key.n);
    if(a.key) return -1;
    if(b.key) return 1;
    return 0; // 都没消息：保持原顺序（稳定排序）
  });
  rows.forEach(r=>{
    if(r.id==="unknown"){
      const ulog=S.chatLog.unknown||[];

        if(last.from==="sys"||last.type==="sys") gPrev=last.text||"";

    const c=CHARS.find(x=>x.id===r.id);

      html+=`<div class="chat-row" style="opacity:.38"><div class="avatar" style="background:#333">${avatarHTML(c.id,44)}</div><div class="chat-meta"><div class="name">${c.name}</div><div class="prev">还没出现</div></div></div>`;

function renderChat(cid){
  if(cid===GROUP_ID){ renderGroupChat(); return; }
  const c=CHARS.find(x=>x.id===cid)||(cid==="unknown"?UNK_META:null);
  if(!c){ S.chatWith=null; S.tab="chat"; render(); return; }
  const log=S.chatLog[cid]||[];
  const replies=(cid==="unknown")?[]:pendingReplies(cid);
  const ph=(cid==="unknown")?0:charPhase(cid);
  let bubbles="";
  log.forEach(m=>{
    if(m.from==="sys"){ bubbles+=`<div class="bubble sys">${esc(m.text)}</div>`; return; }
    const side=m.from==="me"?"me":"them";
    if(m.type==="recalled"){
      bubbles+=`<div class="bubble ${side} recalled" onclick="toast('晚了')">撤回了一条消息</div>`;
      return;
    }
    if(m.type==="voice"){
      bubbles+=`<div class="bubble ${side} voice" onclick='playVoiceNote(this,${JSON.stringify(m.text||"")})'>
        <span class="wave">🔊 ～～～</span><span style="font-size:12px">${esc(m.text)}</span></div>`;
    } else if(m.type==="image"){
      bubbles+=`<div class="bubble ${side} img"><div style="padding:20px;background:#111;border-radius:10px;font-size:12px;color:#666">${esc(m.text)}</div></div>`;
    } else {
      const glitch = m.from==="me" && ph>=2 && isLowBat();
      const read = m.from==="me" ? `<div class="read ${glitch?"glitch":""}">${glitch?"已读 · ？？:？？":"已读"}</div>` : "";
      const heartStyle = m.heart ? ' style="border-color:rgba(232,161,92,.55);background:rgba(232,161,92,.07)"' : "";
      bubbles+=`<div class="bubble ${side}"${heartStyle}>${m.heart?"<span style=\"color:#e8a15c;font-size:11px\">♡</span> ":""}${esc(m.text)}${read}</div>`;
    }
  });
  let choiceHtml="";
  if(replies.length){
    choiceHtml=`<div class="choices"><p class="muted">回复方式影响关注值与阶段</p>`;
    replies.forEach((r,i)=>{
      choiceHtml+=`<button class="choice-btn" onclick="chooseReply('${cid}',${i})">［${r.type}］${esc(r.label)}</button>`;
    });
    choiceHtml+=`</div>`;
  }
  if(cid==="unknown" && (S.unkStep||0)<UNK_PRO.length && UNK_PRO[S.unkStep||0]){
    choiceHtml=`<div class="choices"><p class="muted">好坏不明。但它知道你在看。</p>`;
    UNK_PRO[S.unkStep||0].replies.forEach((r,i)=>{
      choiceHtml+=`<button class="choice-btn" onclick="chooseReply('unknown',${i})">［${r.type}］${esc(r.label)}</button>`;
    });
    choiceHtml+=`</div>`;
  }
  let proHtml = (S.day>=2 && cid!=="unknown") ? `<details class="proactive"><summary>想多说一句（第二天起）</summary>` : "";
  if(S.day>=2 && cid!=="unknown"){
    PROACTIVE.forEach(pr=>{
      if(pr.needPhase && charPhase(cid)<pr.needPhase) return;
      proHtml+=`<button class="choice-btn" style="margin:4px 0" onclick="sendProactive('${cid}',PROACTIVE.find(x=>x.id==='${pr.id}'))">${esc(pr.label)}</button>`;
    });
    proHtml+=`</details>`;
  }
  if(cid==="jacob" && S.quests && S.quests.active==="q_aunt_msg"){
    proHtml+=`<button class="choice-btn" onclick="S.flags.toldJacobWater=true;applyReply('jacob',{label:'阿姨说柜台上还有水渍',type:'追问',att:1});if(typeof checkQuestProgress==='function')checkQuestProgress();renderChat('jacob')">［任务］转告：柜台还有水渍</button>`;
  }
  if(cid==="kevin" && typeof hasItem==="function" && hasItem("tape")){
    proHtml+=`<button class="choice-btn" onclick="useItem('tape',{cid:'kevin'});renderChat('kevin')">［物品］播放录音碎片</button>`;
  }
  // 撤回累积到一定次数，指向删除层
  if((S.flags.recallCount||0)>=3 && (S.deletedLayer||0)>=1 && !S.flags.recallHintShown){
    proHtml+=`<div class="bubble sys" style="margin-top:8px">你数了一下——他这已经是第三次把话收回去。收回去的话不会消失，只是不在这一页。</div>`;
    S.flags.recallHintShown=true;
  }
  // 回拨未知号码
  if(cid==="unknown"){
    const used=callbackUsed();
    const lock=(S.day||1)<2;
    proHtml+=`<div class="choices" style="margin-top:10px">
      <p class="muted">${lock?"信号只有一格。还拨不出去。":used?"今天已经打过了。他不会再接。":"打过去，他不说话。但背景声会告诉你他在哪。"}</p>
      <button class="choice-btn" ${(used||lock)?"disabled style=\"opacity:.45\"":""} onclick="${(used||lock)?`toast('${lock?"没信号":"他不会再接"}')`:"startCallback()"}">📞 回拨这个号码</button>
    </div>`;
  }
  document.getElementById("screen").innerHTML=`
    <div class="chat-header">
      <button class="back-btn" onclick="S.chatWith=null;S.tab='chat';render()">←</button>
      <div class="avatar" style="background:${c.color};width:36px;height:36px">${avatarHTML(c.id,36)}</div>
      <div><b>${c.name}</b><div class="muted">${cid==="unknown"?"号码不存在 · 好坏不明":"阶段 "+["前期","中期","后期"][ph]+" · 关注 "+(S.attention[cid]||0)}</div></div>
    </div>
    <div class="bubbles">${bubbles}</div>
    ${choiceHtml}${proHtml}`;
  // scroll bottom
  const sc=document.getElementById("screen"); sc.scrollTop=sc.scrollHeight;
}
function chooseReply(cid, idx){
  if(cid==="unknown"){ return unkReply(idx); }
  const replies=pendingReplies(cid);
  const r=replies[idx];
  if(!r) return;
  applyReply(cid,r);
  // offer safe stop once
  if(S.flags.anomaliesSeen>=4 && !S.flags.safeStopOffered && S.flags.warningsIgnored===0){
    S.flags.safeStopOffered=true;
  }
  renderChat(cid);
  if(checkHidden()){ triggerEnding("hidden"); }
  autoSave({now:true});
}

/* 低电心跳 */
function hbStart(){
  if(__hbIv) return;
  __hbIv=setInterval(function(){
    if(!S || S.flags.ended || S.flags.deadBattery || (S.battery||0)>32){ hbStop(); return; }
    try{
      const ac=(typeof voiceCtx==="function")?voiceCtx():null;
      if(!ac) return;
      const t0=ac.currentTime;
      [[0,52,0.10],[0.24,44,0.07]].forEach(function(x){
        const o=ac.createOscillator(), g=ac.createGain();
        o.type="sine"; o.frequency.setValueAtTime(x[1], t0+x[0]);
        g.gain.setValueAtTime(0.0001, t0+x[0]);
        g.gain.linearRampToValueAtTime(x[2], t0+x[0]+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+x[0]+0.20);
        o.connect(g); g.connect(ac.destination);
        o.start(t0+x[0]); o.stop(t0+x[0]+0.24);
      });
    }catch(e){}
  },1150);
}
function hbStop(){
  if(__hbIv){ clearInterval(__hbIv); __hbIv=null; }
  if(__hbVig){ const e=__hbVig; __hbVig=null; e.style.opacity="0"; setTimeout(function(){ if(e.parentNode) e.remove(); },1300); }
}
function hbCheck(){
  if(!S || !S.playerName || S.flags.ended){ hbStop(); return; }
  const low=(S.battery||0)<=30;
  if(low){
    if(!__hbVig){
      const d=document.createElement("div");
      d.id="lowVig";
      d.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:9000;box-shadow:inset 0 0 120px 32px rgba(88,0,0,.42);opacity:0;transition:opacity 1.6s ease";
      document.body.appendChild(d); __hbVig=d;
      requestAnimationFrame(function(){ d.style.opacity="1"; });
    }
    hbStart();
  } else hbStop();
}

function pmRingTone(){
  try{
    const ac=voiceCtx(); if(!ac) return;
    const now=ac.currentTime;
    const vol=(typeof window.__ambienceVol==="number"?window.__ambienceVol:48)/100;
    [622,466].forEach(function(f,i){
      const o=ac.createOscillator(); o.type="sine"; o.frequency.value=f;
      const g=ac.createGain();
      g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(0.11*vol,now+0.05+i*0.25);
      g.gain.setValueAtTime(0.11*vol,now+0.4+i*0.25);
      g.gain.linearRampToValueAtTime(0,now+0.55+i*0.25);
      o.connect(g); g.connect(ac.destination);
      o.start(now); o.stop(now+0.6+i*0.25);
    });
  }catch(e){}
}

/* 木马八音盒：第 N 圈升 N-1 个半音 */
function carouselBoxStop(){
  if(__cbTimer){ clearInterval(__cbTimer); __cbTimer=null; }
  if(__cbGain){ try{ __cbGain.gain.cancelScheduledValues(0); __cbGain.gain.value=0; }catch(e){} }
  __cbGain=null;
}
function carouselBoxStart(){
  if(__cbTimer) return;
  let ac=null;
  try{ ac=(typeof voiceCtx==="function")?voiceCtx():null; }catch(e){}
  if(!ac) return;
  const pass=Math.max(1,Math.min(8,(S.flags.carouselPass||1)));
  const shift=Math.pow(2,(pass-1)/12);
  const vol=(typeof window.__ambienceVol==="number"?window.__ambienceVol:48)/100;
  const master=ac.createGain();
  master.gain.value=Math.max(0.02,0.07*vol);
  master.connect(ac.destination);
  __cbGain=master;
  const seq=[0,4,7,12,7,4,0,-5];
  let i=0;
  const tick=function(){
    const f=523.25*shift*Math.pow(2,seq[i%seq.length]/12);
    const now=ac.currentTime;
    const o=ac.createOscillator(); o.type="triangle"; o.frequency.value=f;
    const o2=ac.createOscillator(); o2.type="sine"; o2.frequency.value=f*2.004;
    const g=ac.createGain();
    g.gain.setValueAtTime(0,now);
    g.gain.linearRampToValueAtTime(0.5,now+0.012);
    g.gain.exponentialRampToValueAtTime(0.0015,now+1.05);
    const g2=ac.createGain(); g2.gain.value=0.16;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o.start(now); o2.start(now); o.stop(now+1.1); o2.stop(now+1.1);
    i++;
  };
  tick();
  __cbTimer=setInterval(tick,640);
}

      S.unread[pcid]=(S.unread[pcid]||0)+1;
      try{ gainAnomaly(1); }catch(e){}
      try{ addRecord("校对 · 重复","有一条消息出现了两遍。第二遍比第一遍短。短掉的部分，不是标点。"); }catch(e){}
      setTimeout(function(){
        S.chatLog[pcid].push({from:"them",text:"……这条你是不是读过。我没有发过第二遍。真的。",type:"text",t:realTime(),read:false});
        S.unread[pcid]=(S.unread[pcid]||0)+1;
        if(S.tab==="chat" && S.chatWith===pcid) try{ renderChat(pcid); }catch(e){}
      },2800);
    }
  }

  /* SP3V · 第三天深夜：声音比画面先出错（只找你说过话的人） */
  if(d===3 && h>=21 && !S.flags.sp_voice){
    S.flags.sp_voice=1;
    const engaged=function(k){ return (S.chatLog[k]||[]).some(function(x){ return x.from==="them"||x.from==="me"; }); };
    const V=[];
    if(engaged("sunwoo")) V.push(["sunwoo","（广播里插进来一段笑声。是他的。笑到一半，停了。不是讲完的那种停。）"]);
    if(engaged("kevin")) V.push(["kevin","（有琴声。你今晚没在琴房附近。琴声是从消息列表那一层漏上来的。）"]);
    if(engaged("hyunjae")) V.push(["hyunjae","（对讲机的电流声里，有人叫了你的名字。声音是他的。他不在这层楼。）"]);
    if(!V.length) V.push(["hyunjae","（一段很轻的哼唱，像从井底传上来。你退出这个页面——它还在。）"]);
    try{ gainAnomaly(1); }catch(e){}
    try{ addRecord("声音 · 先出错","今晚先是声音不对：笑声停在半截、琴声不在琴房、对讲机里叫你的名字。放下手机，画面才开始不对。"); }catch(e){}
    V.slice(0,2).forEach(function(pair,i){
      setTimeout(function(){
        S.chatLog[pair[0]]=S.chatLog[pair[0]]||[];
        S.chatLog[pair[0]].push({from:"them",text:pair[1],type:"text",t:realTime(),read:false});
        S.unread[pair[0]]=(S.unread[pair[0]]||0)+1;
        if(S.tab==="chat" && S.chatWith===pair[0]) try{ renderChat(pair[0]); }catch(e){}
      },800+i*2800);
    });
  }

  /* 学舌 · 第二天夜里起：你说过的话从别人嘴里回来 */
  if(d>=2 && h>=22 && !S.flags.echoDone && (S.flags.said||[]).length){
    S.flags.echoDone=1;
    const said=S.flags.said;
    const line=said[said.length-1];
    const pool=CHARS.filter(function(c){ return c.id!==S.ownerId; });
    const who=pool[Math.floor(Math.random()*pool.length)];
    if(who && line){
      S.chatLog[who.id]=S.chatLog[who.id]||[];
      setTimeout(function(){
        S.chatLog[who.id].push({from:"them",text:"「"+line+"」",type:"text",t:realTime(),read:false});
        S.unread[who.id]=(S.unread[who.id]||0)+1;
        setTimeout(function(){
          S.chatLog[who.id].push({from:"them",text:"……这句我听过。是你说的。可那时候你还没说。",type:"text",t:realTime(),read:false});
          S.unread[who.id]=(S.unread[who.id]||0)+1;
          try{ gainAnomaly(1); }catch(e){}
          if(S.tab==="chat" && S.chatWith===who.id) try{ renderChat(who.id); }catch(e){}
        },2600);
      },600);
    }
  }
}

function crookWhisper(cid){
  const t=triGet();
  const pool=CROOK_WHISPERS[cid];
  if(!pool) return;
  if(!S.flags.crookIdx) S.flags.crookIdx={};
  const i=S.flags.crookIdx[cid]||0;
  let w;
  if(i<pool.length){ w=pool[i]; }
  else{
    /* 池子说完就不再复读：三次里只漏一句，且不和上一句重复 */
    if((i-pool.length)%3!==0){ S.flags.crookIdx[cid]=i+1; return; }
    const _last=(S.flags.crookLast||{})[cid];
    const _cand=pool.filter(function(x){ return x.t!==_last; });
    w=_cand[Math.floor(Math.random()*_cand.length)];
  }
  S.flags.crookIdx[cid]=i+1;
  if(!S.flags.crookLast) S.flags.crookLast={};
  S.flags.crookLast[cid]=w.t;
  const line={from:"them",text:(w.t&&w.t.indexOf("(名字)")>=0)?w.t.replace("(名字)",S.playerName||"……"):w.t,type:"text",t:realTime(),read:false};
  if(!S.chatLog[cid]) S.chatLog[cid]=[];
  S.chatLog[cid].push(line);
  S.unread[cid]=(S.unread[cid]||0)+1;
  if(w.mark==="tell"||w.mark==="tell2"){
    if(!t.seenTells[cid]) t.seenTells[cid]=[];
    const note=(TRI_NOTES||[]).filter(function(x){return x.id===cid;})[w.mark==="tell"?0:1];
    const label=note?note.t:w.mark;
    if(t.seenTells[cid].indexOf(label)<0) t.seenTells[cid].push(label);
  }
  if(typeof renderChatList==="function"){} // 由 tick 刷新
}
/* 失主三层反转 · 第一层：那句「几条未读」 */
function eleventhTick(){
  if(!S || S.flags.ended) return;
  if(S.day>=1 && S.hour>=19 && !S.flags.unreadAsked && S.chatLog && S.chatLog.hyunjae){
    const b=(DIALOGUE.hyunjae||[]).find(function(x){return x.id==="hj_unread";});
    /* 未读之问放在两句寒暄之后；玩家一直不理他则第二天兜底补发 */
    if(b && ((S.attention.hyunjae||0)>=(b.reqAtt||0) || S.day>=2)){
      S.flags.unreadAsked=true;
      injectBeat("hyunjae", b);
    }
  }
}
/* 到点就漏一句。越晚越频繁，偏执越高越频繁。
   十个人都在这张名单上，但不能同一秒全响——按“最久没说话”的顺序轮，每天限量。 */
function crookGapOf(cid){
  const t=triGet();
  const base=Math.max(20, 62-(t.paranoia||0)*0.35)-(S.day-1)*7;
  const jit=(cid.charCodeAt(0)+cid.length*3)%9;   /* 每人错开几分钟，别齐声 */
  return base+jit;
}
function crookTick(){
  const t=triGet();
  if(S.flags.ended) return;
  if(!S.flags.crookNext) S.flags.crookNext={};
  const now=absMin();
  const due=[];
  Object.keys(CROOK_WHISPERS).forEach(function(cid){
    if(now-(S.flags.crookNext[cid]||0)>=crookGapOf(cid)) due.push(cid);
  });
  if(!due.length) return;
  due.sort(function(a,b){ return (S.flags.crookNext[a]||0)-(S.flags.crookNext[b]||0); });
  const cap=Math.min(3, 1+Math.floor(((S.day||1)-1)/2));  /* D1:1 D3:2 D5:3 */
  due.slice(0,cap).forEach(function(cid){
    S.flags.crookNext[cid]=now;
    crookWhisper(cid);
  });
}

}

/* 三维度：猜疑（你怀疑他）/ 欣赏（你靠近他）/ 偏执（你怀疑得越多，园子越坏） */
function triInit(){
  if(!S.flags.tri) S.flags.tri={sus:{},adm:{},paranoia:0,nightWho:null,seenTells:{}};
  const t=S.flags.tri;
  CHARS.forEach(function(c){
    if(t.sus[c.id]==null) t.sus[c.id]=0;
    if(t.adm[c.id]==null) t.adm[c.id]=0;
  });
  if(t.paranoia==null) t.paranoia=0;
  if(!t.seenTells) t.seenTells={};
  return t;
}
function triGet(){ triInit(); return S.flags.tri; }

/* 猜疑：你标他、你质疑他、你反复看他的记录，都会涨 */
function triSuspect(cid, n){
  const t=triGet();
  t.sus[cid]=(t.sus[cid]||0)+(n||1);
  t.paranoia=Math.min(100,(t.paranoia||0)+(n||1));
  if(typeof S!=='undefined') S.flags.triDirty=true;
}
/* 欣赏：你常找他、回他的话、跟他走，都会涨 */
function triAdmire(cid, n){
  const t=triGet();
  t.adm[cid]=(t.adm[cid]||0)+(n||1);
}
/* 偏执：不针对人，针对整个园子。偏执高，灯坏得更快、字更乱、回声更多 */
function triParanoia(n){
  const t=triGet();
  t.paranoia=Math.min(100,(t.paranoia||0)+(n||1));
}

/* 那件东西：猜疑和欣赏都最高的人 */
function triVerdict(){
  const t=triGet();
  let best=null, bestSum=0, bestSus=0;
  CHARS.forEach(function(c){
    const su=t.sus[c.id]||0, ad=t.adm[c.id]||0;
    if(su<=0 && ad<=0) return;
    /* 只有被怀疑过的人才会变成"它"——但"又怀疑又离不开"的那个人最危险。
       双高：sus*adm 直接放大；单边：只算一半。 */
    let sum;
    if(su>0 && ad>0) sum = su+ad + Math.min(su,ad)*2.2;
    else sum = Math.max(su,ad)*0.55;
    if(sum>bestSum){ bestSum=sum; best=c.id; bestSus=su; }
  });
  return best;
}
/* 它长成什么样：取决于这个人的童话身份 + 你偏执的深浅 */
function triMonsterName(cid){
  const t=triGet();
  const p=t.paranoia||0;
  const c=CHARS.find(function(x){return x.id===cid;})||{name:"它"};
  if(p<30) return c.name+" · 还是他";
  if(p<60) return c.name+" · 不太对了";
  if(p<85) return c.name+" · 已经不是他了";
  return "它 · 借了"+c.name+"的样子";
}
/* 三个不对劲的人：你看见的「不对」几条了 */

function crookMark(cid, which){
  const t=triGet();
  if(!t.seenTells[cid]) t.seenTells[cid]=[];

    t.seenTells[cid].push(which);
    triSuspect(cid,2);
    gainAnomaly(1);
    toast("你记下了这件事。");

}

}

function triToneOf(cid){

  if(su+ad===0) return "";
  if(ad>=su*2 && ad>2) return "他今天对你说的话比平时多。";
  if(su>=ad*2 && su>3) return "他今天回得很短。像在等你先说完。";
  if(su>0 && ad>0) return "他说的话前后有点对不上。你没问。";
  return "";
}

function castSeenList(){
  if(!S.flags.castSeen) S.flags.castSeen=[];
  const list=S.flags.castSeen;
  CHARS.forEach(function(c){
    const heard=(S.flags.monoRead||[]).indexOf(c.id)>=0;
    const close=(S.attention&&(S.attention[c.id]||0)>=2);
    if((heard||close) && list.indexOf(c.id)<0) list.push(c.id);
  });
  return list;
}
function castMark(id){
  if(!S.flags.castSeen) S.flags.castSeen=[];
  if(S.flags.castSeen.indexOf(id)<0){
    S.flags.castSeen.push(id);
    toast("认出来了：这一条不是随机写的。");
    gainAnomaly(1);
  }
}

function openCamera(zid){
  const screen=document.getElementById("screen");

  drainBattery(2); advanceTime(4);
  if(S.flags.deadBattery||S.flags.ended){ render(); return; }
  screen.innerHTML=`<div class="area-view">
    <button class="back-btn" onclick="renderArea('${zid}')">← 放下手机</button>
    <div class="day-badge">相机 · ${esc(z.name)} · D${S.day} ${realTime()}</div>

    </div>

function shootGhost(zid,i){
  const g=(CAMERA_GHOSTS[zid]||[])[i];
  if(!g) return;
  S.flags["cam_"+(g.title||i)]=true;
  if(!S.camShots) S.camShots=0;
  S.camShots++;
  addRecord("相机·"+g.title,g.body);
  addKeyword("相机·"+g.title);
  if(g.scare) gainAnomaly(1);
  if(g.digit){
    addRecord("相机·数字痕迹",g.title+"：「"+g.digit+"」。取景框里才是正的。");
    addKeyword("密码"+g.digit);

  if(typeof showCluePopup==="function"){
    showCluePopup("相机 · "+g.title,g.body+(g.scare?"\n\n（异常感上升）":"")+(g.digit?("\n\n取景框角落有一个手写的「"+g.digit+"」，肉眼看不见。"):"")+"\n\n已写入记录。",{tag:"只有相机看得见",scare:g.scare?"glitch":null});

}

    <button class="back-btn" onclick="S.tab='home';render()">← 主页</button>
    <h3>录音机</h3>
    <p class="muted">本地残片 · 无云同步</p>
    ${html}
    <button class="btn ghost" onclick="toast('麦克风被占用：来源未知');drainBattery(1)">开始新录音</button>
  </div>`;
}
/* —— 语音消息：不加载音频文件，用 WebAudio 现场合成「贴着话筒的呼吸声」 —— */
let __voiceAC=null;
function voiceCtx(){
  try{
    if(!__voiceAC) __voiceAC=new (window.AudioContext||window.webkitAudioContext)();
    if(__voiceAC.state==="suspended") __voiceAC.resume();
    return __voiceAC;
  }catch(e){ return null; }
}
function playVoiceNote(el, label){
  const ac=voiceCtx();
  drainBattery(0.6);
  if(!ac){ toast("这台设备放不出这段声音"); return; }
  const late=typeof isLateNight==="function" && isLateNight();
  const dur=2.1+Math.min(2.6,(label||"").length*0.05)+(late?0.6:0);
  const now=ac.currentTime;
  // 呼吸：带通噪声
  const buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const t=i/ac.sampleRate;
    const env=Math.sin(Math.PI*(t/dur));
    const breath=0.55+0.45*Math.sin(t*(late?2.2:3.4)+1.2);
    d[i]=(Math.random()*2-1)*env*breath;
  }
  const src=ac.createBufferSource(); src.buffer=buf;
  const bp=ac.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=late?320:430; bp.Q.value=0.8;
  const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1500;
  const g=ac.createGain();
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(0.2,now+0.22);
  g.gain.setValueAtTime(0.2,now+dur-0.45);
  g.gain.linearRampToValueAtTime(0,now+dur);
  src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(ac.destination);
  // 人声底色 + 轻微颤动
  const osc=ac.createOscillator(); osc.type="sine"; osc.frequency.value=late?102:126;
  const og=ac.createGain();
  og.gain.setValueAtTime(0,now); og.gain.linearRampToValueAtTime(0.05,now+0.35); og.gain.linearRampToValueAtTime(0,now+dur);
  const lfo=ac.createOscillator(); lfo.frequency.value=late?4.2:5.6;
  const lg=ac.createGain(); lg.gain.value=0.018;
  lfo.connect(lg); lg.connect(og.gain); osc.connect(og); og.connect(ac.destination);
  src.start(now); osc.start(now); lfo.start(now);
  src.stop(now+dur+0.05); osc.stop(now+dur+0.05); lfo.stop(now+dur+0.05);
  if(el){ el.classList.add("playing"); setTimeout(()=>el.classList.remove("playing"),Math.round(dur*1000)); }
  if(late && Math.random()<0.35){
    setTimeout(()=>{ try{ if(typeof ambienceScareSting==="function") ambienceScareSting(); }catch(e){} }, Math.round(dur*1000*0.82));
  }
}
function playRecorderClip(i){
  drainBattery(2);
  advanceTime(1);
  if(i===1 && S.day>=2){
    gainAnomaly(1);
    addKeyword("无声口型");
    toast("……什么也没听见。电量却掉了。");
    if(typeof ambienceScareSting==="function") ambienceScareSting();
  } else if(i===0){
    toast("风声。像喷泉停了一拍。");
  } else {
    toast("空白。录音灯却亮过。");
    gainAnomaly(1);
  }
}

window.onload=()=>{
  S=defaultState();
  if(typeof syncAnomalyAlias==="function") syncAnomalyAlias();
  // 刚被系统回收过（20 分钟内）就直接接回，不再让玩家从标题页重来
  /* —— 安全网：任何未捕获错误只提示，不让游戏整个崩掉 —— */
  window.addEventListener("error", function (e) {
    try{ if(typeof toast==="function") toast("出了点小问题，已自动恢复"); }catch(_e){}
  });
  window.addEventListener("unhandledrejection", function (e) {
    try{ e.preventDefault(); }catch(_e){}
    try{ if(typeof toast==="function") toast("出了点小问题，已自动恢复"); }catch(_e){}
  });
  /* —— CG 预热：提前解码贴脸/空地图，首次触发不卡顿 —— */
  try{
    ["facecg","emptycg","ledgercg"].forEach(function(k){
      const s=(typeof PARK_IMG!=="undefined")?PARK_IMG[k]:null;
      if(s){ const im=new Image(); im.src=s; }
    });
  }catch(e){}
  if(!resumeLastSession()) render();
  // 切后台 / 关页面前强制落盘——iPhone 回收页面是静默的，只能抢在前面存
  const flush=()=>{ try{ flushAutoSave(); }catch(e){} };
  const leave=()=>{ try{ flushAutoSave(); }catch(e){} try{ memOnLeave(); }catch(e){} };
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden"){ flush(); try{ memOnHide(); }catch(e){} }
  });
  window.addEventListener("pagehide", leave);
  window.addEventListener("beforeunload", leave);
  setInterval(()=>{
    if(document.hidden) return; /* 后台休眠：切走时不跑主循环 */
    if(S.flags.ended||!S.playerName) return;
    updateStatus();
    if(typeof tryStatusJumpFace==="function" && S.battery<28 && Math.random()<0.08) tryStatusJumpFace();
    if(typeof maybeOwnerPing==="function") maybeOwnerPing({fromTimer:true});
    if(typeof crookTick==="function") crookTick();
    if(typeof eleventhTick==="function") eleventhTick();
    try{ if(typeof horrorTick==="function") horrorTick(); }catch(e){}
    try{ if(typeof hbCheck==="function") hbCheck(); }catch(e){}
    try{ if(typeof selfMoveTick==="function") selfMoveTick(); }catch(e){}
    try{ if(typeof callTick==="function") callTick(); }catch(e){}
    try{ if(typeof metaStoneTick==="function") metaStoneTick(); }catch(e){}
  }, 4000);
  // 每 45 秒兜底存一次，防止长时间翻备忘录被清掉
  setInterval(()=>{ if(!document.hidden && S.playerName && !S.flags.ended) autoSaveNow(); }, 45000);
};

<script>
/* 新版本提示：Service Worker 更新后提示刷新，避免主屏旧版一直吃缓存 */
(function(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol!=="http:" && location.protocol!=="https:") return;
  var pending=null, shown=false;
  function showBar(){
    if(shown || document.getElementById("swUpdBar")) return;
    shown=true;
    var d=document.createElement("div");
    d.id="swUpdBar";
    d.innerHTML='<span>本作已更新 · 有新内容</span><button type="button" class="swgo">刷新</button><button type="button" class="swx" aria-label="关闭">×</button>';
    var go=d.querySelector(".swgo"), x=d.querySelector(".swx");
    go.onclick=function(){
      try{ if(pending) pending.postMessage({type:"SKIP_WAITING"}); }catch(e){}
      setTimeout(function(){ location.reload(); }, 300);
    };
    x.onclick=function(){ d.remove(); shown=false; };
    document.body.appendChild(d);
    setTimeout(function(){ var el=document.getElementById("swUpdBar"); if(el) el.remove(); shown=false; }, 25000);
  }
  navigator.serviceWorker.ready.then(function(reg){
    if(reg.waiting && navigator.serviceWorker.controller){ pending=reg.waiting; showBar(); }
    reg.addEventListener("updatefound", function(){
      var nw=reg.installing;
      if(!nw) return;
      nw.addEventListener("statechange", function(){
        if(nw.state==="installed" && navigator.serviceWorker.controller){ pending=nw; showBar(); }
      });
    });
    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState==="visible"){ reg.update().catch(function(){}); }
    });
  }).catch(function(){});
})();
</script>

  });
